  - heading: "判讀與下週重點"
    blocks:
      - bullets:
          - "本週成長主要靠更多客戶、更分散的商品，客單和黑卡貢獻都下降。"
          - "新客占比 6.4%，低於近 4 週的約 8%；IG 新客折扣碼導流有限。"
          - "中秋快閃在 9/28 結束，預期下週回落。"
          - "PDRN 第一批買家陸續進入每瓶 10–15 天的回購期，可準備回購名單。"
