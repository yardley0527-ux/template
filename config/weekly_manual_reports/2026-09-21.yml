          - "IG「新客」與訂單系統的新客可能不同：本期訂單系統首購新客 21 人、$170,870，PDRN IG 新客碼使用者 13 人、$171,020，其中黑卡 4 人，人數與卡別對不上；「IG 新客」可能是新領碼的人，不一定是首購。"
