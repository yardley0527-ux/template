    - "寶貝\n謝謝你的關愛\n在這一次黑薑活動\n真的超聰明買了這麼多瓶\n\n這邊有一些小細節要叮嚀你\n\n\U0001F389好好吃，真的會讓你變瘦\n\n謝謝妳支持大組數的黑薑\n\n為了讓黑薑的能量發揮到極致\n\n以下幾個食用重點一定要記下來：\n\n\U0001F4CD
      為什麼一定要「飯後」吃？\n薑黃素屬於脂溶性營養素，簡單來說，它需要「油脂」作為媒介，身體才能順利吸收\n\n\U0001F4AB飯後或隨餐吃\n\n藉由食物中的脂肪帶路，吸收率會提升非常多，才不會浪費掉這麼好的營養成分\n\n\U0001F48A
      針對不同需求的食用建議\n\n\n【一般體態管理】\n頻率： 一天 2 次\n份量：每次 3 顆\n\n【極效瘦身加強版】\n頻率：一天 3 次\n份量：每次
      3 顆\n早、中、晚三餐飯後各 3 顆\n\n如果你再搭配其他保健食品有任何問題\n你再問我們\U0001F49C"
  - name: 益生菌
    messages:
    - "寶貝\n收到苼莛的韓國專利 LAB2PRO300億益生菌之後\n\n你需要知道\n你以前一直以為益生菌一定要空腹吃，其實是\n\n因為\U0001F447\n\U0001F539
      沒技術、沒保護的益生菌 → 只能空腹吃\n（只是為了避免被胃酸殺掉）\n\n但\U0001F447\n✨ 有技術、有保護設計的益生菌 → 飯前飯後吃都可以\n\n所以吃益生菌真正的重點\n從來都不是「幾點吃」，\n而是——\n\n\U0001F449
      你吃的益生菌，有沒有被設計成「真的能活到腸道」\n\n我從韓國談回來的活菌300億益生菌\n\n就是專門設計成\n\U0001F449 能通過胃酸\n\U0001F449
      活到 小腸＋大腸\n\U0001F449 在腸道裡真正留下定殖的好菌\n\n怎麼吃最簡單？\n\n早上空腹、晚睡前、飯前、飯後 都可以\n選你 最不容易忘記的時間
      就好\n\n\n✔ 習慣早上吃 → 早上吃\n✔ 習慣晚上吃 → 晚上吃\n\n\n包數這樣抓：\n\n✔ 有過敏體質：一天 2 包\n✔ 沒有過敏：一天
      1 包\n✔ 想加強代謝、體態管理：一天 2 包\n\n不穩定吃、吃得久，才是關鍵 \U0001F90D\n\n很多寶貝會問：\n吃益生菌大概要多久才會有感？\n\n其實會依「身體反應的類型」不太一樣\n\n✨
      打噴嚏的人\n大約 3～5 天，就會慢慢感覺到差異\n\n✨ 常流鼻水、鼻子不舒服的人\n大約 5～7 天，狀況會開始比較穩定\n\n✨ 皮膚型過敏、像是異位性皮膚炎\n通常需要
      28 天\n因為這一類不是表面問題\n而是跟 腸道菌相＋免疫平衡＋皮膚屏障 有關\n\n益生菌的作用針對皮膚不是立刻壓下去\n而是需要 每天穩定補充\n讓好菌在腸道裡
      越來越多、越來越穩定\n等腸道環境被顧好\n皮膚的防禦力與屏障修護，才會慢慢跟上\n\n所以重點\n穩定吃\U0001F90D"
    - "寶貝\U0001F90D\n\n收到苼莛韓國專利 LAB2PRO 300億益生菌後，\n有件事一定要知道！\n\n很多人以為益生菌一定要空腹吃，\n其實是因為\U0001F447\n\n\U0001F539
      沒技術、沒保護的益生菌 → 只能空腹吃\n（只是為了避免被胃酸殺掉）\n\n但\U0001F447\n✨ 有技術、有保護設計的益生菌 → 飯前飯後吃都可以\n\n所以吃益生菌真正的重點\n從來都不是「幾點吃」，\n而是——\n\n\U0001F449
      你吃的益生菌，有沒有被設計成「真的能活到腸道」\n\n✔ 早上吃可以\n✔ 晚上吃也可以\n\n建議食用量：\n• 一般保養：一天1包\n• 過敏體質／想加強代謝／體態管理：一天2包\n\n多久會有感？\n\n✨
      打噴嚏：約3～5天\n✨ 常流鼻水：約5～7天\n✨ 異位性皮膚炎等皮膚問題：約28天\n\n尤其皮膚問題需要時間調整腸道菌相與免疫平衡，\n因此持續補充比吃很多更重要。\n\n\U0001F90D
      每天穩定吃，好菌才能慢慢建立，\n讓腸道與身體維持健康狀態。\n\n如果有任何問題，都歡迎隨時問我\U0001F493"
  - name: 蝦紅素
    messages:
    - "親愛的寶貝～\U0001F497\n\n謝謝你支持我們\n一口氣帶走6盒以上的「專利蝦紅素」\n\n為了讓效果更有感\n執行長 & 健康管理師想先了解\n妳比較在意哪方面呢：\n\n\U0001F440眼睛乾澀、疲勞、畏光、眼壓高\n\U0001F453高近視度數（有/無動過手術）\n\U0001F468\U0001F3FB‍\U0001F9B3或是給家中長輩一起補充，預防黃斑部病變等等\n\n蝦紅素補充超方便\n\n✨
      一天吃一次✨\n早餐或午餐飯後，基本保養2粒、加強保養3粒，\n如果是針對眼睛有強烈不舒服，\n可以先補充4粒，維持7-14天，\n症狀改善後，再恢復基本保養喔❤️\n\n\U0001F990內含「日本專利天然蝦紅素」＋「維生素AE抗氧化複方」，\n能深入眼底對抗藍光氧化壓力，\n穩定眼壓、減緩疲勞、維持水潤清晰感～\n\n寶貝～再麻煩你回覆給我們，\n讓我們可以協助你改善眼睛的不舒服，\n達到最好的眼睛保養效果\U0001F496"
  - name: 清纖粉
    messages:
    - "親愛的，瘦瘦粉非常神奇喔\U0001F60A\n\n\n日本原裝進口『餐前阻斷專家』\U0001F525\n\n這次姐姐親自在日本研發、\n並且全程在日本製造，\n更把日本最強、最熱門的瘦身成分，\n通通一次放進這個『餐前阻斷專家』裡✨\n\n從今天起，放心享受美食，\n再也不用擔心糖分和油脂的負擔！\n\n\U0001F539
      餐前30分鐘，輕鬆補充一包 \U0001F539\n\n✨雙重阻斷，糖分油脂一網打盡✨\n\n\U0001F370 糖分阻斷：\n想吃甜點、手搖飲，\n又怕血糖飆高、體脂肪暴增？\n餐前一包，幫妳阻隔糖分吸收，\n享受甜食不再罪惡，讓妳開心吃，安心瘦\n\n\U0001F354
      油脂阻斷：\n炸物、燒烤、火鍋聚餐難以拒絕？\n別擔心，餐前補充一包\n輕鬆阻斷油脂吸收，\n吃得再油膩，也能輕鬆回歸輕盈日常\n\n\U0001F538三大關鍵功效：\n1️⃣
      阻斷糖分吸收，穩定血糖不飆升\n2️⃣ 阻斷脂肪吸收，輕鬆享受高熱量飲食\n3️⃣ 調整腸道環境，促進代謝更順暢\n\n⚠️一定要記得餐前吃，跟薑黃代謝不一樣⚠️\n\n它的功能超厲害，\n飯前吃就能輕鬆阻斷糖分和油脂吸收，\n不再怕聚餐、宵夜、甜點會讓妳發胖！\n享受美食同時維持好體態，\n讓妳吃得安心又放心\U0001F525\n\n如果當天有聚餐會有高油高熱量的食物♥️\n可以多增加1～2包喔\n\n\U0001F3C6
      我們的保健食品在 2024 與 2025 連續榮獲三項大獎\n品質安心有保障！\n\U0001F4E2 ✨ 2024 亞太 Bio 健康生技大獎\n\U0001F4E2
      ✨ 2024 國家品牌玉山獎\n\U0001F4E2 ✨ 2025 亞太 Bio 健康生技大獎"
  - name: 膠原蛋白
    messages:
    - "親愛的❤️\n\n看到妳帶走 4 盒以上 的膠原蛋白\n真的超級感動！\n\n這代表妳非常看重這 100 天 的保養承諾\n這一包富含 15g 膳食纖維
      ＋ 6000mg 膠原蛋白\n是讓妳變漂亮、變乾淨的關鍵秘密 \U0001F511\n\n現在 3 月正值換季代謝黃金期，\n這組「最有感」吃法請一定要收好：\n\n\U0001F48E
      膠原蛋白「逆齡＋飽足」最強攻略\n\n早上空腹 1 包（吸收率最高）\n這點拜託一定照做！\n空腹是讓 6000mg 膠原蛋白精準補給的最佳時機\n讓肌底「膠原水位」逆勢衝高\n\n搭配500cc
      常溫水 \U0001F95B\n15g 膳食纖維遇水會發揮作用\n讓腸道舒服、代謝更順暢\n還能穩住血糖\n\n\U0001F48A手邊若有白藜蘆醇、NMN
      或益生菌、代謝錠\n通通可以一起吃\n效果加乘不衝突\n\n\U0001F308 堅持 100 天，妳會看到的驚喜變化\n視覺減齡： 皮膚更緊、更澎、更水嫩。✨\n細緻透亮：
      毛孔縮小，氣色像內建濾鏡。\U0001F4F8\n控管食慾： 飽足感提升，不容易想亂吃零食。\U0001F957\n輕盈代謝： 告別浮腫，明顯感覺整個人變輕盈。\U0001F3C3‍♀️\n\n這
      100 天\n我們一起努力在春天迎接最完美的狀態\n讓美力如期而至！\U0001F339✨"
  - name: 魚油
    messages:
    - "寶貝～\n\n看到這次妳帶回了整組【98.6% 高濃度頂級黃金魚油】\n真的替妳超開心\U0001F60A\n\n這款濃度很高、吸收速度又快\n\n為了讓妳吃得更有感、更有效率\n所以我們執行長&健康管理師、想先了解一下\n這次妳主要想改善哪個方向呢？\n\n1️⃣
      預防心血管問題（降低三高風險）\n2️⃣ 增加腦部專注力、記憶力、思緒清晰度\n3️⃣ 改善痘痘粉刺、調節皮脂分泌\n4️⃣ 改善過敏體質（鼻子、氣管、肌膚）\n5️⃣
      幫助抗發炎、減少身體慢性不適\n6️⃣ 舒緩眼睛疲勞、乾眼、長時間用眼不適\n7️⃣ 調整情緒、舒緩焦慮、提升睡眠品質\n8️⃣ 改善經期前後的情緒波動、身體不適\n9️⃣
      促進新陳代謝、體態管理更順利\n\n只要知道妳最在意的重點\n我就能幫妳「微調吃法與顆數」\n讓妳的魚油吃得更精準、效果更明顯\n\n而且魚油是「脂溶性營養」\n一定要每天固定補充\n才能讓體內
      EPA/DHA 濃度維持在有效區間\n效果才會更明顯、身體更有感\n\n如果妳手邊還有其他像是\n【代謝錠、黑薑、B群、蝦紅素】\n也可以一起跟我說唷\n\n我會幫妳搭配出\n「最適合妳體質、最有效的吃法組合」\n\n等妳回覆後，我就幫妳安排妳的專屬建議\U0001F49B"
  - name: 私密粉
    messages:
    - "親愛的寶貝～\U0001F497\n\n謝謝你支持我們\n一口氣帶走 5 盒以上的「頂規三合一私密防護粉」！\n是要分給家人一起食用～\n還是自己一個人服用呢？\U0001F64B‍♀️\n\n為了讓效果更有感\n執行長
      & 健康管理師想先了解\n妳比較在意哪方面呢：\n\n\U0001F338 分泌物的狀況\n\U0001F6E1️ 容易反覆發炎\n\U0001F525
      乾澀或搔癢\n\U0001F4A7 還是看到成分表有添加 80 mg 口服玻尿酸，想要改善肌膚乾燥／提升保濕感呢？\n\n—\n\n\U0001F4A1
      正確吃法小提醒：\n\U0001F449 每天晚上睡前空腹吃一包，吸收效果最好！\n\U0001F449 如果覺得私密處特別不舒服，可以 早上再加強一包（也是空腹吃）\n\U0001F449
      可以和所有空腹的保健食品一起吃，沒有問題～\n\n寶貝～再麻煩妳回覆給我們，讓我們可以協助你變得更健康、更漂亮 \U0001F496"
  - name: 穀胱甘肽
    messages:
    - "親愛的\U0001F495\n\n看到你一次帶走 6 盒以上的穀胱甘肽亮妍飲\n\n頂級美白抗老四大成分\n✨ 穀胱甘肽\n✨ PQQ\n✨ 麥角硫因\n✨
      熊果素\n\n是目前苼莛高端的美白抗老保健食品\n\n我也想特別跟你說~\n為什麼要安排在睡前喝\n\n\n因為穀胱甘肽這個成分\n它其實是我們肝臟裡本來就必須要有的\n\n當你補充足量的穀胱甘肽\n就像是幫肝臟升級\n原本肝臟只是用掃把慢慢清毒素\n現在直接給肝臟一台吸塵器\n排毒效率超好\n\n\n所以建議\n\U0001F319
      放在睡前的床頭櫃\n看到了，睡前就喝一瓶✨✨\n\n連續喝 10 天\n是為了把體內濃度提高\n而你一次準備這麼完整\n就可以接著繼續喝\n讓皮膚做一個有計畫、有完整性的重新調整\n\n✔
      深層細胞修復\n✔ 擊退黑色素\n✔ 改善蠟黃、暗沉、痘印\n\n10瓶一定要「連續喝」\n讓體內濃度達到飽和\n才能真正深入肌膚底層\n\n☀️ 白天起床\n再搭配美白膠囊\n幫你防禦紫外線傷害\n不讓變黑有機會發生"
  - name: D鈣
    messages:
    - "親愛的，謝謝妳 \U0001F495\n謝謝妳選擇 苼莛的 D＋K＋硼＋海藻鈣\n\n姐姐想先跟妳說一件事：\n為了讓妳吃得更精準、效果更明顯，\n我們家的這一組配方，真的跟外面很不一樣\n\n我們在\n✔
      原料等級\n✔ 純度比例\n✔ 劑量層級\n✔ 骨代謝的協同設計\n都跟市面上有很明顯的差異\n\n大部分品牌做的是「補鈣」\n而苼莛做的是——\n讓鈣真的進骨頭、留下來\n\n所以吃法對了，效果才會完整發揮
      ✨\n\n小小提醒一下 \U0001F4A1\n\U0001F449 維生素 D 是脂溶性營養\n一定要在 飯後食用\n鈣不能跟鐵同時一起吃\n\n姐姐會幫妳安排在白天飯後吃\n吸收度會更好，身體的體感也會更明顯\n接下來的圖卡請你參考，你是屬於哪一組吃法！"
  - name: 2.0面膜
    messages:
    - "親愛的\n\n看到妳這次帶了大組數的面膜\n一定要跟妳分享幾個使用小技巧\U0001F4AB\n\n因為這款是生物纖維面膜\n吸收度很好、服貼度也很高\n\n建議妳可以這樣用\n\n✅敷之前\n先把袋子裡的精華輕輕帶在臉上\n\n再把面膜敷上\n效果會更完整\n\n敷完之後\n可以依照妳平常的保養習慣\n\n✅如果妳喜歡清爽一點\n可以稍微沖洗\n\n如果想讓
      2% 傳明酸精華多停留\n不洗也沒有問題\n\n生物纖維的優點就是\n貼合度高、吸收快\n所以不洗掉也會很舒服\n\n妳可以慢慢感受\n找到最適合妳的方式\n\n之後有任何問題\n都可以再跟我說\U0001F49C"
- key: omnipotent
  title: 全能膠囊
  icon: fa-capsules
  description: 依序發送
  messages:
  - title: 訊息 1｜全能膠囊衛教
    content: "姐姐來私房衛教嘍    全能膠囊\n\n‼️它是純天然食物萃取的頂級營養\n這一瓶\n\n真正可以滿足現代人日常營養需求的綜合維他命 \n\n\U0001F4AB
      完整 8 種 B 群（B1～B12）\n\n\U0001F4AB 足量維他命 C\n\n\U0001F4AB 足量高純度鋅\n\n而且最重要的是\n拋棄化學合成原料\n\n全部選擇來自天然食物萃取來源
      \n\n尤其是頭髮最需要的營養\n\n生物素B7 最高濃度\n鋅也是符合軟體一天吃到最高15毫克\n維他命C100毫克\n\n身體願意吸收與利用\n\n所以每一個維生素加到足量\n\n針對有長頭髮\n改善落髮\n養髮的需求者\n更是非常適合\n\n有困擾的人吃了\n會增加髮量\n\n沒有困擾的人\n吃了會讓髮量變更多\n\n\n\U0001F680
      前期全力灌溉｜一日 6 顆（加強版）\n\n如果你正處於落髮焦慮、更年期準備、或是髮際線正需要大量建材的關鍵期\n請毫不猶豫地啟動一日 6 顆\n\n第一餐後
      3 顆、第二餐後 3 顆\n\n\n\n• \U0001F337 後期穩健養護｜一日 4 顆（日常版）\n\n當你連續吃了一陣子，驚覺自己的髮際線、眉毛、睫毛都已經細細密密地「冒出新髮」\n\n而且冒出來的豐盈髮量已經達到妳自己非常滿意\n\n這時候，你就可以調回一日
      4 顆（第一餐餐後 2 顆、第二餐後 2 顆）\n\n每日補充綜合維他命基本維生素營養滋養"
  - title: 訊息 2｜鐵質注意事項
    content: "如果另外有補充「鐵質」\n\n\n這段一定要拿紅筆劃重點 \n\n\n如果你平常有在吃鐵，千萬不能跟全能膠囊在同一餐一起吞下去喔！ \n\n\n\n因為我們的全能膠囊裡面，含有非常足量且高規格的
      微量元素 鋅\n\n\n在人體的小腸吸收機制裡\n\n鐵\n跟\n鋅\n是用同一個吸收通道的\n\n它們在身體裡是競爭對手\n\n如果你在同一時間把兩樣都吃進去，它們會在腸道裡打架、互相排擠\n\n導致兩個人的吸收率都大幅打折\n\n\n這樣你辛辛苦苦補進去的頂級營養，身體就沒辦法完美吸收，真的太浪費、太可惜了
      \n\n最聰明的「錯開吃法」：\n\n\n為了讓鐵跟鋅都能發揮 100% 的功力，最好的方式就是把時間完全隔開 \n\n\n\n• ☀️ 全能膠囊：建議早上吃\n一早起床或早餐後，先吃全能膠囊，讓裡面的活性B群、維生素C和鋅直接幫妳拉滿一整天的能量與美麗防護網\n\n\n\n•\U0001F319
      鐵質：挪到晚上吃\n\n\n而且完全避開了白天的鋅\n\n\n讓雙方吸收率直接拉到最高標"
- key: whitening
  title: 美白膠囊
  icon: fa-star
  description: 依序發送
  messages:
  - title: 訊息 1｜美白膠囊介紹
    content: "親愛的 謝謝你詢問我的美白膠囊～\n無論是膚色暗沉、色素不均、斑點，\n或是熬夜、壓力大導致肌膚狀況變差，甚至是產後、更年期肌膚失去光澤\n都可以透過這一瓶改善\U0001FAF6\U0001F3FB\U0001F60A\n\n我們家的產品特色就是全部都由「天然食物萃取、不含化學合成」，所以產品效果非常好✨\n\n\n【白藜蘆醇+NMN原生植萃膠囊】>專攻抗老、淡斑、美白\n\n✅哈佛教授認證的配方\n\n\U0001F4CC
      關鍵成分：\n✨ 加拿大葡萄皮白藜蘆醇：強效抗氧化，幫助淡化色斑，讓肌膚更加透亮！\n✨ 日本花椰菜 & 台灣酵母NMN：促進青春因子NAD+的合成，減緩衰老！\n✨
      法國香瓜萃取SOD：抗氧化力超強，修復受損肌膚，讓肌膚充滿活力！\n✨ 綠茶兒茶素：減少色素沈澱，讓肌膚看起來更年輕！\n✨ 日本柑橘橙皮素：均勻膚色，抗發炎，幫助肌膚保持水嫩光澤！\n這一瓶，就能對抗暗沉、色斑和衰老，讓肌膚白皙、光澤，回到年輕狀態！"
  - title: 訊息 2｜搭配膠原蛋白
    content: "除此之外，想讓膚況更上一層樓的話，強烈推薦你搭配“膠原蛋白”\n\n【日本膳食纖維15g+燕窩德日金鑽膠原蛋白飲】\n最大的特色就是我們一包就超足量\n—15g膳食纖維+6000mg膠原蛋白—\n\U0001F4CD
      專利成分：\n\L✨ 日本NEO魚皮膠原：雙倍專利加乘，提升臉部彈性支撐，澎潤有感！（最貴最好的膠原種類）\L\n ✨德國專利水解膠原蛋白：有實驗證實，能改善肌膚彈性、減少皺紋，讓你從臉到身體都充滿彈力！\n\U0001F525還有15g日本膳食纖維，讓你在早上空腹吃一包穩定血糖，增加飽足感，對於維持身材、減重非常有幫助❤️\n以及金絲燕窩、神經醯胺等強效成分，讓肌膚不僅美麗，更加濕潤、細緻、充滿彈性！\n\n為什麼這兩樣一起吃效果更好？\n\n\U0001F4CD
      雙效美肌，超強加乘 —— 膠原蛋白補充肌膚彈性，美白膠囊幫助淡斑透亮，\n兩者結合 不只是白，而是Q彈、透亮、細膩一次到位！\n\U0001F4CD 淡斑
      x 透亮 x Q彈，效果更快！ —— 美白膠囊裡的白藜蘆醇 + NMN + SOD + 兒茶素，\n強效抗氧化、對抗暗沉，搭配膠原蛋白的高濃度滋養，養出發光系肌膚！\n\U0001F4CD
      抗糖抗氧，延緩肌膚老化 —— 現代人飲食容易造成糖化，導致膠原蛋白流失，\n美白膠囊的抗氧配方 + 膠原蛋白的高效修護，幫助減少糖化黃氣，肌膚更緊緻、更年輕！\n\U0001F4CD
      高效吸收，早上空腹吃效果最好！ —— 早晨是身體吸收最好的黃金時間，\n空腹吃能幫助營養直達肌底，一天從第一口開始就開啟美肌模式！\n這個組合就是美白
      + 透亮 + Q彈 + 緊緻 + 修護 一次到位！"
  - title: 訊息 3｜得獎認證
    content: "\U0001F3C6 我們的保健食品在 2024 與 2025 連續榮獲三項大獎，品質安心有保障！\n\U0001F4E2 ✨ 2024
      亞太 Bio 健康生技大獎\n\U0001F4E2 ✨ 2024 國家品牌玉山獎\n\U0001F4E2 ✨ 2025 亞太 Bio 健康生技大獎\"\n\n\U0001F6D2
      下面是賣場，也讓你參考看看喔\nhttps://reurl.cc/GGRN5y\n\n如果你有興趣的話，非常推薦你可以現在下單，因為是最划算的價格\U0001F60A\n我們現在也有信用卡以及無卡
      3期/6期利率全部我們吸收\U0001F525 圖卡給親愛的參考❤️ \n有任何問題都歡迎隨時請教我喔❤️"
  - title: 訊息 4｜暗沉原因說明
    content: "\U0001F539 肌膚暗沉、色素沉澱的原因包括：\n\n\U0001F7E0 黑色素累積：長時間日曬、熬夜、壓力大，導致黑色素過度生成，影響膚色均勻度。\n\U0001F7E0
      氧化壓力過高：自由基增加，影響皮膚透明感，使肌膚顯得疲勞蠟黃。\n\U0001F7E0 細胞代謝變慢：年齡增長、作息不規律，導致肌膚自我修復速度下降，影響亮度與光澤感。\n\U0001F7E0
      血液循環不佳：導致氣色不均勻、膚色偏黃或無光澤。"
  - title: 訊息 5｜食用方式
    content: "食用方式\n\n這裡是「白藜蘆醇+NMN原生植萃膠囊」的食用方式哦～\n（請幫我們空腹吃）\n\n✨煥白嫩膚、改善暗沈✨\n1日2次，1次2粒\n\n✨淡化斑點、逆齡抗衰✨\n1日2次，一次3粒\n\n如果你有以下肌膚問題，我超推薦你試試這款膠囊：\n❣️想淡化色斑或痘疤\n❣️改善暗沈，讓膚色更均勻\n❣️預防肌膚黑色素沈澱\n❣️抗老化，減少皺紋和細紋\n❣️改善痘痘肌！\n\n⚠️還有，如果你是經常熬夜、習慣吃外食，或長時間待在戶外的女孩們，\n這款膠囊更是你的救星！\n\n因為這些狀況會讓肌膚油水不平衡，成為自由基的溫床，\n加速暗沈、老化、皺紋和痘痘的生成～\n\n所以，請你一定要吃，讓我們一起變美吧！\U0001F493"
- key: metabolism
  title: 代謝錠
  icon: fa-fire
  description: 依序發送
  messages:
  - title: 訊息 1｜詢問代謝狀況
    content: "親愛的謝謝你詢問我的代謝錠\U0001F60A\n\n✨想問問你最近有常熬夜壓力大、容易覺得疲勞的問題嗎？\n還是怎麼吃都容易脹氣、水腫，小腹怎麼都瘦不下來呢？\n\n其實很多人都有一樣的困擾，明明飲食有控制、還常運動，\n但代謝一差，整個人就卡卡的\U0001F635‍\U0001F4AB實際上不是你瘦不下來，而是代謝沒啟動！\n\n姐姐真心推薦你試試我們的【比利時代謝錠】，\n真的很多人用了都私訊我：「水腫退了，臉變小、褲子也鬆了\U0001F60D」\n\n\U0001F447這邊是大家食用完的變美心得，先點進來跟我一起看看大家的變化❤️\nhttps://www.instagram.com/stories/highlights/18103185445432268/"
  - title: 訊息 2｜代謝錠介紹
    content: "姐姐跟你說哦，\n我的比利時代謝錠\U0001F331\n\n▸ 無添加任何賦形劑，吃進去很快就可以開始作用，天然、安心又有效！\n⭕️
      孕媽咪、產後媽咪、小孩都可以放心食用\n\n是用「蔬果三大酸」來幫助身體開啟能量引擎，\n從根本提升代謝效率，不是靠刺激燃脂的方式，而是溫和、有效又安心✨\n\n比利時代謝錠關鍵成分，蔬果有機三大酸：\n\n✔
      檸檬酸 → 促進能量代謝，幫你燃脂＋分解乳酸，精神變好\n✔ 蘋果酸 → 加速乳酸代謝、抗疲勞，讓身體不再卡卡\n✔ 琥珀酸 → 提升細胞能量轉換，打通循環、改善手腳冰冷＆水腫\n\n這三種天然水果酸，是幫你燃脂＋抗疲勞＋消水腫的黃金組合！\n\n能啟動身體內的「檸檬酸循環（TCA
      Cycle）」，\n\n幫助：\n✨ 提高代謝率，讓燃脂變得更有效率\n✨ 減少疲勞與酸痛感\n✨ 改善水腫、促進循環\n✨ 穩定血糖，減少脂肪囤積的機會\n\n代謝錠特別適合：\n\n\U0001F538
      壓力大、常熬夜、容易疲勞、腸胃脹氣的人\n\U0001F538 水腫嚴重、生理期前後特別腫、瘦不下來的人\n\U0001F538 體力差＋代謝變差，想改善體質的人\n\U0001F538
      正在減肥但效果不理想的人\n\U0001F538 精神不濟、希望改善體內循環、提升能量的人\n\n可以告訴姐姐你的生活作息或代謝狀況，姐姐都會陪你一起調整❤️"
  - title: 訊息 3｜用戶心得
    content: "✨ 另外再偷偷告訴你一個秘密~我們的用戶使用後，\n95%的人發現毛孔縮小，粉刺消失，\n88%的人有感消脹氣，小腹不見！\n\n\U0001FAF6\U0001F3FB真的很多女生就是從這裡開始變輕盈、變美的！\n如果你願意跟我分享目前遇到的問題，\n我可以幫你挑選最適合你的搭配方式，\n幫你有效開啟代謝唷\U0001F4AA\U0001F3FB✨\n\n讓姐姐陪著你一起變健康變漂亮吧❤️\n\n✨這邊還有更多比利時代謝錠的介紹\nhttps://www.instagram.com/stories/highlights/17944099970755730/\n\n\n\U0001F3C6
