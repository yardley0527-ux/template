  - name: 蝦紅素與葉黃素
    intro: 回答「我已經吃葉黃素了，為什麼還要了解蝦紅素？」比較重點放在成分、配方與研究差異，不做成誰比較強、誰比較快見效的排行榜。
    scripts:
    - tab: 消費者第一個疑問
      title: 已經吃葉黃素，還需要了解蝦紅素嗎？
      first_batch: true
      alt_titles:
      - 買晶亮營養品，只認得葉黃素夠嗎？
      - 蝦紅素和葉黃素，是同一種成分換名字嗎？
      format: 留言問答
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 手機近拍：一則留言「我已經吃葉黃素了，還需要蝦紅素嗎？」
        talk: 用回覆留言開場
        visual: 自製留言畫面
      - time: 3–15秒
        camera: 正面中景
        talk: 先釐清：蝦紅素和葉黃素是兩種不同的成分，不是換名字
        visual: 字幕：「不同成分，不是換名字」
      - time: 15–32秒
        camera: 桌面俯拍：兩張成分卡並排
        talk: 比較兩者的來源、在配方中的角色、研究方向
        visual: 對照卡：「來源／配方／研究方向」
      - time: 32–45秒
        camera: 側面45度
        talk: 不直接說每個人都要一起吃，先看自己目前吃了什麼
        visual: 字幕：「先看自己吃了什麼」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在先認識、再決定
        visual: 收尾字幕：「先認識，再決定要不要搭配」
      photos:
      - 自製留言畫面（不露真實帳號）。
      - 蝦紅素、葉黃素成分對照卡。
      notes: 不說每個人都需要一起吃；不比較誰比較強。
      cta: 妳現在吃的晶亮營養品是哪一種成分？
    - tab: 怎麼比較兩款產品
      title: 一瓶寫葉黃素，一瓶寫蝦紅素，妳會怎麼選？
      alt_titles:
      - 兩款都叫晶亮配方，背面到底差在哪？
      - 比較產品，只看正面最大那個字夠嗎？
      format: 背標並排比較
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 兩手各拿一瓶，正面大字對著鏡頭
        talk: 開場一句：「妳會怎麼選？」
        visual: 主題字幕：「一瓶寫葉黃素，一瓶寫蝦紅素」
      - time: 3–12秒
        camera: 正面中景
        talk: 正面最大的字不夠，要翻到背面
        visual: 字幕：「只看正面，不夠」
      - time: 12–30秒
        camera: 兩個背標並排近拍，手指逐行比對
        talk: 比每份含量、其他成分
        visual: 同名成分同色框線
      - time: 30–45秒
        camera: 背標近拍：建議食用量、警語
        talk: 建議食用量與警語也要比
        visual: 標示放大
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在比較產品的方法
        visual: 收尾字幕：「比產品，先比背面」
      photos:
      - 兩款產品的背標（若為他牌要遮住品牌）。
      notes: 比較對象若是他牌要遮品牌；不下「哪瓶比較好」的結論。
      cta: 妳比較產品時，會先看背面哪一行？
    - tab: 含量比較迷思
      title: 葉黃素10mg、蝦紅素幾mg，可以直接比大小嗎？
      alt_titles:
      - 毫克數比較高，就代表比較適合妳嗎？
      - 不同成分的數字，為什麼不能直接當成效果排名？
      format: 迷思破解（大字卡）
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 全螢幕大字卡：「10mg vs ?mg」
        talk: 開場問句
        visual: 主題字幕：「可以直接比大小嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 不同成分不是同一把尺
        visual: 字幕：「不同成分，不同尺」
      - time: 15–30秒
        camera: 桌面俯拍：一袋米的公斤數、一條布的公尺數
        talk: 用生活類比：公斤和公尺不能比大小
        visual: 類比示意
      - time: 30–45秒
        camera: 背標近拍
        talk: 要看的是研究使用的條件，以及自己每天實際吃到的量
        visual: 字幕：「看研究條件＋每日攝取量」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在數字不能直接排名次
        visual: 收尾字幕：「數字，不能直接排名次」
      photos:
      - 大字卡「10mg vs ?mg」。
      - 生活類比道具。
      notes: 不暗示哪個成分含量越高越有效。
      cta: 妳以前會直接比毫克數嗎？
    - tab: 單方與複方
      title: 為什麼有些配方放葉黃素，有些加入蝦紅素、花青素？
      alt_titles:
      - 成分越多，就代表配方越完整嗎？
      - 挑複方前，先看清楚每一項放了多少
      format: 配方拆解
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 一顆膠囊旁邊，一張張放上成分卡
        talk: 用成分卡越放越多開場
        visual: 主題字幕：「為什麼有的配方放這麼多種？」
      - time: 3–15秒
        camera: 正面中景
        talk: 配方設計有不同思路：單方、複方
        visual: 字幕：「單方／複方」
      - time: 15–30秒
        camera: 桌面俯拍：每張成分卡寫上含量
        talk: 挑複方前，先看每一項放了多少
        visual: 成分卡＋含量
      - time: 30–45秒
        camera: 側面45度
        talk: 成分多不等於完整，也不能直接說一起放就有加乘效果
        visual: 字幕：「成分多 ≠ 更完整」
      - time: 45–55秒
        camera: 背標近拍
        talk: 收在標示透明度
        visual: 收尾字幕：「看清楚每一項放多少」
      photos:
      - 成分卡（含量）。
      - 蝦紅素背標。
      notes: 不把「一起放」直接說成加乘效果已獲證實。
      cta: 妳挑保健品，偏好單方還是複方？
    - tab: 廣告比較話術
      title: 看到「蝦紅素比葉黃素快」，妳會先問什麼？
      alt_titles:
      - 「幾天有感」到底是研究結果，還是廣告說法？
      - 別急著選冠軍，先看比較的是什麼
      format: 話術拆解
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 自製廣告示意畫面：「比較快！幾天有感！」
        talk: 用誇張廣告詞開場
        visual: 主題字幕：「看到這種廣告，妳會先問什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 第一個問題：比較的是什麼、在什麼條件下
        visual: 字幕：「比什麼？什麼條件？」
      - time: 15–32秒
        camera: 圖卡：兩個研究並排，人數、時間、測量方式都不同
        talk: 不同研究不能直接拿來排名
        visual: 研究條件對照卡
      - time: 32–45秒
        camera: 側面45度
        talk: 「幾天有感」是研究結果還是廣告說法，要找原始資料
        visual: 字幕：「找原始資料」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在別急著選冠軍
        visual: 收尾字幕：「先看比較什麼，再談誰是冠軍」
      photos:
      - 自製廣告示意畫面（不截他牌）。
      - 研究條件對照卡。
      notes: 示意廣告用自製，不截他牌；不說自家產品比較快。
      cta: 妳看過最誇張的保健品廣告詞是什麼？
  - name: 專利成分與配方
    intro: 把「很多專利」變成消費者看得懂的選購內容。品牌專利、97%及原料來源的確切說法，拍攝前需對照原料正式文件。
    scripts:
    - tab: 專利到底代表什麼
      title: 買保健品看到「專利」，妳知道它專利在哪裡嗎？
      first_batch: true
      alt_titles:
      - 專利是原料、製程，還是整瓶產品？
      - 有專利，跟有人體研究是同一件事嗎？
      format: 老闆拿文件解說
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 包裝近拍「專利」字樣，手指點一下
        talk: 開場問句
        visual: 主題字幕：「妳知道它專利在哪裡嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 很多人看到專利就安心，但要先問專利在哪裡
        visual: 字幕：「專利在哪裡？」
      - time: 15–30秒
        camera: 老闆翻開專利文件，近拍專利範圍欄位
        talk: 專利可能是原料、製程，不一定是整瓶產品
        visual: 三張卡：「原料／製程／產品」
      - time: 30–45秒
        camera: 側面45度
        talk: 有專利和有人體研究是兩件事
        visual: 字幕：「專利 ≠ 人體研究」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在專利不是效果保證
        visual: 收尾字幕：「看懂專利在哪裡」
      photos:
      - 專利文件（範圍欄位）。
      - 包裝上的專利字樣。
      notes: 依實際專利文件說明範圍；不把專利當成效果保證；專利國家、號碼依正式文件。
      cta: 妳看到「專利」兩個字，會比較想買嗎？
    - tab: 蝦紅素原料來源
      title: 名字叫蝦紅素，原料一定來自蝦子嗎？
      alt_titles:
      - 買蝦紅素，為什麼我會先翻到原料來源？
      - 包裝上的「藻類來源」，妳看懂了嗎？
      format: 原料來源揭曉
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 蝦子照片，旁邊一個大問號
        talk: 開場一句：「蝦紅素是蝦子做的？」
        visual: 主題字幕：「原料一定來自蝦子嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 名字裡有蝦，但原料來源要看標示
        visual: 字幕：「名字 ≠ 來源」
      - time: 15–32秒
        camera: 供應商提供的藻種與培養照片
        talk: 依供應商資料說明藻類來源與製程
        visual: 原料照片＋原料名稱卡
      - time: 32–45秒
        camera: 背標近拍「藻類來源」字樣
        talk: 教觀眾看懂標示上的來源
        visual: 標示放大
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在買之前先翻原料來源
        visual: 收尾字幕：「先翻原料來源」
      photos:
      - 供應商提供的藻種照片（確認藻種後使用）。
      - 背標「藻類來源」字樣。
      notes: 確認藻種後再使用照片，不以一般海藻照代替原料；製程說法依供應商資料。
      cta: 妳以前也以為蝦紅素是蝦子做的嗎？
    - tab: 97%數字怎麼看
      title: 看到97%，妳知道它指的是什麼嗎？
      first_batch: true
      alt_titles:
      - 原料上的97%，等於一顆膠囊有97%蝦紅素嗎？
      - 純度、原料添加量、蝦紅素含量，三個數字怎麼分？
      format: 數字拆解（三張卡）
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 全螢幕大字「97%」
        talk: 開場問句
        visual: 主題字幕：「97%，指的是什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 看到數字，先問它指的是什麼
        visual: 字幕：「先問：97%是什麼？」
      - time: 15–32秒
        camera: 桌面俯拍：三張卡並排
        talk: 把三個概念分開：純度、原料添加量、蝦紅素含量
        visual: 三張卡：「純度／原料添加量／蝦紅素含量」
      - time: 32–45秒
        camera: 原料文件近拍：97%的定義與檢測依據
        talk: 依正式文件說明97%指的是什麼（拍攝前填入正式定義）
        visual: 文件欄位放大
      - time: 45–55秒
        camera: 背標近拍每份蝦紅素含量
        talk: 最後看每份實際含量
        visual: 收尾字幕：「97%是什麼？先問清楚」
      photos:
      - 原料文件（97%定義與檢測依據）。
      - 三張概念卡。
      - 背標每份蝦紅素含量。
      notes: 必須先確認97%的定義與檢測依據才能拍；不說一顆膠囊有97%蝦紅素。
      cta: 妳以前看到97%，是怎麼理解的？
    - tab: 天然與吸收
      title: 看到天然來源，妳還會再看哪個資訊？
      alt_titles:
      - 天然就一定吸收比較好嗎？
      - 產品寫高吸收，背後應該提供什麼資料？
      format: 選購判斷分享
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 包裝「天然來源」字樣近拍
        talk: 開場問句
        visual: 主題字幕：「看到天然來源，妳還會看什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 天然來源是一個資訊，但不是全部
        visual: 字幕：「天然，只是其中一項」
      - time: 15–30秒
        camera: 桌面俯拍：三張卡
        talk: 來源、配方、吸收研究是三種不同的資訊
        visual: 三張卡：「來源／配方／吸收研究」
      - time: 30–45秒
        camera: 研究資料近拍
        talk: 寫「高吸收」應該有研究資料：研究的是哪個原料、什麼條件
        visual: 圖卡：「原料／劑量／比較對象」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在天然是起點，不是結論
        visual: 收尾字幕：「天然是起點，不是結論」
      photos:
      - 包裝「天然來源」字樣。
      - 吸收研究摘要圖（註明研究條件）。
      notes: 不直接宣稱天然一定優於合成；吸收說法需有研究支持並標明條件。
      cta: 看到「天然」兩個字，妳會再多看什麼？
    - tab: 花青素來源
      title: 莓果大家都認識，為什麼配方還有黑豆種皮？
      alt_titles:
      - 智利酒果、黑豆、莓果，是同一種原料嗎？
      - 看見三重花青素，我會再確認哪些標示？
      format: 原料認識
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 桌上一盤莓果，旁邊一小碗黑豆
        talk: 開場一句：「為什麼還有黑豆？」
        visual: 主題字幕：「為什麼配方還有黑豆種皮？」
      - time: 3–15秒
        camera: 正面中景
        talk: 配方裡花青素的來源不只一種
        visual: 字幕：「花青素，不只一個來源」
      - time: 15–32秒
        camera: 桌面俯拍：三張原料卡
        talk: 智利酒果、黑豆種皮、莓果是不同原料，各自的指標成分依原料規格確認
        visual: 三張原料卡：「智利酒果／黑豆種皮／莓果」
      - time: 32–45秒
        camera: 背標近拍
        talk: 看見三重花青素，要確認每一種的名稱與添加量
        visual: 字幕：「花青素 ≠ 原花青素」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在三種來源不是三倍效果
        visual: 收尾字幕：「三種來源，不是三倍效果」
      photos:
      - 智利酒果、黑豆、莓果照片。
      - 三張原料卡。
      - 背標花青素欄位。
      notes: 花青素與原花青素名稱不能混用；不把三種來源說成三倍效果；指標成分依原料規格。
      cta: 妳知道黑豆種皮也有花青素嗎？
    - tab: 15種莓果
      title: 包裝寫15種莓果，妳第一個想問什麼？
      alt_titles:
      - 莓果種類多，還要看實際添加多少嗎？
      - 15種莓果，是15份營養嗎？
      format: 開箱提問
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 15種莓果照片快速排滿畫面
        talk: 用滿滿的莓果開場
        visual: 主題字幕：「15種莓果，妳第一個想問什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 第一個想問的：每一種放了多少？
        visual: 字幕：「每一種放了多少？」
      - time: 15–30秒
        camera: 來源清單近拍
        talk: 展示15種莓果的來源清單
        visual: 莓果清單
      - time: 30–45秒
        camera: 規格文件或背標近拍：萃取物添加量
        talk: 看實際添加量與規格
        visual: 添加量欄位放大
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在種類數量不等於效果大小
        visual: 收尾字幕：「15種，不等於15份」
      photos:
      - 15種莓果照片與來源清單。
      - 萃取物添加量與規格。
      notes: 不把種類數量直接當成效果大小。
      cta: 包裝上寫很多種，妳會想知道各放多少嗎？
    - tab: 維生素A／E與其他配料
      title: 買蝦紅素，為什麼背面還看到維生素A、E？
      alt_titles:
      - 一顆裡面有油脂，是配方的一部分嗎？
      - 玻尿酸、月見草油、玄米油，各自放了什麼？
      format: 背標逐行解說
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 背標近拍，手指停在維生素A、E
        talk: 開場問句
        visual: 主題字幕：「為什麼背面還有維生素A、E？」
      - time: 3–15秒
        camera: 正面中景
        talk: 背標上不只有蝦紅素
        visual: 字幕：「背面不只一種成分」
      - time: 15–30秒
        camera: 背標逐行近拍：維生素A、E、油脂
        talk: 依實際標示說明各自是什麼、在配方中的用途
        visual: 成分名稱放大
      - time: 30–45秒
        camera: 桌面俯拍：玻尿酸、月見草油、玄米油成分卡
        talk: 這三項各自放了什麼，依標示說明
        visual: 三張成分卡
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在每一行都看得懂
        visual: 收尾字幕：「每一行，都有它的位置」
      photos:
      - 蝦紅素背標。
      - 玻尿酸、月見草油、玄米油成分卡。
      notes: 不推論口服玻尿酸能替眼睛補水；不要把玄米油中的γ-穀維素寫成GABA；用途依實際標示。
      cta: 背標上哪一項，是妳最想知道的？
    - tab: 複方與透明度
      title: 十種成分放在一起，我最想讓妳看懂哪件事？
      alt_titles:
      - 專利很多、國家很多，最後還是要看哪一行？
      - 成分表很長，怎麼快速抓到重點？
      format: 老闆第一人稱背標導覽
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 老闆拿起產品，把背標轉向鏡頭
        talk: 開場一句：「這麼多成分，我最想讓妳看懂一件事。」
        visual: 主題字幕：「十種成分，最想讓妳看懂哪件事？」
      - time: 3–15秒
        camera: 正面中景
        talk: 成分多、專利多、國家多，最後要看的還是背標
        visual: 字幕：「最後，還是看背標」
      - time: 15–30秒
        camera: 背標近拍：原料名稱
        talk: 先看原料名稱
        visual: 原料名稱放大
      - time: 30–45秒
        camera: 背標近拍：含量、食用方式
        talk: 再看含量與食用方式
        visual: 含量欄位放大
      - time: 45–55秒
        camera: 文件夾近拍
        talk: 每一項都有可以查證的資料
        visual: 收尾字幕：「看得懂，也查得到」
      photos:
      - 蝦紅素背標。
      - 原料文件夾。
      notes: 每一項說法都要能對應到標示或正式文件。
      cta: 成分表很長的時候，妳都先看哪裡？
  - name: 睫狀肌與蝦紅素研究
    intro: 先讓觀眾理解眼睛怎麼對焦，再談研究測了什麼。不要用「吃下去→睫狀肌鬆開→立刻清楚」的動畫呈現產品效果。
    scripts:
    - tab: 生活化認識對焦
      title: 手機看完抬頭看遠，眼睛怎麼切換焦點？
      first_batch: true
      alt_titles:
      - 看近、看遠，眼睛裡面發生了什麼事？
      - 眼睛的對焦，跟相機哪裡像、哪裡不一樣？
      format: 生活實驗＋示意圖
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: POV：看手機上的字，抬頭看窗外遠處，畫面跟著對焦轉換
        talk: 用第一人稱視角開場
        visual: 主題字幕：「抬頭看遠，眼睛在做什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 剛剛那一下，眼睛其實在切換焦點
        visual: 字幕：「看近、看遠，都要對焦」
      - time: 15–32秒
        camera: 簡單示意圖：睫狀肌、水晶體
        talk: 看近、看遠時水晶體形狀會改變，睫狀肌參與這個調節
        visual: 示意圖
      - time: 32–45秒
        camera: 相機對焦畫面與眼睛示意圖並排
        talk: 跟相機像的是都會調焦；不一樣的是相機移動鏡片，眼睛改變水晶體形狀
        visual: 對照圖
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在生活裡的每一次抬頭
        visual: 收尾字幕：「每一次抬頭，眼睛都在對焦」
      photos:
      - 睫狀肌、水晶體簡單示意圖。
      - 相機對焦畫面。
      notes: 示意圖要簡單正確；這支不帶產品效果。
      cta: 妳剛剛有跟著抬頭看遠嗎？
    - tab: 睫狀肌是什麼
      title: 眼睛裡也有參與對焦的肌肉，妳知道嗎？
      alt_titles:
      - 睫狀肌、水晶體、視網膜，各自負責什麼？
      - 看近的時候，睫狀肌是在放鬆還是收縮？
      format: 知識問答
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 老闆指著自己的眼睛
        talk: 開場問句
        visual: 主題字幕：「眼睛裡也有肌肉？」
      - time: 3–15秒
        camera: 正面中景
        talk: 眼睛裡有參與對焦的肌肉，叫睫狀肌
        visual: 字幕：「睫狀肌」
      - time: 15–32秒
        camera: 桌面俯拍：三張卡
        talk: 睫狀肌、水晶體、視網膜各自負責什麼
        visual: 三張卡：「睫狀肌／水晶體／視網膜」
      - time: 32–45秒
        camera: 示意圖動畫：看近時睫狀肌收縮、水晶體變厚
        talk: 回答：看近的時候，睫狀肌是收縮的
        visual: 示意圖動畫
      - time: 45–55秒
        camera: 回正面中景
        talk: 眼睛不舒服的原因很多，不是全都跟這條肌肉有關
        visual: 收尾字幕：「認識它，但不要什麼都怪它」
      photos:
      - 三張構造卡。
      - 看近時睫狀肌收縮的示意動畫。
      notes: 避免把眼睛所有不舒服都歸因於睫狀肌。
      cta: 妳以前知道眼睛裡有肌肉嗎？
    - tab: 長時間看近與休息
      title: 電腦換手機，對焦距離有改變多少？
      alt_titles:
      - 眼睛休息，為什麼不只是換一個畫面？
      - 一直盯近處，怎麼把看遠的休息排進一天？
      format: 量距離示範
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 拿捲尺量眼睛到電腦、眼睛到手機的距離
        talk: 用量距離開場
        visual: 主題字幕：「電腦換手機，距離差多少？」
      - time: 3–15秒
        camera: 正面中景
        talk: 不管是電腦還是手機，對焦距離都還是近的
        visual: 兩個距離數字並排
      - time: 15–30秒
        camera: 窗邊：看向窗外遠處
        talk: 看遠，才是真的改變對焦距離
        visual: 字幕：「換畫面 ≠ 換距離」
      - time: 30–45秒
        camera: 桌面俯拍：在行程表上排進看遠的時段
        talk: 把看遠的休息排進一天
        visual: 行程表
