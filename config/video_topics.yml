# 產品拍片主題（/video_topics）。新增產品時在 products 底下加一段即可。
# 文字中的 **粗體** 會在頁面上轉成粗體。
products:
  - key: omnipotent
    name: 全能
    label: B群
    topics:
      - direction: 長頭髮方向
        title: 護髮買了很多，卻常常忙到隨便吃一餐？
        approach: 從「外在保養很認真，吃飯卻常常隨便」的生活反差開始，再帶到日常飲食、營養補充與生物素。讓關注髮絲保養的女性有共鳴，不承諾吃全能會長髮。
        duration: 45–60秒
        shots:
          - time: 0–5秒
            camera: 桌面近拍：護髮產品整齊排好，旁邊放一份簡單早餐；鏡頭緩慢移動
            talk: 點出「保養買得很齊，忙起來卻隨便吃」的反差
            visual: 主題字幕：「護髮很認真，吃飯卻很隨便？」
          - time: 5–15秒
            camera: 正面中景，直接看鏡頭；桌面保留早餐
            talk: 談忙碌時常見的飲食情境：趕時間、餐點重複、少了食物種類
            visual: 插入早餐、便當的真實照片
          - time: 15–25秒
            camera: 桌面俯拍，把可增加的食物放在餐點旁
            talk: 示範先從飲食內容開始照顧自己
            visual: 字幕：「先看看每天吃了什麼」
          - time: 25–38秒
            camera: 側面45度鏡頭，拿起全能，翻到背面；切成分特寫
            talk: 說明選擇補充品時，會看完整B群、C、鋅及原料資訊
            visual: 配方分類圖；不做髮絲效果圖
          - time: 38–48秒
            camera: 背標近拍，指出生物素，再帶到每份含量
            talk: 生物素就是B7；認識成分之外，也要看份量
            visual: "**「B7＝生物素」**名稱圖"
          - time: 48–60秒
            camera: 回正面中景；餐點與產品同框
            talk: 收在日常照顧：外在保養、正常飲食與適當補充一起安排
            visual: 收尾字幕：「照顧自己，也從每天吃的開始」
        photos:
          - 同一張桌面的護髮用品與餐點照片。
          - 真實早餐、午餐照片。
          - 全能最新背標。
          - B7名稱圖、B群＋C＋鋅分類圖。
        notes: 不要拍落髮、髮量前後對比、頭髮變長的時間軸，也不要讓膠囊接到毛囊生長動畫。這支的重點是生活習慣與營養認識。

      - direction: 好睡方向
        title: 晚上才想起B群沒吃，會不會越吃越清醒？
        approach: 用「收拾一天的東西，才想起忘記補充」的日常情境，帶出B群只有提神的印象，再說明B6的角色。
        duration: 45–60秒
        shots:
          - time: 0–5秒
            camera: 晚間桌面近拍：闔上筆電，整理桌面，拿起產品
            talk: 引出「晚上才想到B群，怕吃了睡不著」的疑問
            visual: 主題字幕：「晚上吃B群，會更清醒？」
          - time: 5–15秒
            camera: 正面中景，使用柔和室內光；直接看鏡頭
            talk: 說明大家常把B群和提神放在一起，但B群包含不同營養素
            visual: 字幕：「B群不只有一種營養素」
          - time: 15–28秒
            camera: 側面45度鏡頭，接簡單B6知識圖
            talk: 介紹B6參與神經傳導物質合成，以及它為什麼會出現在睡眠相關討論中
            visual: B6知識圖，註明資料來源
          - time: 28–40秒
            camera: 回正面近景，清楚講完關鍵差別
            talk: 說明「參與相關機制」不等於「吃全能就能助眠」
            visual: 字幕：「營養角色與產品效果，要分開看」
          - time: 40–50秒
            camera: 食用方式特寫，手指指出正式標示
            talk: 使用安排依正式標示及個人情況；不自行增加份量
            visual: 最新食用方式照片
          - time: 50–60秒
            camera: 桌面俯拍：放下產品，收好筆電與手機；不拍入睡結果
            talk: 收在規律使用、安排休息與日常作息
            visual: 收尾字幕：「補充營養，也要好好安排休息」
        photos:
          - 晚間收桌、闔上筆電的生活照片。
          - B6成分欄位。
          - 正式食用方式。
          - 簡潔的B6知識圖。
        notes: 晚間光線用來呈現生活情境；不安排吃完立刻熟睡、隔天精神改善或深睡數據上升的畫面。

      - direction: 成分天然＋吸收方向
        title: 每天要吃的東西，妳會翻到背面看嗎？
        subtitle: 不只看天然，我還會看吸收資料。
        approach: 從「買之前會不會翻背標」開始，讓老闆分享選料時的判斷：來源、含量、吸收研究都要看。吸收是這支的主要內容之一，不只展示藜麥、酵母和柑橘照片。
        duration: 60–75秒
        shots:
          - time: 0–5秒
            camera: 產品正面近拍，手把瓶身轉到背面；鏡頭跟著動作
            talk: 用「每天要吃的東西，買之前會看什麼？」引起注意
            visual: 主題字幕：「妳買保健品，會翻背面嗎？」
          - time: 5–15秒
            camera: 正面中景，拿著產品說明
            talk: 分享挑選標準：不只看正面寫天然，也看用什麼原料、每份含多少
            visual: 字幕依序出現：「來源／含量／研究資料」
          - time: 15–30秒
            camera: 桌面俯拍，產品旁排出四項原料卡
            talk: 介紹PANMOL®、LALMIN® B群、PureWay-C®及LALMIN®鋅
            visual: 原料名稱搭配來源示意照片
          - time: 30–43秒
            camera: 側面45度鏡頭，翻閱原料資料；接資料近拍
            talk: 強調吸收相關資料要看清楚：研究的是哪個原料、用多少、比較什麼
            visual: 自製圖卡：「原料／研究劑量／比較對象／測量指標」
          - time: 43–58秒
            camera: 研究資料摘要與成品標示交替特寫
            talk: 以核對後的原料研究作例子；分清楚研究結果與全能成品資訊
            visual: 標註「原料研究」；保留研究條件
          - time: 58–68秒
            camera: 回正面中景，產品與資料同框
            talk: 說明選料會考量吸收資料，但不能因為來源天然，就直接認定更好吸收
            visual: 字幕：「來源與吸收，都要有資料支持」
          - time: 68–75秒
            camera: 產品定鏡，四項原料卡放在後方
            talk: 整理產品選擇的三個重點
            visual: 收尾：「看來源、看含量、看研究」
        extra_sections:
          - heading: 吸收段落怎麼落實
            paragraphs:
              - PureWay-C®有人體研究評估吸收與血中維生素C濃度，但研究採單次1000mg維生素C，不是全能成品試驗。不能直接把結果改成「全能吸收率高」或套用倍數。Article abstract #869441
              - 因此，這版先呈現**「選料時重視吸收研究」**。若要進一步寫「某原料在特定條件下吸收較快」，需核對全能實際使用的原料規格、完整研究及廣告表達。
        photos:
          - 藜麥穀粒、柑橘來源示意照片。
          - 供應商提供的酵母原料照片。
          - 四項原料名稱卡。
          - 自製的研究條件摘要圖。
          - 全能正式成分與含量標示。
        notes: 不用海綿吸水、膠囊完全溶解等實驗代替人體吸收證據；不沿用「吸收4倍、停留2倍」圖，也不把合成B群描繪成不能吸收。

      - direction: 孕婦可以吃方向
        title: 懷孕後，連原本每天吃的保健品都不敢隨便吃？
        approach: 承接懷孕後變得謹慎的生活心情，回答「原本吃的產品還適不適合、已經吃孕婦維他命會不會重複」的問題。
        duration: 50–65秒
        shots:
          - time: 0–5秒
            camera: 桌面俯拍，幾款補充品放在一起；拿起其中一瓶查看標示
            talk: 引出孕期對原有補充品產生疑問的情境
            visual: 主題字幕：「懷孕後，原本的保健品還能照吃嗎？」
          - time: 5–15秒
            camera: 正面中景，直接看鏡頭
            talk: 說明孕期選產品，需要重新確認完整資訊
            visual: 字幕：「先確認，別照原本習慣直接加」
          - time: 15–28秒
            camera: 全能背標特寫，指出完整成分與份量
            talk: 展示產品資訊；正式適用說明核對後再填入口播
            visual: 最新完整成分、食用方式照片
          - time: 28–43秒
            camera: 全能與孕期綜合維他命標示並排；手指找相同成分
            talk: 示範如何找重複的B群、C、鋅，整理每日份量
            visual: 同名成分使用同色框線
          - time: 43–55秒
            camera: 側面鏡頭，將標示與補充紀錄表整理在一起
            talk: 說明帶完整資料給產檢醫師或營養師評估
            visual: "**「成分＋份量＋現有補充品」**圖卡"
          - time: 55–65秒
            camera: 回正面中景，資料與產品留在桌上
            talk: 收在確認個人適用性後，依正式方式使用
            visual: 收尾字幕：「孕期補充，先把資訊確認完整」
        photos:
          - 全能最新正式背標。
          - 孕期綜合維他命標示。
          - 每日補充紀錄表。
          - 經品牌確認的孕期適用說明。
        notes: 不使用「完全放心」「孕婦最安心」等絕對保證；沒有個別評估資料前，不直接示範孕婦服用固定顆數。

    crew_guide:
      - item: 正面鏡頭
        advice: 用於生活開場、關鍵解釋與收尾；保持自然分享的語氣
      - item: 第二視角鏡頭
        advice: 側面45度拍講解與翻資料，桌面俯拍拍拿產品、排卡片及看標示
      - item: 圖片插入
        advice: 講到對應資訊再出現；每張只突出一個重點
      - item: 產品出場
        advice: 先建立生活問題，再拿產品說明，避免開場就連續介紹配方
      - item: 拍攝順序
        advice: 先拍完四支正面與側面講解，再集中補拍桌面、產品、背標和資料
      - item: 字幕風格
        advice: 生活疑問用大字；成分與研究資訊用簡潔圖卡，保持清楚可讀
    closing_note: 拍攝前先統一每日份量及生物素含量；天然片的吸收段落以實際研究支持的範圍呈現。這樣能保留老闆想強調的方向，也讓畫面和說明都有依據。
