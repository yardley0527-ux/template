      notes: 不說「可以一起吃」「不用停」；不使用「完全放心」等絕對保證；沒有個別評估資料前，不示範孕婦服用固定顆數。
      cta: 妳也有同樣的疑問嗎？留言告訴我妳現在在吃什麼。
      short_version: 朋友拿著兩瓶問「這個還能照吃嗎？」→ 兩個標示並排、同色框出重複成分 → 收尾（約15–20秒）。
    - title: 懷孕後買保健品，我會先確認這三件事
      follow_up: 用完整成分、食用份量、現有補充品，整理確認方式
      approach: 用「我會先確認這三件事」的清單形式，整理孕期選購保健品前的確認方式：完整成分、食用份量、現有補充品。
      duration: 50–65秒
