  - name: 蝦紅素與葉黃素
    intro: 回答「我已經吃葉黃素了，為什麼還要了解蝦紅素？」比較重點放在成分、配方與研究差異，不做成誰比較強、誰比較快見效的排行榜。
    scripts:
    - tab: 消費者第一個疑問
      title: 已經吃葉黃素，還需要了解蝦紅素嗎？
      first_batch: true
      alt_titles:
      - 買晶亮營養品，只認得葉黃素夠嗎？
      - 蝦紅素和葉黃素，是同一種成分換名字嗎？
      format: 留言問答
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 手機近拍：一則留言「我已經吃葉黃素了，還需要蝦紅素嗎？」
        talk: 用回覆留言開場
        visual: 自製留言畫面
      - time: 3–15秒
        camera: 正面中景
        talk: 先釐清：蝦紅素和葉黃素是兩種不同的成分，不是兄弟，比較像常一起出現的同學
        visual: 字幕：「不是兄弟，是常一起出現的同學」
      - time: 15–32秒
        camera: 桌面俯拍：兩張成分卡並排
        talk: 比較兩者的來源、在配方中的角色、研究方向
        visual: 對照卡：「來源／配方／研究方向」
      - time: 32–45秒
        camera: 側面45度
        talk: 不直接說每個人都要一起吃，先看自己目前吃了什麼
        visual: 字幕：「先看自己吃了什麼」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在先認識、再決定
        visual: 收尾字幕：「先認識，再決定要不要搭配」
      photos:
      - 自製留言畫面（不露真實帳號）。
      - 蝦紅素、葉黃素成分對照卡。
      notes: 不說每個人都需要一起吃；不比較誰比較強。
      cta: 妳現在吃的晶亮營養品是哪一種成分？
      series: 留言回覆
      short_version: 留言「已經吃葉黃素，還要蝦紅素嗎？」→「不是兄弟，是常一起出現的同學」→ 收尾「先認識，再決定」（約15秒）。
    - tab: 怎麼比較兩款產品
      title: 一瓶寫葉黃素，一瓶寫蝦紅素，妳會怎麼選？
      alt_titles:
      - 兩款都叫晶亮配方，背面到底差在哪？
      - 比較產品，只看正面最大那個字夠嗎？
      format: 背標並排比較
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 兩手各拿一瓶，正面大字對著鏡頭
        talk: 開場一句：「妳會怎麼選？」
        visual: 主題字幕：「一瓶寫葉黃素，一瓶寫蝦紅素」
      - time: 3–12秒
        camera: 正面中景
        talk: 正面最大的字不夠，要翻到背面
        visual: 字幕：「只看正面，不夠」
      - time: 12–30秒
        camera: 兩個背標並排近拍，手指逐行比對
        talk: 比每份含量、其他成分
        visual: 同名成分同色框線
      - time: 30–45秒
        camera: 背標近拍：建議食用量、警語
        talk: 建議食用量與警語也要比
        visual: 標示放大
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在比較產品的方法
        visual: 收尾字幕：「比產品，先比背面」
      photos:
      - 兩款產品的背標（若為他牌要遮住品牌）。
      notes: 比較對象若是他牌要遮品牌；不下「哪瓶比較好」的結論。
      cta: 妳比較產品時，會先看背面哪一行？
    - tab: 含量比較迷思
      title: 葉黃素10mg、蝦紅素幾mg，可以直接比大小嗎？
      alt_titles:
      - 毫克數比較高，就代表比較適合妳嗎？
      - 不同成分的數字，為什麼不能直接當成效果排名？
      format: 迷思破解（大字卡）
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 全螢幕大字卡：「10mg vs ?mg」
        talk: 開場問句
        visual: 主題字幕：「可以直接比大小嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 不同成分不是同一把尺
        visual: 字幕：「不同成分，不同尺」
      - time: 15–30秒
        camera: 桌面俯拍：一袋米的公斤數、一條布的公尺數
        talk: 用生活類比：公斤和公尺不能比大小
        visual: 類比示意
      - time: 30–45秒
        camera: 背標近拍
        talk: 要看的是研究使用的條件，以及自己每天實際吃到的量
        visual: 字幕：「看研究條件＋每日攝取量」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在數字不能直接排名次
        visual: 收尾字幕：「數字，不能直接排名次」
      photos:
      - 大字卡「10mg vs ?mg」。
      - 生活類比道具。
      notes: 不暗示哪個成分含量越高越有效。
      cta: 妳以前會直接比毫克數嗎？
    - tab: 單方與複方
      title: 為什麼有些配方放葉黃素，有些加入蝦紅素、花青素？
      alt_titles:
      - 成分越多，就代表配方越完整嗎？
      - 挑複方前，先看清楚每一項放了多少
      format: 配方拆解
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 一顆膠囊旁邊，一張張放上成分卡
        talk: 用成分卡越放越多開場
        visual: 主題字幕：「為什麼有的配方放這麼多種？」
      - time: 3–15秒
        camera: 正面中景
        talk: 配方設計有不同思路：單方、複方
        visual: 字幕：「單方／複方」
      - time: 15–30秒
        camera: 桌面俯拍：每張成分卡寫上含量
        talk: 挑複方前，先看每一項放了多少
        visual: 成分卡＋含量
      - time: 30–45秒
        camera: 側面45度
        talk: 成分多不等於完整，也不能直接說一起放就有加乘效果
        visual: 字幕：「成分多 ≠ 更完整」
      - time: 45–55秒
        camera: 背標近拍
        talk: 收在標示透明度
        visual: 收尾字幕：「看清楚每一項放多少」
      photos:
      - 成分卡（含量）。
      - 蝦紅素背標。
      notes: 不把「一起放」直接說成加乘效果已獲證實。
      cta: 妳挑保健品，偏好單方還是複方？
    - tab: 廣告比較話術
      title: 看到「蝦紅素比葉黃素快」，妳會先問什麼？
      alt_titles:
      - "「幾天有感」到底是研究結果，還是廣告說法？"
      - 別急著選冠軍，先看比較的是什麼
      format: 話術拆解
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 自製廣告示意畫面：「比較快！幾天有感！」
        talk: 用誇張廣告詞開場
        visual: 主題字幕：「看到這種廣告，妳會先問什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 第一個問題：比較的是什麼、在什麼條件下
        visual: 字幕：「比什麼？什麼條件？」
      - time: 15–32秒
        camera: 圖卡：兩個研究並排，人數、時間、測量方式都不同
        talk: 不同研究不能直接拿來排名
        visual: 研究條件對照卡
      - time: 32–45秒
        camera: 側面45度
        talk: "「幾天有感」是研究結果還是廣告說法，要找原始資料"
        visual: 字幕：「找原始資料」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在別急著選冠軍
        visual: 收尾字幕：「先看比較什麼，再談誰是冠軍」
      photos:
      - 自製廣告示意畫面（不截他牌）。
      - 研究條件對照卡。
      notes: 示意廣告用自製，不截他牌；不說自家產品比較快。
      cta: 妳看過最誇張的保健品廣告詞是什麼？
      series: 真的假的
  - name: 專利成分與配方
    intro: 把「很多專利」變成消費者看得懂的選購內容。品牌專利、97%及原料來源的確切說法，拍攝前需對照原料正式文件。
    scripts:
    - tab: 專利到底代表什麼
      title: 買保健品看到「專利」，妳知道它專利在哪裡嗎？
      first_batch: true
      alt_titles:
      - 專利是原料、製程，還是整瓶產品？
      - 有專利，跟有人體研究是同一件事嗎？
      format: 老闆自白＋拿文件解說
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 老闆拿起一疊專利文件，翻了兩頁皺眉
        talk: 老闆自白開場：「我第一次看到專利文件，也看不懂。」
        visual: 主題字幕：「妳知道它專利在哪裡嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 很多人看到專利就安心，但要先問專利在哪裡
        visual: 字幕：「專利在哪裡？」
      - time: 15–30秒
        camera: 老闆翻開專利文件，近拍專利範圍欄位
        talk: 專利可能是原料、製程，不一定是整瓶產品
        visual: 三張卡：「原料／製程／產品」
      - time: 30–45秒
        camera: 側面45度
        talk: 有專利和有人體研究是兩件事
        visual: 字幕：「專利 ≠ 人體研究」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在專利不是效果保證
        visual: 收尾字幕：「看懂專利在哪裡」
      photos:
      - 專利文件（範圍欄位）。
      - 包裝上的專利字樣。
      notes: 依實際專利文件說明範圍；不把專利當成效果保證；專利國家、號碼依正式文件。
      cta: 妳看到「專利」兩個字，會比較想買嗎？
      series: 背標偵探
      short_version: 老闆翻專利文件皺眉「我第一次也看不懂」→ 三張卡「原料／製程／產品」→「專利 ≠ 人體研究」（約15秒）。
    - tab: 蝦紅素原料來源
      title: 名字叫蝦紅素，原料一定來自蝦子嗎？
      alt_titles:
      - 買蝦紅素，為什麼我會先翻到原料來源？
      - 包裝上的「藻類來源」，妳看懂了嗎？
      format: 原料來源揭曉
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 蝦子照片，旁邊一個大問號
        talk: 開場一句：「蝦紅素是蝦子做的？」
        visual: 主題字幕：「原料一定來自蝦子嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 名字裡有蝦，但原料來源要看標示
        visual: 字幕：「名字 ≠ 來源」
      - time: 15–32秒
        camera: 供應商提供的藻種與培養照片
        talk: 依供應商資料說明藻類來源與製程
        visual: 原料照片＋原料名稱卡
      - time: 32–45秒
        camera: 背標近拍「藻類來源」字樣
        talk: 教觀眾看懂標示上的來源
        visual: 標示放大
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在買之前先翻原料來源
        visual: 收尾字幕：「先翻原料來源」
      photos:
      - 供應商提供的藻種照片（確認藻種後使用）。
      - 背標「藻類來源」字樣。
      notes: 確認藻種後再使用照片，不以一般海藻照代替原料；製程說法依供應商資料。
      cta: 妳以前也以為蝦紅素是蝦子做的嗎？
    - tab: 97%數字怎麼看
      title: 看到97%，妳知道它指的是什麼嗎？
      first_batch: true
      alt_titles:
      - 原料上的97%，等於一顆膠囊有97%蝦紅素嗎？
      - 純度、原料添加量、蝦紅素含量，三個數字怎麼分？
      format: 三選一猜謎（可同步做限動投票）
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 全螢幕大字「97%」，下方跳出三個選項：A 純度／B 原料添加量／C 蝦紅素含量
        talk: 開場讓觀眾猜：「97%指的是哪一個？先留言猜猜看。」
        visual: 主題字幕：「97%，是 A、B 還是 C？」
      - time: 3–15秒
        camera: 正面中景
        talk: 看到數字，先問它指的是什麼
        visual: 字幕：「先問：97%是什麼？」
      - time: 15–32秒
        camera: 桌面俯拍：三張卡並排
        talk: 把三個概念分開：純度、原料添加量、蝦紅素含量
        visual: 三張卡：「純度／原料添加量／蝦紅素含量」
      - time: 32–45秒
        camera: 原料文件近拍：97%的定義與檢測依據
        talk: 依正式文件說明97%指的是什麼（拍攝前填入正式定義）
        visual: 文件欄位放大
      - time: 45–55秒
        camera: 背標近拍每份蝦紅素含量
        talk: 最後看每份實際含量
        visual: 收尾字幕：「97%是什麼？先問清楚」
      photos:
      - 原料文件（97%定義與檢測依據）。
      - 三張概念卡。
      - 背標每份蝦紅素含量。
      notes: 必須先確認97%的定義與檢測依據才能拍；不說一顆膠囊有97%蝦紅素。
      cta: 猜猜看：97% 是 A、B 還是 C？留言告訴我，下一支揭曉。
      series: 背標偵探
      short_version: "「97%」＋三個選項讓觀眾猜 → 三張概念卡 → 收尾「97%是什麼？先問清楚」（約15秒）。"
    - tab: 天然與吸收
      title: 看到天然來源，妳還會再看哪個資訊？
      alt_titles:
      - 天然就一定吸收比較好嗎？
      - 產品寫高吸收，背後應該提供什麼資料？
      format: 選購判斷分享
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 包裝「天然來源」字樣近拍
        talk: 開場問句
        visual: 主題字幕：「看到天然來源，妳還會看什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 天然來源是一個資訊，但不是全部
        visual: 字幕：「天然，只是其中一項」
      - time: 15–30秒
        camera: 桌面俯拍：三張卡
        talk: 來源、配方、吸收研究是三種不同的資訊
        visual: 三張卡：「來源／配方／吸收研究」
      - time: 30–45秒
        camera: 研究資料近拍
        talk: 寫「高吸收」應該有研究資料：研究的是哪個原料、什麼條件
        visual: 圖卡：「原料／劑量／比較對象」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在天然是起點，不是結論
        visual: 收尾字幕：「天然是起點，不是結論」
      photos:
      - 包裝「天然來源」字樣。
      - 吸收研究摘要圖（註明研究條件）。
      notes: 不直接宣稱天然一定優於合成；吸收說法需有研究支持並標明條件。
      cta: 看到「天然」兩個字，妳會再多看什麼？
    - tab: 花青素來源
      title: 莓果大家都認識，為什麼配方還有黑豆種皮？
      alt_titles:
      - 智利酒果、黑豆、莓果，是同一種原料嗎？
      - 看見三重花青素，我會再確認哪些標示？
      format: 原料認識
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 桌上一盤莓果，旁邊一小碗黑豆
        talk: 開場一句：「為什麼還有黑豆？」
        visual: 主題字幕：「為什麼配方還有黑豆種皮？」
      - time: 3–15秒
        camera: 正面中景
        talk: 配方裡花青素的來源不只一種
        visual: 字幕：「花青素，不只一個來源」
      - time: 15–32秒
        camera: 桌面俯拍：三張原料卡
        talk: 智利酒果、黑豆種皮、莓果是不同原料，各自的指標成分依原料規格確認
        visual: 三張原料卡：「智利酒果／黑豆種皮／莓果」
      - time: 32–45秒
        camera: 背標近拍
        talk: 看見三重花青素，要確認每一種的名稱與添加量
        visual: 字幕：「花青素 ≠ 原花青素」
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在三種來源不是三倍效果
        visual: 收尾字幕：「三種來源，不是三倍效果」
      photos:
      - 智利酒果、黑豆、莓果照片。
      - 三張原料卡。
      - 背標花青素欄位。
      notes: 花青素與原花青素名稱不能混用；不把三種來源說成三倍效果；指標成分依原料規格。
      cta: 妳知道黑豆種皮也有花青素嗎？
    - tab: 15種莓果
      title: 包裝寫15種莓果，妳第一個想問什麼？
      alt_titles:
      - 莓果種類多，還要看實際添加多少嗎？
      - 15種莓果，是15份營養嗎？
      format: 開箱提問
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 15種莓果照片快速排滿畫面
        talk: 用滿滿的莓果開場
        visual: 主題字幕：「15種莓果，妳第一個想問什麼？」
      - time: 3–15秒
        camera: 正面中景
        talk: 第一個想問的：每一種放了多少？
        visual: 字幕：「每一種放了多少？」
      - time: 15–30秒
        camera: 來源清單近拍
        talk: 展示15種莓果的來源清單
        visual: 莓果清單
      - time: 30–45秒
        camera: 規格文件或背標近拍：萃取物添加量
        talk: 看實際添加量與規格
        visual: 添加量欄位放大
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在種類數量不等於效果大小
        visual: 收尾字幕：「15種，不等於15份」
      photos:
      - 15種莓果照片與來源清單。
      - 萃取物添加量與規格。
      notes: 不把種類數量直接當成效果大小。
      cta: 包裝上寫很多種，妳會想知道各放多少嗎？
      series: 背標偵探
    - tab: 維生素A／E與其他配料
      title: 買蝦紅素，為什麼背面還看到維生素A、E？
      alt_titles:
      - 一顆裡面有油脂，是配方的一部分嗎？
      - 玻尿酸、月見草油、玄米油，各自放了什麼？
      format: 背標逐行解說
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 背標近拍，手指停在維生素A、E
        talk: 開場問句
        visual: 主題字幕：「為什麼背面還有維生素A、E？」
      - time: 3–15秒
        camera: 正面中景
        talk: 背標上不只有蝦紅素
        visual: 字幕：「背面不只一種成分」
      - time: 15–30秒
        camera: 背標逐行近拍：維生素A、E、油脂
        talk: 依實際標示說明各自是什麼、在配方中的用途
        visual: 成分名稱放大
      - time: 30–45秒
        camera: 桌面俯拍：玻尿酸、月見草油、玄米油成分卡
        talk: 這三項各自放了什麼，依標示說明
        visual: 三張成分卡
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在每一行都看得懂
        visual: 收尾字幕：「每一行，都有它的位置」
      photos:
      - 蝦紅素背標。
      - 玻尿酸、月見草油、玄米油成分卡。
      notes: 不推論口服玻尿酸能替眼睛補水；不要把玄米油中的γ-穀維素寫成GABA；用途依實際標示。
      cta: 背標上哪一項，是妳最想知道的？
    - tab: 複方與透明度
      title: 十種成分放在一起，我最想讓妳看懂哪件事？
      alt_titles:
      - 專利很多、國家很多，最後還是要看哪一行？
      - 成分表很長，怎麼快速抓到重點？
      format: 老闆第一人稱背標導覽
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 老闆拿起產品，把背標轉向鏡頭
        talk: 開場一句：「這麼多成分，我最想讓妳看懂一件事。」
        visual: 主題字幕：「十種成分，最想讓妳看懂哪件事？」
      - time: 3–15秒
        camera: 正面中景
        talk: 成分多、專利多、國家多，最後要看的還是背標
        visual: 字幕：「最後，還是看背標」
      - time: 15–30秒
        camera: 背標近拍：原料名稱
        talk: 先看原料名稱
        visual: 原料名稱放大
      - time: 30–45秒
        camera: 背標近拍：含量、食用方式
        talk: 再看含量與食用方式
        visual: 含量欄位放大
      - time: 45–55秒
        camera: 文件夾近拍
        talk: 每一項都有可以查證的資料
        visual: 收尾字幕：「看得懂，也查得到」
      photos:
      - 蝦紅素背標。
      - 原料文件夾。
      notes: 每一項說法都要能對應到標示或正式文件。
      cta: 成分表很長的時候，妳都先看哪裡？
      series: 背標偵探
  - name: 睫狀肌與蝦紅素研究
    intro: 先讓觀眾理解眼睛怎麼對焦，再談研究測了什麼。不要用「吃下去→睫狀肌鬆開→立刻清楚」的動畫呈現產品效果。
    scripts:
    - tab: 生活化認識對焦
      title: 手機看完抬頭看遠，眼睛怎麼切換焦點？
      first_batch: true
      alt_titles:
      - 看近、看遠，眼睛裡面發生了什麼事？
      - 眼睛的對焦，跟相機哪裡像、哪裡不一樣？
      format: 觀眾跟著做＋示意圖
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: POV：看手機上的字，抬頭看窗外遠處，畫面跟著對焦轉換
        talk: 用第一人稱視角開場
        visual: 主題字幕：「抬頭看遠，眼睛在做什麼？」
      - time: 3–15秒
        camera: 正面中景，主持人拿著手機示範
        talk: 邀請觀眾一起做：「現在看手機上的這行字，再抬頭看妳附近最遠的東西。」
        visual: 字幕：「跟著做：看近 → 看遠」
      - time: 15–32秒
        camera: 簡單示意圖：睫狀肌、水晶體
        talk: 看近、看遠時水晶體形狀會改變，睫狀肌參與這個調節
        visual: 示意圖
      - time: 32–45秒
        camera: 相機對焦畫面與眼睛示意圖並排
        talk: 跟相機像的是都會調焦；不一樣的是相機移動鏡片，眼睛改變水晶體形狀
        visual: 對照圖
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在生活裡的每一次抬頭
        visual: 收尾字幕：「每一次抬頭，眼睛都在對焦」
      photos:
      - 睫狀肌、水晶體簡單示意圖。
      - 相機對焦畫面。
      notes: 示意圖要簡單正確；這支不帶產品效果。
      cta: 妳剛剛有跟著做嗎？抬頭的那一下，有感覺到眼睛在切換嗎？
      short_version: "「跟著做：看手機這行字，再抬頭看最遠的東西」→ 睫狀肌、水晶體示意圖 → 收尾（約15秒）。"
    - tab: 睫狀肌是什麼
      title: 眼睛裡也有參與對焦的肌肉，妳知道嗎？
      alt_titles:
      - 睫狀肌、水晶體、視網膜，各自負責什麼？
      - 看近的時候，睫狀肌是在放鬆還是收縮？
      format: 知識問答
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 老闆指著自己的眼睛
        talk: 開場問句
        visual: 主題字幕：「眼睛裡也有肌肉？」
      - time: 3–15秒
        camera: 正面中景
        talk: 眼睛裡有參與對焦的肌肉，叫睫狀肌
        visual: 字幕：「睫狀肌」
      - time: 15–32秒
        camera: 桌面俯拍：三張卡
        talk: 睫狀肌、水晶體、視網膜各自負責什麼
        visual: 三張卡：「睫狀肌／水晶體／視網膜」
      - time: 32–45秒
        camera: 示意圖動畫：看近時睫狀肌收縮、水晶體變厚
        talk: 回答：看近的時候，睫狀肌是收縮的
        visual: 示意圖動畫
      - time: 45–55秒
        camera: 回正面中景
        talk: 眼睛不舒服的原因很多，不是全都跟這條肌肉有關
        visual: 收尾字幕：「認識它，但不要什麼都怪它」
      photos:
      - 三張構造卡。
      - 看近時睫狀肌收縮的示意動畫。
      notes: 避免把眼睛所有不舒服都歸因於睫狀肌。
      cta: 妳以前知道眼睛裡有肌肉嗎？
    - tab: 長時間看近與休息
      title: 電腦換手機，對焦距離有改變多少？
      alt_titles:
      - 眼睛休息，為什麼不只是換一個畫面？
      - 一直盯近處，怎麼把看遠的休息排進一天？
      format: 量距離示範
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 拿捲尺量眼睛到電腦、眼睛到手機的距離
        talk: 用量距離開場
        visual: 主題字幕：「電腦換手機，距離差多少？」
      - time: 3–15秒
        camera: 正面中景
        talk: 不管是電腦還是手機，對焦距離都還是近的
        visual: 兩個距離數字並排
      - time: 15–30秒
        camera: 窗邊：看向窗外遠處
        talk: 看遠，才是真的改變對焦距離
        visual: 字幕：「換畫面 ≠ 換距離」
      - time: 30–45秒
        camera: 桌面俯拍：在行程表上排進看遠的時段
        talk: 把看遠的休息排進一天
        visual: 行程表
      - time: 45–55秒
        camera: 回正面中景
        talk: 收在生活管理
        visual: 收尾字幕：「讓眼睛有機會看遠」
      photos:
      - 捲尺量距離的畫面。
      - 行程表。
      notes: 不接成產品能解除肌肉緊繃。
      cta: 妳今天有抬頭看遠過嗎？
    - tab: 蝦紅素研究看什麼
      title: 為什麼有蝦紅素研究找長時間看螢幕的人？
      alt_titles:
      - 研究眼睛對焦，是怎麼測量的？
      - 研究測到的變化，跟「我覺得比較舒服」一樣嗎？
      format: 研究解讀
      duration: 50–60秒
      shots:
      - time: 0–3秒
        camera: 研究論文首頁近拍（註明出處）
        talk: 開場問句
        visual: 主題字幕：「為什麼研究找看螢幕的人？」
      - time: 3–15秒
        camera: 正面中景
        talk: 說明研究為什麼選這個族群
        visual: 研究對象摘要
      - time: 15–32秒
        camera: 圖卡：客觀指標與問卷感受
        talk: 研究怎麼測量：有儀器測的指標，也有受試者填的問卷
        visual: 圖卡：「客觀指標／問卷感受」
      - time: 32–48秒
        camera: 側面45度
        talk: 測到的變化和「我覺得比較舒服」是兩回事，結果要分開講
        visual: 字幕：「測量結果 ≠ 自己的感覺」
      - time: 48–60秒
        camera: 回正面中景
        talk: 收在看研究先看測了什麼
        visual: 收尾字幕：「看研究，先看它測了什麼」
      photos:
      - 研究論文首頁與出處。
      - 客觀指標／問卷感受圖卡。
      notes: 引用研究要列出處；客觀指標與主觀感受分開描述；不延伸成產品效果。
      cta: 妳看過保健品的研究報告嗎？
    - tab: 釐清放鬆睫狀肌說法
      title: 大家說蝦紅素能放鬆睫狀肌，研究真的直接測了這件事嗎？
      alt_titles:
      - 對焦指標有變化，就能說肌肉被放鬆了嗎？
      - 研究提出的機制，跟已經證實的效果差在哪？
      format: 說法查核
      duration: 50–60秒
      shots:
      - time: 0–3秒
        camera: 自製示意：網路說法「蝦紅素能放鬆睫狀肌」
        talk: 用網路常見說法開場
        visual: 主題字幕：「研究真的測了這件事嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 這句話要拆開來看
        visual: 字幕：「先拆開看」
      - time: 15–32秒
        camera: 圖卡：研究測了什麼 vs 說法講了什麼
        talk: 研究測的是對焦相關指標，說法講的是肌肉放鬆，兩者不一樣
        visual: 對照卡：「研究測的／說法講的」
      - time: 32–48秒
        camera: 圖卡：機制推測 vs 直接證據
        talk: 研究提出的機制是推測，跟已經證實的效果不同
        visual: 對照卡：「機制推測／直接證據」
      - time: 48–60秒
        camera: 回正面中景
        talk: 收在推測不等於證實
        visual: 收尾字幕：「推測，不等於證實」
      photos:
      - 自製網路說法示意（不截他人貼文）。
      - 兩張對照卡。
      notes: 明確區分機制推測與直接證據，不把假說講成確定結果。
      cta: 妳以前聽過這個說法嗎？
    - tab: 研究能否套用產品
      title: 研究用的蝦紅素，跟妳手上的產品條件一樣嗎？
      alt_titles:
      - 單方研究、複方研究，能不能混著講？
      - 讀人體研究，我會先找哪四個資訊？
      format: 4 件事清單（大字卡）
      duration: 50–60秒
      shots:
      - time: 0–3秒
        camera: 研究資料與產品並排
        talk: 開場問句
        visual: 主題字幕：「研究條件，跟妳手上的一樣嗎？」
      - time: 3–15秒
        camera: 正面中景
        talk: 研究用的條件，跟手上的產品不一定一樣
        visual: 字幕：「條件不一定一樣」
      - time: 15–30秒
        camera: 全螢幕大字卡
        talk: 讀人體研究，先找研究對象、配方
        visual: 大字卡①「研究對象」②「配方」
      - time: 30–45秒
        camera: 全螢幕大字卡
        talk: 再找每日劑量、補充時間
        visual: 大字卡③「每日劑量」④「補充時間」
      - time: 45–60秒
        camera: 回正面中景
        talk: 原料研究不能直接當成成品功效證明；單方、複方研究也不能混著講
        visual: 收尾字幕：「四件事對得上，才能拿來講」
      photos:
      - 研究資料摘要。
      - 四張大字卡。
      notes: 原料研究不能直接當成成品功效證明；單方研究、複方研究不混講。
      cta: 這四件事，妳以前讀研究時會看哪一個？
- key: vitamin_dk_calcium
  name: 維生素D鈣K
  label: 維DK鈣
  shot_headers:
  - 拍攝畫面與動作
  - 主持人口白
  - 重點字幕
  directions:
  - name: 族群主題
    scripts:
    - tab: 01｜30+／40+ 骨骼保養
      title: 保養清單裡，妳是不是漏掉了骨骼？
      duration: 約46秒
      props: 梳妝台、保養品、早餐、運動鞋、三張生活習慣卡。
      alt_titles:
      - 30歲後為什麼要開始注意骨骼保養？
      - 40歲後女性為什麼更要注意鈣攝取？
      - 骨骼保養真的要等老了才開始嗎？
      - 不同年齡的骨骼營養需求有什麼差別？
      shots:
      - time: 0～4秒
        camera: 保養品排列特寫。主持人拿起精華液，突然停下看鏡頭。
        talk: "「妳每天保養皮膚，但有沒有想過，骨骼也需要日常照顧？」"
        visual: 妳的保養清單，漏了骨骼嗎？
      - time: 4～11秒
        camera: 主持人半身，身旁出現「30+」「40+」兩張字卡。
        talk: "「骨骼保養可以從年輕時開始，不用等到年紀大才想到。」"
        visual: 骨骼保養，從日常開始
      - time: 11～20秒
        camera: 俯拍早餐，接著切到整天坐在電腦前的情境。
        talk: "「先看看自己：平常含鈣食物吃得夠嗎？有沒有規律活動？」"
        visual: 先看飲食，再看活動量
      - time: 20～30秒
        camera: 主持人依序放下「鈣」「維生素D」「運動」三張卡。
        talk: "「照顧骨骼，要一起考慮鈣、維生素D和適合自己的運動。」"
        visual: 鈣＋D＋適當運動
      - time: 30～40秒
        camera: 穿運動鞋、拿起早餐、記錄飲食，三個快速生活鏡頭。
        talk: "「先把生活習慣做好，再評估需不需要額外補充。」"
        visual: 飲食打底，評估補充
      - time: 40～46秒
        camera: 回到梳妝台，主持人把「骨骼保養」卡加入保養清單。
        talk: "「下次整理保養清單，也把骨骼放進去。」"
        visual: 今天開始，多照顧一件事
      notes: 30、40 歲是溝通對象，不要做成「一過生日骨頭立刻變差」的動畫。骨骼照顧包含營養與活動習慣。
      reference: NIAMS
      cta: 妳的保養清單裡，有骨骼這一項嗎？
      short_version: 保養品排列、主持人停下看鏡頭 → 「鈣＋D＋運動」三張卡 → 把「骨骼保養」卡加入清單（約15秒）。
    - tab: 02｜女性／更年期族群
      title: 更年期，為什麼要多留意骨骼？
      duration: 約48秒
      props: 餐桌、人生階段字卡、簡單骨骼更新圖卡。
      alt_titles:
      - 為什麼女性更需要注意鈣質攝取？
      - 更年期為什麼更要注意骨骼營養？
      - 女性不同人生階段的鈣需求一樣嗎？
      - 35歲後日常營養怎麼補比較完整？
      shots:
      - time: 0～4秒
        camera: 主持人看著「更年期」卡，再看向鏡頭。
        talk: "「聊到更年期，妳會想到熱潮紅，但骨骼也值得注意。」"
        visual: 更年期，也要留意骨骼
      - time: 4～12秒
        camera: 半身口播，側邊出現「荷爾蒙變化」字卡。
        talk: "「更年期前後，雌激素的變化會影響骨骼代謝。」"
        visual: 荷爾蒙變化，影響骨骼代謝
      - time: 12～21秒
        camera: 圖卡呈現骨骼持續「分解、形成」的循環，不做嚴重破碎效果。
        talk: "「骨骼一直在更新，更年期後，骨質流失可能加快。」"
        visual: 骨骼一直在更新
      - time: 21～30秒
        camera: 主持人整理一日餐盤：乳品、豆製品、蔬菜。
        talk: "「所以要檢查日常鈣攝取，也別漏掉維生素D和運動。」"
        visual: 檢查營養與生活習慣
      - time: 30～41秒
        camera: 主持人把問題寫在筆記本，帶到諮詢場景。
        talk: "「如果擔心骨骼狀況，可以和醫師討論，是否需要進一步評估。」"
        visual: 有疑慮，尋求專業評估
      - time: 41～48秒
        camera: 溫暖正面口播，背景保留餐桌。
        talk: "「這個階段，多了解自己的需要，就是照顧自己的開始。」"
        visual: 人生不同階段，重新檢視營養
      notes: 避免用「女性都缺鈣」或「補鈣就能處理更年期」當結論。更年期與骨質流失的關係有依據，但個人的補充需求仍需評估。
      reference: Health Professional Fact Sheet
      cta: 聊到更年期，妳第一個想到的是什麼？
      short_version: "「更年期」卡 → 骨骼更新循環圖 → 收尾「有疑慮，尋求專業評估」（約15秒）。"
    - tab: 03｜兒童／孕婦／特殊族群
      title: 同一瓶鈣，全家都能照同樣方式吃嗎？
      duration: 約48秒
      props: 產品瓶、兒童／孕期／成人三張卡、產品標示。
      alt_titles:
      - 成長期孩子為什麼要注意鈣與D？
      - 孕期為什麼需要注意鈣質攝取？
      - 小朋友、孕婦、成年人吃法一樣嗎？
      - 哪些族群補充前應該先詢問專業人員？
      shots:
      - time: 0～4秒
        camera: 主持人把一瓶產品放在三張族群卡中間。
        talk: "「買一瓶鈣，全家都照同樣方式吃，可以嗎？」"
        visual: 同一瓶，全家吃法一樣？
      - time: 4～12秒
        camera: 分別特寫三張卡，主持人用手指逐一指出。
        talk: "「年齡、人生階段和身體狀況不同，營養需求與適合的產品也可能不同。」"
        visual: 需求與適用產品，分開確認
      - time: 12～21秒
        camera: 孩子吃早餐的生活素材；不安排兒童吞成人膠囊。
        talk: "「孩子要先看飲食、年齡，以及產品是不是適合兒童使用。」"
        visual: 兒童：看年齡與產品適用性
      - time: 21～30秒
        camera: 孕期手冊與綜合維他命並列，主持人整理標示。
        talk: "「孕期可能已經在吃其他營養品，也要一起核對總攝取量。」"
        visual: 孕期：核對所有補充品
      - time: 30～41秒
        camera: 產品與藥袋並列，切到向醫師或藥師詢問的情境。
        talk: "「有慢性病、腎臟疾病或正在用藥，補充前先把產品標示帶給專業人員看。」"
        visual: 特殊狀況，先確認
      - time: 41～48秒
        camera: 主持人把產品轉到背面，鏡頭推近標示。
        talk: "「先確認適用族群，再決定怎麼補。」"
        visual: 不能只照別人的吃法
      notes: 本支是族群判斷教學，不以畫面暗示我們這瓶已適用兒童或孕婦；實際適用範圍需依產品資料確認。不同年齡的鈣需求，以及腎臟疾病、用藥相關注意事項，可參考官方營養資料。
      reference: Consumer
      cta: 妳家是不是也全家吃同一瓶？
      short_version: 產品放在三張族群卡中間 → 三張卡逐一特寫 → 收尾「先確認適用族群」（約15秒）。
    - tab: 04｜少曬太陽／久坐族
      title: 坐窗邊上班，就算補到維生素D嗎？
      duration: 約47秒
      props: 窗邊辦公桌、電腦、通勤素材、玻璃示意圖。
      alt_titles:
      - 每天有出門就代表維生素D夠嗎？
      - 上班族每天通勤算有曬太陽嗎？
      - 長時間待室內為什麼要注意D？
      - 久坐、少運動的人日常骨骼保養要注意什麼？
      shots:
      - time: 0～4秒
        camera: 主持人坐在有陽光的窗邊，指著窗外。
        talk: "「我每天坐窗邊，維生素D應該很夠吧？」"
        visual: 坐窗邊＝D夠？
      - time: 4～12秒
        camera: 鏡頭特寫窗玻璃，圖卡標出「UVB」。
        talk: "「隔著玻璃曬到陽光，不能當作有效的維生素D來源。」"
        visual: 有陽光，不代表有效合成D
      - time: 12～21秒
        camera: 通勤、進辦公室、下班天黑，三段快速切換。
        talk: "「每天有出門，也不代表維生素D一定足夠。」"
        visual: 有出門≠一定足夠
      - time: 21～30秒
        camera: 主持人用卡片列出「時間、季節、露出皮膚」。
        talk: "「日照合成會受到時間、季節和皮膚曝曬狀況等因素影響。」"
        visual: 日照合成，受多種因素影響
      - time: 30～40秒
        camera: 起身活動、戶外散步、查看餐盤。
        talk: "「長時間待室內，就重新看看自己的飲食和活動習慣。」"
        visual: 室內族，檢視日常習慣
      - time: 40～47秒
        camera: 主持人站在窗邊正面口播。
        talk: "「有疑慮時，再和專業人員討論需不需要補充或檢查。」"
        visual: 依個人狀況評估
      notes: 不安排「為了補D直接曝曬很久」的行為示範。隔著玻璃、日照影響因素等內容有官方資料支持。
      reference: Health Professional Fact Sheet
      cta: 妳每天真的有曬到太陽嗎？還是只有坐在窗邊？
      short_version: 窗邊「維生素D應該很夠吧？」→ 窗玻璃特寫「有陽光，不代表有效合成D」→ 收尾（約15秒）。
  - name: 成分知識
    scripts:
    - tab: 05｜鈣基本知識
      title: 鈣只有骨頭需要嗎？
      duration: 約47秒
      props: 人體圖卡、牛奶、傳統豆腐、小魚乾、鈣強化植物飲。
      alt_titles:
      - 人體的鈣都在哪裡？
      - 一天需要多少鈣？
      - 平常哪些食物含鈣？
      - 不喝牛奶怎麼補充鈣？
      shots:
      - time: 0～4秒
        camera: 主持人拿著骨骼圖卡，旁邊跳出問號。
        talk: "「提到鈣，妳是不是只想到骨頭？」"
        visual: 鈣，只有骨頭需要？
      - time: 4～12秒
        camera: 人體圖卡依序亮起骨骼、肌肉、神經圖示。
        talk: "「除了骨骼和牙齒，鈣也參與肌肉與神經的正常運作。」"
        visual: 骨骼、肌肉、神經都需要
      - time: 12～21秒
        camera: 餐桌俯拍，逐一放入含鈣食物。
        talk: "「乳品、傳統豆腐、小魚乾，都是日常可以考慮的鈣來源。」"
        visual: 從日常食物找鈣
      - time: 21～30秒
        camera: 牛奶移出畫面，放入鈣強化植物飲，特寫營養標示。
        talk: "「不喝牛奶，也可以找其他來源；植物飲要確認有沒有添加鈣。」"
        visual: 植物飲，記得看鈣標示
      - time: 30～40秒
        camera: 桌面俯拍：用真的牛奶、傳統豆腐、小魚乾堆出一天的鈣，各放【依衛福部食品營養成分資料庫填入份量】，旁邊立牌「成人每日鈣參考：1,000mg」
        talk: "「台灣成人每日鈣建議攝取量約一千毫克，是食物和補充品一起計算。」"
        visual: 一天1,000mg，用食物排出來
      - time: 40～47秒
        camera: 主持人拍下自己的餐盤。
        talk: "「先看看妳一天吃到多少，再評估補充多少。」"
        visual: 先估飲食，再補缺口
      notes: 成人數字不要套用所有兒童與特殊族群；食物的鈣含量仍受種類、份量影響。
      reference: Consumer
      format: 用真的食物堆出一天的鈣
      cta: 猜猜看，一天的鈣要靠食物吃到，需要多少份？留言告訴我。
      short_version: "「鈣只有骨頭需要？」→ 桌上用食物堆出一天1,000mg → 收尾「先估飲食，再補缺口」（約15–20秒）。"
    - tab: 06｜維生素D／D2 vs D3
      title: D2、D3，到底差在哪？
      duration: 約49秒
      props: D2／D3字卡、酵母／羊毛／地衣素材、產品標示。
      alt_titles:
      - 維生素D跟鈣有什麼關係？
      - D2跟D3差在哪？
      - 為什麼很多產品選D3？
      - 植物來源D3是什麼？
      - 曬太陽就一定不需要注意D攝取嗎？
      shots:
      - time: 0～4秒
        camera: 主持人左右手各拿一張D2、D3卡。
        talk: "「維生素D還分D2、D3，怎麼選？」"
        visual: D2 vs D3
      - time: 4～12秒
        camera: 將「D」卡放在鈣與腸道示意圖旁。
        talk: "「先記一件事：維生素D有助於鈣的吸收。」"
        visual: D與鈣吸收有關
      - time: 12～21秒
        camera: D2、D3卡並排，中間出現「都能提高維生素D狀態」。
        talk: "「D2和D3都能提高體內的維生素D指標。」"
        visual: 兩者都有作用
      - time: 21～31秒
        camera: 簡單比較圖卡，避免填入自行編造的倍數。
        talk: "「研究多顯示，D3提高與維持這個指標的效果較好。」"
        visual: D3：提高與維持指標
      - time: 31～42秒
        camera: 羊毛素材切換地衣素材，再切到實際產品背標。
        talk: "「D3有不同來源，也有地衣來源的非動物性版本，要看原料資料。」"
        visual: D3來源，需確認
      - time: 42～49秒
        camera: 主持人指向標示中的「種類、含量、來源」。
        talk: "「挑D，種類、含量和來源一起看。」"
        visual: 種類＋含量＋來源
      notes: 不把D2形容成沒用，也不把所有D3都稱為植物來源。
      reference: Health Professional Fact Sheet
      cta: 妳買維生素D，有注意是D2還是D3嗎？
      short_version: 左右手各拿D2、D3卡 → 並排「兩者都有作用」→ 收尾「種類＋含量＋來源」（約15秒）。
    - tab: 07｜維生素K／K1 vs K2
      title: K1、K2、MK-7，是什麼關係？
      duration: 約49秒
      props: 維生素K家族圖卡、綠葉蔬菜、納豆素材。
      alt_titles:
      - K1跟K2差在哪？
      - 為什麼補鈣產品常看到K2？
      - MK-4跟MK-7有什麼不同？
      - K2通常從哪裡來？
      - 為什麼D3、K2常放在一起？
      shots:
      - time: 0～4秒
        camera: K1、K2、MK-4、MK-7四張卡依序進畫面。
        talk: "「看補鈣產品，怎麼突然出現這麼多K？」"
        visual: K1、K2、MK-7是什麼？
      - time: 4～12秒
        camera: 主持人把卡片排成家族圖：K→K1／K2。
        talk: "「維生素K是一個家族，常見的有K1和K2。」"
        visual: 先認識K家族
      - time: 12～21秒
        camera: 綠葉蔬菜特寫，接著切納豆素材。
        talk: "「K1常見於綠葉蔬菜；部分發酵食品含有K2。」"
        visual: 來源有所不同
      - time: 21～30秒
        camera: 把MK-4、MK-7移到K2卡下方。
        talk: "「MK-4和MK-7，則是K2的不同形式。」"
        visual: MK-4、MK-7屬於K2
      - time: 30～40秒
        camera: 骨骼旁放置「相關蛋白質」圖卡，不畫鈣被強制送入骨頭。
        talk: "「維生素K參與一些和骨骼代謝有關的蛋白質作用。」"
        visual: K參與相關蛋白質作用
      - time: 40～49秒
        camera: 主持人拿起產品與藥袋。
        talk: "「如果正在服用華法林，含K產品先和醫師或藥師確認。」"
        visual: 華法林用藥者，先確認
      notes: 不要簡化為「K1只管凝血、K2只管骨頭」，也不以「MK-7」名稱直接保證產品效果。
      reference: Health Professional Fact Sheet
      cta: K家族裡，妳以前聽過幾個？
      short_version: 四張K卡依序進畫面 → 排成家族圖 → 「MK-4、MK-7屬於K2」（約15秒）。
    - tab: '08｜D＋K＋鈣搭配'
      title: 為什麼補鈣配方裡，還會看到D和K？
      duration: 約47秒
      props: 鈣／D／K三張卡、成分表、簡單機制圖。
      alt_titles:
      - 為什麼補鈣產品不一定只有鈣？
      - D、K、鈣分別扮演什麼營養角色？
      - 為什麼三種營養素常一起出現？
      - 挑複方鈣到底要看什麼？
      shots:
      - time: 0～4秒
        camera: 主持人拿著瓶子，指向三種成分。
        talk: "「明明是補鈣，為什麼還有D和K？」"
        visual: 補鈣，為什麼不只有鈣？
      - time: 4～12秒
        camera: "「鈣」卡配骨骼結構示意。"
        talk: "「鈣是骨骼的重要組成。」"
        visual: 鈣：骨骼的重要組成
      - time: 12～21秒
        camera: "「D」卡配腸道圖示，箭頭僅標「吸收」。"
        talk: "「維生素D，和鈣的吸收有關。」"
        visual: D：與鈣吸收有關
      - time: 21～30秒
        camera: "「K」卡配蛋白質圖示。"
        talk: "「維生素K，參與骨骼代謝相關蛋白質的作用。」"
        visual: K：參與相關蛋白質作用
      - time: 30～40秒
        camera: 三張卡合併後，鏡頭推到「每份含量」。
        talk: "「不過，成分放在一起，也要看各自含量與妳的需求。」"
        visual: 複方，還要看含量與需求
      - time: 40～47秒
        camera: 主持人將成分表攤平。
        talk: "「選複方，先看懂每個成分，再看一份提供多少。」"
        visual: 看角色，也看實際含量
      notes: 三者營養角色不能直接推成「這瓶一定比單方好」或「加K就能避免鈣沉積」。
      reference: NIAMS
      cta: 妳挑鈣的時候，會注意有沒有D和K嗎？
      short_version: 瓶子指向三種成分 → 鈣／D／K三張卡各一句 → 收尾「看角色，也看實際含量」（約15–20秒）。
    - tab: '09｜硼／複方營養'
      title: 配方裡的「硼」，到底是什麼？
      duration: 約48秒
      props: 成分標示、蘋果、豆類、堅果、研究字卡。
      alt_titles:
      - 硼到底是什麼？
      - 哪些食物含有硼？
      - 為什麼鈣配方裡會看到硼？
      - D3＋K2＋鈣＋硼的配方設計邏輯是什麼？
      shots:
      - time: 0～4秒
        camera: 成分表特寫，用手指圈出「硼」。
        talk: "「這個字妳可能很少看到：硼，是什麼？」"
        visual: 配方裡的「硼」
      - time: 4～12秒
        camera: 桌面放上水果、豆類、堅果。
        talk: "「硼是一種微量元素，也存在於一些日常食物裡。」"
        visual: 日常食物也有硼
      - time: 12～21秒
        camera: 主持人放出「鈣代謝」「骨骼研究」兩張卡。
        talk: "「它和鈣代謝、骨骼的關係，是研究關注的方向之一。」"
        visual: 與骨骼相關的研究方向
      - time: 21～31秒
        camera: 鏡頭回到主持人，背景圖卡標「仍需更多研究」。
        talk: "「但目前，硼還沒有被列為人體必需營養素。」"
        visual: 目前未列為人體必需營養素
      - time: 31～41秒
        camera: 硼原料文件與成分表並排。
        talk: "「看到配方有硼，要了解用的是什麼原料，以及實際含量。」"
        visual: 看原料、含量與依據
      - time: 41～48秒
        camera: 主持人把四種成分卡排整齊。
        talk: "「認識複方，就是把每個成分的依據看清楚。」"
        visual: 多一個成分，也要多一分理解
      notes: 不寫「缺硼就補不進鈣」「硼必不可少」；產品採用硼的具體理由需由配方文件支持。
      reference: Health Professional Fact Sheet
      cta: 妳以前在成分表上看過「硼」嗎？
      short_version: 成分表圈出「硼」→ 日常食物 → 「目前未列為人體必需營養素」（約15秒）。
    - tab: 10｜海藻鈣／鈣來源
      title: 海藻鈣、碳酸鈣、檸檬酸鈣，怎麼比較？
      duration: 約49秒
      props: 三張來源卡、空白比較表、產品背標。
      alt_titles:
      - 海藻鈣是什麼？
      - 海藻鈣、碳酸鈣、檸檬酸鈣差在哪？
      - 植物來源鈣一定比較好嗎？
      - 挑鈣要看來源還是實際鈣含量？
      shots:
      - time: 0～4秒
        camera: 三張鈣來源卡並排，主持人左右看。
        talk: "「買鈣，是不是光看名字就選不出來？」"
        visual: 鈣來源，怎麼比較？
      - time: 4～12秒
        camera: 指向「海藻鈣」，下方出現「原料來源」。
        talk: "「海藻鈣強調的是原料來源，具體組成要看原料規格。」"
        visual: 來源名稱，還要搭配規格
      - time: 12～22秒
        camera: 指向碳酸鈣卡，旁邊放餐盤圖示。
        talk: "「碳酸鈣通常適合隨餐補充。」"
        visual: 碳酸鈣：通常隨餐
      - time: 22～31秒
        camera: 指向檸檬酸鈣卡，旁邊出現胃部圖示。
        talk: "「檸檬酸鈣的吸收，比較不依賴胃酸。」"
        visual: 檸檬酸鈣：較不依賴胃酸
      - time: 31～42秒
        camera: 背標特寫，圈出「鈣含量」「每份」。
        talk: "「比較時要看一份提供多少鈣、吃法，以及自己的耐受狀況。」"
        visual: 實際鈣量＋吃法＋耐受狀況
      - time: 42～49秒
        camera: 主持人將「植物來源一定最好？」卡翻到問號面。
        talk: "「先看資料，再挑適合自己的來源。」"
        visual: 來源是比較的一部分
      notes: 沒有原料規格與比較研究時，不寫海藻鈣吸收率最高、不便秘或一定優於其他鈣。碳酸鈣與檸檬酸鈣的吃法差異有官方依據。
      reference: Health Professional Fact Sheet
      cta: 妳現在吃的是哪一種鈣？留言告訴我。
      short_version: 三張鈣來源卡 → 背標圈出鈣含量 → 收尾「來源是比較的一部分」（約15秒）。
  - name: 吃法與搭配
    scripts:
    - tab: 12｜鈣怎麼吃／分次補充
      title: 鈣一次吃很多，真的比較好嗎？
      duration: 約49秒
      props: 空白膠囊道具、分次示意卡、餐盤、產品標示。
      alt_titles:
      - 為什麼有人會分次補充？
      - 早上還晚上吃比較好？
      - 飯前還飯後？
      - 忘記吃一天隔天需要加倍嗎？
      shots:
      - time: 0～4秒
        camera: 主持人拿起一整把道具膠囊，停下放回桌面。
        talk: "「想補鈣，一次吃很多比較好嗎？」"
        visual: 一次多吃，真的比較好？
      - time: 4～12秒
        camera: 桌面圖卡標「每次實際鈣含量」。
        talk: "「要先看實際鈣含量，不能只數幾顆。」"
        visual: 看鈣量，不只看顆數
      - time: 12～22秒
        camera: "「一次大量」卡拆成兩張「分次」卡。"
        talk: "「補充量較多時，分次吃可能更合適；每次五百毫克以下，吸收比例通常較好。」"
        visual: 補充量較多，可評估分次
      - time: 22～32秒
        camera: 早餐、晚餐畫面各一段，旁邊放「依來源與標示」。
        talk: "「飯前還飯後，要看鈣的形式和產品標示。」"
        visual: 吃法，依來源與標示
      - time: 32～42秒
        camera: 行事曆漏勾一天，隔天不新增兩倍圖示。
        talk: "「忘記一天，先依原本建議吃法恢復，不要自行加倍補吃。」"
        visual: 不自行加倍
      - time: 42～49秒
        camera: 產品背標特寫，主持人指向食用方式。
        talk: "「妳手上這瓶怎麼吃，從正式標示開始看。」"
        visual: 先核對產品食用方式
      notes: 分次動畫是一般營養概念，不替我們的產品自行設計新吃法。實際每日顆數、能否分次需依標示。
      reference: Health Professional Fact Sheet
      series: 真的假的
      cta: 妳有過忘記吃、隔天補兩倍的經驗嗎？
      short_version: 一整把膠囊「一次多吃比較好？」→ 「一次大量」卡拆成兩張「分次」卡 → 「不自行加倍」（約15秒）。
    - tab: 13｜咖啡／飲食搭配
      title: 愛喝咖啡，就一定要多吃鈣嗎？
      duration: 約48秒
      props: 咖啡杯、一日飲食記錄、早餐餐盤、開水。
      alt_titles:
      - 愛喝咖啡的人要注意鈣嗎？
      - 咖啡可以跟鈣一起吃嗎？
      - 喝茶會影響補鈣嗎？
      - 牛奶喝很多就代表鈣一定夠嗎？
      - 外食族怎麼從飲食補鈣？
      shots:
      - time: 0～4秒
        camera: 主持人拿咖啡，另一手拿鈣產品。
        talk: "「每天喝咖啡，是不是就一定要多吃鈣？」"
        visual: 咖啡族，一定要多補鈣？
      - time: 4～12秒
        camera: 咖啡杯旁出現「咖啡因攝取量」字卡。
        talk: "「咖啡因對鈣吸收有些影響，但要一起看喝多少和整體飲食。」"
        visual: 看攝取量，也看整體飲食
      - time: 12～22秒
        camera: 早餐只有咖啡的畫面，再加入實際早餐。
        talk: "「先檢查，妳是不是經常用一杯咖啡，就代替一整餐？」"
        visual: 妳的早餐，只有咖啡嗎？
      - time: 22～32秒
        camera: 一日飲食記錄，圈出真正的含鈣食物。
        talk: "「與其直接加量，不如先看看每天有哪些鈣來源。」"
        visual: 先找一天的鈣來源
      - time: 32～41秒
        camera: 補充品放在開水旁，咖啡移到另一側。
        talk: "「補充品依標示吃，用開水搭配，也比較方便建立固定習慣。」"
        visual: 依標示，建立補充習慣
      - time: 41～48秒
        camera: 主持人拿起早餐與咖啡，正面口播。
        talk: "「把整天的營養顧好，比只盯著這杯咖啡更有幫助。」"
        visual: 從整天飲食開始檢查
      notes: 不使用「一杯咖啡就把鈣洗光」等誇張動畫，也不自行設定所有人都要間隔幾小時。
      reference: Health Professional Fact Sheet
      series: 真的假的
      cta: 妳的早餐，是不是常常只有一杯咖啡？
      short_version: 咖啡＋鈣產品「咖啡族一定要多補鈣？」→ 早餐只有咖啡 → 收尾「從整天飲食開始檢查」（約15秒）。
    - tab: 14｜保健品／藥物搭配
      title: 這一桌保健品，可以一起吃嗎？
      duration: 約51秒
      props: 魚油、B群、鐵、鈣等道具瓶、藥袋、手機清單。
      alt_titles:
      - 鈣跟鐵可以一起吃嗎？
      - D、K、鈣可以一起吃嗎？
      - 魚油、B群、益生菌可以一起吃嗎？
      - 服用抗凝血藥物為什麼要注意含K產品？
      - 正在吃藥可以補嗎？
      shots:
      - time: 0～4秒
        camera: 桌面排滿補充品，主持人伸手拿起又放下。
        talk: "「魚油、B群、鐵、鈣……可以一次全部吃嗎？」"
        visual: 這一桌，可以一起吃？
      - time: 4～12秒
        camera: 把瓶子轉到背面，鏡頭拍成分表。
        talk: "「先看成分有沒有重複，再看各自建議吃法。」"
        visual: 先查重複成分
      - time: 12～22秒
        camera: 鈣與鐵兩張卡分開擺。
        talk: "「鈣和鐵的搭配，也要考慮是否影響吸收，個別確認吃法。」"
        visual: 鈣與鐵，確認搭配方式
      - time: 22～32秒
        camera: 藥袋與鈣產品並排，特寫「正在用藥」。
        talk: "「鈣還可能和部分藥物產生交互作用，不能只套用一般保健品的吃法。」"
        visual: 有用藥，另外核對
      - time: 32～43秒
        camera: 含K產品與「華法林」卡並排。
        talk: "「服用華法林的人，新增含K產品前，要先問醫師或藥師。」"
        visual: 華法林＋含K產品：先確認
      - time: 43～51秒
        camera: 手機拍下全部產品，整理成一張清單。
        talk: "「把所有產品和藥物列在一起，才能確認妳適合怎麼搭配。」"
        visual: 帶完整清單去詢問
      notes: 不要把所有抗凝血藥都說成同樣受K影響，也不要給所有藥物同一套間隔時間。
      reference: Consumer
      cta: 妳現在每天吃幾種保健品？
      short_version: 桌面排滿補充品「可以一起吃？」→ 轉到背面查重複成分 → 收尾「帶完整清單去詢問」（約15秒）。
  - name: 迷思與觀念
    scripts:
    - tab: 15｜骨骼與年齡變化
      title: 骨骼，是長大後就不再改變嗎？
      duration: 約49秒
      props: 骨骼圖卡、年齡時間軸、鏡子、生活素材。
      alt_titles:
      - 骨骼會隨年齡改變嗎？
      - 臉部骨骼也會隨年齡變化嗎？
      - 臉部與全身骨骼的變化一樣嗎？
      - 為什麼骨骼保養不是老年人才需要注意？
      shots:
      - time: 0～4秒
        camera: 主持人敲一下骨骼模型，露出疑問表情。
        talk: "「骨頭看起來很硬，是不是長大後就固定了？」"
        visual: 骨骼，長大就不變？
      - time: 4～12秒
        camera: 圖卡呈現骨骼持續更新的循環。
        talk: "「其實骨骼是活的組織，一直在更新。」"
        visual: 骨骼是活的組織
      - time: 12～22秒
        camera: 成長、成年、熟齡三段時間軸，不做斷裂骨頭。
        talk: "「不同年齡，骨骼形成與流失的平衡，也可能不同。」"
        visual: 骨骼狀況會隨年齡變化
      - time: 22～32秒
        camera: 主持人看鏡子，畫面出現「補鈣＝臉變緊？」問號。
        talk: "「但不能因為談到骨骼，就直接把補鈣說成讓臉變緊的效果。」"
        visual: 骨骼知識，不能直接推成美容效果
      - time: 32～42秒
        camera: 含鈣食物、活動、諮詢三段生活鏡頭。
        talk: "「日常骨骼照顧，還是從營養、活動和需要時的專業評估開始。」"
        visual: 回到日常骨骼照顧
      - time: 42～49秒
        camera: 主持人把「骨骼」加入日常保養清單。
        talk: "「了解骨骼，也是在了解自己的身體。」"
        visual: 骨骼值得長期關注
      notes: 這支先講全身骨骼更新。若另外製作「臉部骨骼老化」，應另找直接研究支持，不以臉部前後對比暗示產品能改變骨相。骨骼持續更新的概念有官方資料支持。
      reference: Health Professional Fact Sheet
      cta: 妳以前以為骨頭長大就不會變了嗎？
      short_version: 敲骨骼模型「長大就不變？」→ 骨骼更新循環圖 → 收尾「骨骼值得長期關注」（約15秒）。
    - tab: 16｜補鈣常見迷思
      title: 補鈣最常聽到的三句話，是真的嗎？
      duration: 約50秒
      props: 三張迷思卡、補充品瓶、牛奶杯。
      alt_titles:
      - 鈣是不是吃越多越好？
      - 1000mg一定比500mg好嗎？
      - 吃鈣會結石嗎？
      - 補鈣會便秘嗎？
      - 喝牛奶就不用注意鈣嗎？
      - 曬太陽就一定有足夠D嗎？
      shots:
      - time: 0～4秒
        camera: 同事拿著 ⭕❌ 板入鏡，主持人快速丟出三句：「越多越好」「一定結石」「喝奶就夠」
        talk: "「這三句補鈣的話，妳覺得是真的還是假的？」"
        visual: 補鈣真的假的？
      - time: 4～13秒
        camera: 同事先舉板作答，主持人把「越多越好」卡翻面。
        talk: "「第一，鈣不是越多越好，要看食物和補充品加起來的總量。」"
        visual: "① 看總量，不盲目加量"
      - time: 13～24秒
        camera: 同事先舉板作答，「一定結石」卡旁出現「依個人狀況評估」。
        talk: "「第二，不能說吃鈣一定結石，也不能保證完全沒風險。有結石病史要先確認。」"
        visual: "② 結石風險，需個別評估"
      - time: 24～34秒
        camera: 同事先舉板作答，主持人拿牛奶杯，旁邊顯示一日飲食清單。
        talk: "「第三，有喝牛奶，也要看份量和一整天的鈣攝取。」"
        visual: "③ 有喝奶，也要看份量"
      - time: 34～43秒
        camera: 畫面出現「便秘？」小卡，主持人正面口播。
        talk: "「如果補充後腸胃不舒服，也要重新檢視用量和產品形式。」"
        visual: 不舒服，重新檢視吃法
      - time: 43～50秒
        camera: 主持人收起迷思卡，留下飲食記錄。
        talk: "「先了解自己，再決定怎麼補。」"
        visual: 補充前，先看個人需求
      notes: 不用「完全不會結石」「保證不便秘」做產品賣點。相關風險與腸胃反應需保留個別差異。
      reference: Consumer
      series: 真的假的
      format: 真的假的快問快答（同事拿 ⭕❌ 板）
      cta: 這三題妳答對幾題？留言告訴我。
      short_version: 同事拿 ⭕❌ 板快問快答三題 → 主持人逐一揭曉 → 收尾「先看個人需求」（約20秒）。
  - name: 原料與產品
    scripts:
    - tab: 11｜原料／專利成分
      title: 看到專利原料，妳還應該看什麼？
      duration: 約49秒
      props: 原料商資料、專利文件、檢驗報告、產品瓶。
      alt_titles:
      - 為什麼選海藻鈣？
      - 我們的D3、K2、硼分別從哪裡來？
      - 專利原料代表什麼？
      - 天然來源一定比較好嗎？
      - 看原料除了產地還要看什麼？
      shots:
      - time: 0～4秒
        camera: 主持人拿「專利原料」字卡，鏡頭迅速推近。
        talk: "「看到專利兩個字，妳還會往下看嗎？」"
        visual: 專利原料，要看哪些資料？
      - time: 4～12秒
        camera: 專利文件特寫，標示名稱、編號與範圍。
        talk: "「先看專利保護的是什麼：製程、配方，還是其他技術。」"
        visual: 第一看：專利內容
      - time: 12～21秒
        camera: 原料資料卡依序呈現供應商、產地、規格。
        talk: "「接著看原料來源、供應商，以及規格是否清楚。」"
        visual: 第二看：來源與規格
      - time: 21～31秒
        camera: 檢驗報告特寫，指向日期、樣品名稱、檢驗項目。
        talk: "「檢驗報告也要核對，檢驗的是哪個樣品、哪些項目。」"
        visual: 第三看：檢驗對象與項目
      - time: 31～42秒
        camera: 研究資料與實際產品成分表並排。
        talk: "「如果引用研究，也要看研究原料、用量，和實際產品是否對得上。」"
        visual: 第四看：研究與產品是否對應
      - time: 42～49秒
        camera: 主持人將文件排整齊，產品置於旁邊。
        talk: "「好的介紹，是把能確認的資料說清楚。」"
        visual: 用資料，說明原料選擇
      extra_sections:
      - heading: 產品置入方式
        paragraphs:
        - 這支可放入我們實際的【D3原料】【K2原料】【海藻鈣原料】【硼原料】，一個鏡頭介紹一種。文件、商標與原料影像需使用已確認可公開的版本。
      series: 背標偵探
      cta: 看到「專利原料」，妳會再往下看嗎？
      short_version: "「專利原料」字卡推近 → 「第一看～第四看」快切 → 收尾「用資料，說明原料選擇」（約15–20秒）。"
    - tab: 17｜產品成分／怎麼挑
      title: 瓶身寫1000mg，就代表有1000mg鈣嗎？
      duration: 約50秒
      props: 虛構示意包裝、放大鏡、成分表、單位字卡。
      alt_titles:
      - 買鈣到底要看什麼？
      - 為什麼不能只看瓶身最大的mg數字？
      - IU、mg、μg怎麼看？
      - 單方鈣跟複方鈣差在哪？
      - 高含量就代表比較好嗎？
      shots:
      - time: 0～4秒
        camera: 主持人拿放大鏡湊近示意瓶正面的大字「1000mg」
        talk: "「這個一千毫克，是什麼的重量？先猜猜看。」"
        visual: 猜猜看：1000mg 是什麼的重量？
      - time: 4～12秒
        camera: 瓶身轉到背面，圈出「原料重量」「鈣含量」。
        talk: "「先分清楚：原料的重量，和實際提供的鈣含量。」"
        visual: 原料重量≠實際鈣量
      - time: 12～22秒
        camera: "「每顆」「每份」「一天」三張卡依序出現。"
        talk: "「再看數字是每顆、每份，還是一天建議量。」"
        visual: 先看計算單位
      - time: 22～32秒
        camera: 白板呈現「1mg＝1000μg」。
        talk: "「毫克和微克也不同，一毫克等於一千微克。」"
        visual: 1mg＝1000μg
      - time: 32～43秒
        camera: 白板呈現「維生素D：1μg＝40IU」，旁註「僅此換算」。
        talk: "「維生素D還可能標IU，一微克維生素D等於四十IU。」"
        visual: 維生素D：1μg＝40IU
      - time: 43～50秒
        camera: 主持人翻背標，畫面勾選「份量、成分、含量」。
        talk: "「挑產品，翻到背面，把這三個地方看清楚。」"
        visual: 份量＋成分＋含量
      notes: 示意瓶要註明「示意包裝」，避免誤指某品牌；IU換算不可套用其他維生素。鈣原料重量與實際鈣含量、維生素D單位換算，可參考官方資料。
      reference: Health Professional Fact Sheet
      series: 背標偵探
      format: 猜謎開場＋放大鏡看標示
      cta: 猜猜看，1000mg 是什麼的重量？留言告訴我答案。
      short_version: 放大鏡湊近「1000mg」先讓觀眾猜 → 「原料重量≠實際鈣量」→ 收尾「份量＋成分＋含量」（約15秒）。
    - tab: 18｜我們的維DK鈣
      title: 這瓶維DK鈣，怎麼讀懂它的配方？
      duration: 約51秒
      props: 正式產品、四種成分卡、原料文件、建議食用量卡。
      alt_titles:
      - 為什麼我們不是只做鈣？
      - 為什麼選D3＋K2＋海藻鈣＋硼？
      - 一瓶到底有哪些成分？
      - 我們跟一般單方鈣差在哪？
      - 我們為什麼這樣設計配方？
      shots:
      - time: 0～4秒
        camera: 產品放在乾淨桌面，主持人拿起轉向鏡頭。
        talk: "「這瓶維DK鈣，裡面有哪些成分？」"
        visual: 一起看懂這瓶配方
      - time: 4～12秒
        camera: 正式成分表特寫，四張成分卡依序出現。
        talk: "「先看標示，主要成分是【核實後填入：D3、K2、海藻鈣、硼】。」"
        visual: 主要成分：【待核實】
      - time: 12～22秒
        camera: 鈣來源卡配對真實原料資料。
        talk: "「鈣使用的是【原料名稱】，每份提供【實際鈣含量】毫克。」"
        visual: 每份鈣：【待填】mg
      - time: 22～33秒
        camera: D3、K2卡與來源／含量圖卡並排。
        talk: "「D3的來源是【來源】，K2使用【形式】，各自含量都列在標示裡。」"
        visual: D3、K2：來源與含量
      - time: 33～43秒
        camera: 硼原料卡、食用方式卡特寫。
        talk: "「硼使用【原料名稱】，建議食用方式是【正式標示】。」"
        visual: 原料與吃法，清楚標示
      - time: 43～51秒
        camera: 產品正面與背標同框，主持人正面口播。
        talk: "「選之前，也把自己的飲食和其他補充品一起算進去。」"
        visual: 看懂產品，也看自己的需求
      notes: "「我們為什麼這樣設計」需補上品牌實際配方理由；目前先做可核對的成分介紹。與單方鈣的比較，可列成分與含量差異，不直接推定效果優劣。"
      cta: 看完配方，妳最想知道哪一個成分的原料？
      short_version: 產品轉向鏡頭 → 四張成分卡依序出現 → 收尾「看懂產品，也看自己的需求」（約15–20秒）。
    - tab: 19｜維DK鈣 FAQ
      title: 買之前，先確認這五件事
      duration: 約52秒
      props: 產品瓶、食用方式、適用族群、素食、保存四張卡。
      alt_titles:
      - 一天吃幾顆？
      - 什麼時間吃？
      - 可以長期吃嗎？
      - 幾歲可以吃？
      - 孕婦可以吃嗎？
      - 素食者可以吃嗎？
      - 需要冷藏嗎？
      - 多久會有感？
      shots:
      - time: 0～4秒
        camera: 五張問題卡迅速滑入，主持人拿起產品。
        talk: "「一天幾顆？孕婦能吃嗎？買之前，先確認這五件事。」"
        visual: 維DK鈣，先看5件事
      - time: 4～13秒
        camera: 背標食用方式特寫，圈出顆數與時段。
        talk: "「第一，這瓶的建議量是【待填】，食用時間依【正式標示】。」"
        visual: "① 顆數與食用時間"
      - time: 13～23秒
        camera: 兒童、孕婦、用藥者三張卡並列。
        talk: "「第二，適用年齡與特殊族群，要依產品資料和個人狀況確認。」"
        visual: "② 適用族群"
      - time: 23～33秒
        camera: 膠囊外殼圖示與所有成分清單。
        talk: "「第三，是否素食，要看所有成分和膠囊外殼；第四，保存依瓶身標示。」"
        visual: "③ 素食／④ 保存方式"
      - time: 33～44秒
        camera: 主持人翻開行事曆，畫面出現「多久有感？」
        talk: "「第五，營養補充不適合用幾天有感來判斷，是否長期補充也要看需求和總量。」"
        visual: "⑤ 如何評估補充需求"
      - time: 44～52秒
        camera: 主持人把瓶身背標朝向鏡頭。
        talk: "「有不確定的地方，把完整標示拿來詢問，才能得到適合妳的回答。」"
        visual: ''
      series: 留言回覆
      cta: 還有什麼想問的？留言給我，下一支回答妳。
      short_version: 五張問題卡滑入 → 背標食用方式特寫 → 收尾「有不確定，把完整標示拿來詢問」（約15–20秒）。
  - name: FAQ 短片（留言回覆系列）
    intro: 把 19 號 FAQ 拆成一題一支的 15 秒短片，用「回覆留言」的方式拍，量多、好拍，也最貼近購買前的問題。答案以正式標示為準，【待填】核對後再拍。
    scripts:
    - tab: Q1｜一天吃幾顆？
      title: 一天吃幾顆？
      series: 留言回覆
      format: 留言回覆（15 秒）
      duration: 約15秒
      shots:
      - time: 0～3秒
        camera: 手機近拍：自製留言畫面「一天吃幾顆？」
        talk: 主持人唸出留言：「有人問：一天吃幾顆？」
