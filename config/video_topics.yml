  knowledge_topics:
  - title: 為什麼需要B群
    questions:
    - B群到底不是只有「提神」？
    - B群其實不是一種維生素
    - B1～B12到底差在哪？
    - 為什麼現代人的營養補充品很常看到B群？
    approach: 從「B群＝提神」的刻板印象開場，用一排小卡把B群拆開，讓觀眾知道B群是一整組維生素，再帶到為什麼補充品很常看到B群。以營養知識為主，產品只在最後出現。
    duration: 60–75秒
    format: 知識拆解（小卡排列）
    shots:
    - time: 0–3秒
      camera: 手拿一瓶B群往桌上一放，旁邊一杯咖啡
      talk: 開場一句：「B群就是拿來提神的？」
      visual: 主題字幕：「B群到底不是只有『提神』？」
    - time: 3–15秒
      camera: 正面中景，直接看鏡頭
      talk: 分享很多人把B群和提神畫上等號，其實B群不是一種，是一整組
      visual: 字幕：「B群其實不是一種維生素」
    - time: 15–35秒
      camera: 桌面俯拍：8張小卡一張張排開
      talk: 依序介紹B1、B2、B3、B5、B6、B7、B9、B12，各自有自己的名字，例如B7就是生物素、B9就是葉酸
      visual: 小卡寫「編號＋名稱」：B1硫胺素／B2核黃素／B3菸鹼素／B5泛酸／B6／B7生物素／B9葉酸／B12
    - time: 35–48秒
      camera: 側面45度鏡頭，手指在小卡間移動
      talk: B1到B12不是同一種東西換數字，名稱、來源食物都不同，所以標示上會一項一項列出來
      visual: 字幕：「B1～B12，是不同的營養素」
    - time: 48–62秒
      camera: 正面中景，桌面放外食便當照片
      talk: 為什麼補充品很常看到B群：B群是水溶性維生素，現代人外食多、飲食不一定均衡，所以常被放進日常補充的選項
      visual: 外食、便當的真實照片
    - time: 62–75秒
      camera: 拿起全能，背標近拍B群欄位，定鏡
      talk: 收在看B群產品時，先看清楚裡面有哪幾種、各多少
      visual: 收尾字幕：「B群是一整組，看清楚有哪幾種」
    photos:
    - 8張B群小卡（編號＋名稱）。
    - 外食、便當的真實照片。
    - 全能背標B群欄位。
    notes: 這支是知識片，不講各別B群的功效；不說「B群讓人有精神」「吃B群就不累」；咖啡只當開場道具。
    cta: 妳以前也以為B群就是提神嗎？
    short_version: B群＋咖啡「就是拿來提神的？」→ 8張小卡快速排開 → 字幕「B群其實是一整組」（約15秒）。
  - title: 為什麼需要鋅
    questions:
    - 鋅到底是什麼？
    - 人體為什麼需要「礦物質」？
    - 哪些天然食物含鋅？
    - 女生也需要注意鋅嗎？
    approach: 用「鋅到底是什麼？」的直白提問開場，先講礦物質是人體需要、但要從飲食取得的營養素，再帶到天然含鋅的食物，最後回答女生需不需要注意。
    duration: 60–75秒
    format: 街訪式提問＋知識解答
    shots:
    - time: 0–5秒
      camera: 快剪：同事或路人被問「鋅是什麼？」，有人愣住、有人亂猜
      talk: 用真實反應開場
      visual: 主題字幕：「鋅到底是什麼？」
    - time: 5–18秒
      camera: 正面中景，直接看鏡頭
      talk: 鋅是一種礦物質；人體需要礦物質，但自己不會製造，要從飲食取得
      visual: 字幕：「礦物質＝身體需要、要從飲食來」
    - time: 18–35秒
      camera: 桌面俯拍：依序放上牡蠣、紅肉、蛋、堅果、全穀、豆類
      talk: 介紹天然含鋅的食物
      visual: 食物照片＋名稱小標
    - time: 35–50秒
      camera: 側面45度鏡頭，拿起一份外食或素食便當
      talk: 女生也需要注意：外食、節食或茹素時，飲食內容比較單一，就要多留意每天吃到的種類
      visual: 字幕：「女生也要注意：吃得夠不夠多樣」
    - time: 50–62秒
      camera: 全能背標近拍，指出鋅的欄位與每份含量
      talk: 如果有在吃補充品，看標示上的鋅含量，和飲食一起安排
      visual: 鋅欄位放大＋每份含量
    - time: 62–75秒
      camera: 回正面中景，食物與產品同框
      talk: 收在先從飲食開始，再看需不需要補充
      visual: 收尾字幕：「先從吃開始，再看要不要補」
    photos:
    - 同事或路人回答的快剪片段（取得入鏡同意）。
    - 牡蠣、紅肉、蛋、堅果、全穀、豆類的食物照片。
    - 全能背標鋅欄位。
    notes: 不講鋅對皮膚、免疫、生育等功效；不暗示女生普遍缺鋅；街訪片段要取得入鏡同意。
    cta: 妳知道自己平常有吃到哪些含鋅的食物嗎？
    short_version: 路人被問「鋅是什麼？」愣住 → 一桌含鋅食物 → 字幕「礦物質要從飲食來」（約15秒）。
  - title: 為什麼需要鎂
    questions:
    - 最近很紅的鎂到底是什麼？
    - 鎂其實是人體需要的礦物質
    - 哪些食物天然含鎂？
    - 為什麼堅果、深綠色蔬菜常被提到？
    approach: 承接「最近大家都在討論鎂」的話題，用輕鬆的方式說明鎂就是一種人體需要的礦物質，再帶到哪些食物天然含鎂，解釋為什麼堅果、深綠色蔬菜常被提到。
    duration: 60–75秒
    format: 話題跟風＋知識解答
    shots:
    - time: 0–3秒
      camera: 手機螢幕近拍：滑社群，連續幾則都在講「鎂」
      talk: 開場一句：「最近大家都在講鎂，它到底是什麼？」
      visual: 主題字幕：「最近很紅的鎂到底是什麼？」
    - time: 3–15秒
      camera: 正面中景，直接看鏡頭
      talk: 鎂其實不是新東西，它是人體需要的礦物質之一
      visual: 字幕：「鎂＝人體需要的礦物質」
    - time: 15–32秒
      camera: 桌面俯拍：依序放上菠菜等深綠色蔬菜、杏仁、南瓜子、全穀、豆類
      talk: 介紹天然含鎂的食物
      visual: 食物照片＋名稱小標
    - time: 32–48秒
      camera: 側面45度鏡頭，拿起一把堅果和一把深綠色蔬菜
      talk: 為什麼常被提到：堅果、種子是含鎂量比較高的食物；深綠色蔬菜的葉綠素中心就是鎂，所以常被拿來當例子
      visual: 字幕：「葉綠素中心＝鎂」＋簡單示意圖
    - time: 48–62秒
      camera: 全能背標近拍，指出鎂的欄位與每份含量
      talk: 如果有在吃補充品，看標示上的鎂含量，和飲食一起安排
      visual: 鎂欄位放大＋每份含量
    - time: 62–75秒
      camera: 回正面中景，堅果、蔬菜與產品同框
      talk: 收在不用跟風，先認識它、再看自己吃了什麼
      visual: 收尾字幕：「不用跟風，先認識再決定」
    photos:
    - 社群討論鎂的示意畫面（自製，不截他人貼文）。
    - 深綠色蔬菜、堅果、種子、全穀、豆類照片。
    - 葉綠素結構簡單示意圖。
    - 全能背標鎂欄位。
    notes: 網路上常把鎂和睡眠、放鬆、抽筋連在一起，這支不碰這些說法；社群畫面用自製示意，不截別人的貼文。
    cta: 妳最近也有被鎂洗版嗎？留言告訴我妳看到的說法。
    short_version: 滑社群一直看到鎂 → 一桌含鎂食物 → 字幕「葉綠素中心＝鎂」（約15秒）。
  - title: 怎麼挑B群
    questions:
    - B群不是數字越高越好？
    - 買B群我第一個看什麼？
    - 天然來源、合成來源差在哪？
    - 看懂營養標示比看「超高單位」重要
    approach: 從「B群是不是數字越高越好」的選購迷思開場，老闆分享自己挑B群第一個看什麼，帶到天然來源、合成來源的差別，最後收在看懂營養標示。
    duration: 60–75秒
    format: 選購迷思破解（老闆第一人稱）
    owner_story: 讓老闆講自己第一次看到「超高單位」時的反應，以及後來怎麼學會看標示，會比條列規則更有說服力。
    shots:
    - time: 0–3秒
      camera: 手機螢幕近拍：自製示意的購物頁面，大字「超高單位」「XXXX%」
      talk: 開場一句：「B群是數字越高越好嗎？」
      visual: 主題字幕：「B群不是數字越高越好？」
    - time: 3–15秒
      camera: 正面中景，直接看鏡頭
      talk: 分享自己以前也會被大數字吸引，後來發現要先看別的
      visual: 字幕：「數字很大，先別急」
    - time: 15–30秒
      camera: 背標近拍：手指依序點過B群各項、每份含量、每日參考值百分比
      talk: 買B群我第一個看什麼：有哪幾種B、每份含量多少、一天吃幾顆
      visual: 大字卡：「種類／每份含量／一天份量」
    - time: 30–48秒
      camera: 側面45度鏡頭，桌上放藜麥照片和實驗室原料示意照
      talk: 天然來源、合成來源差在哪：原料取得方式不同，各有標示方式；重點是看清楚標示寫的是哪一種，不是誰一定比較好
      visual: 左右對照圖：「天然來源／合成來源＝取得方式不同」
    - time: 48–62秒
      camera: 背標近拍，手指放在營養標示表上
      talk: 看懂營養標示，比看「超高單位」重要
      visual: 字幕：「看懂標示 > 看超高單位」
    - time: 62–75秒
      camera: 回正面中景，產品入鏡
      talk: 收在選B群的態度：看懂再選
      visual: 收尾字幕：「看懂標示，再選B群」
    photos:
    - 自製的「超高單位」購物頁示意畫面（不用他牌真實頁面）。
    - 全能背標與營養標示表。
    - 藜麥照片、原料示意照片。
    - 天然來源／合成來源對照圖。
    notes: 不點名、不比較他牌；不說合成B群不好、不能吸收；不說高劑量有害或無效，只引導看標示。
    cta: 妳買B群，第一個看的是什麼？
    short_version: "「超高單位」購物頁 → 手指點背標三個欄位 → 字幕「看懂標示 > 看超高單位」（約15秒）。"
  - title: 配方來源
    questions:
    - 為什麼你們選藜麥來源B群？
    - 酵母來源B群是什麼？
    - 不同原料來源差在哪？
    approach: 用觀眾常問的「為什麼你們選藜麥來源B群？」開場，讓老闆用問答方式說明選料理由，介紹酵母來源B群，再整理不同原料來源的差別。以原料資訊為主，不做優劣比較。
    duration: 60–75秒
    format: 留言問答（老闆回覆）
    owner_story: 這支最適合老闆本人回答，可以講當初看過哪些原料、為什麼最後選這幾種。
    shots:
    - time: 0–3秒
      camera: 手機螢幕近拍：一則留言「為什麼你們選藜麥來源B群？」
      talk: 用回覆留言的方式開場
      visual: 留言截圖式字幕（自製）
    - time: 3–20秒
      camera: 正面中景，老闆拿著藜麥穀粒
      talk: 回答為什麼選藜麥來源B群（PANMOL®）：說明選料時考量的原料來源與資料
      visual: 藜麥穀粒＋PANMOL®原料名稱卡
    - time: 20–38秒
      camera: 桌面俯拍：放上酵母原料照片與名稱卡
      talk: 酵母來源B群是什麼：介紹LALMIN®是以酵母為來源的原料
      visual: 酵母原料照片＋LALMIN®原料名稱卡
    - time: 38–55秒
      camera: 側面45度鏡頭，兩張原料卡並排
      talk: 不同原料來源差在哪：取得方式、原料型態不同，選料時會看供應商資料與研究
      visual: 對照圖卡：「來源／原料型態／供應商資料」
    - time: 55–65秒
      camera: 背標近拍，對照原料名稱
      talk: 教觀眾在背標上找到這些原料
      visual: 原料名稱卡＋背標對照框
    - time: 65–75秒
      camera: 回正面中景，產品與原料卡同框
      talk: 收在選料是看資料做決定
      visual: 收尾字幕：「每一種原料，都是看過資料才選的」
    photos:
    - 自製的留言畫面（不截真實用戶帳號）。
    - 藜麥穀粒照片、PANMOL®原料名稱卡。
    - 供應商提供的酵母原料照片、LALMIN®原料名稱卡。
    - 全能正式成分標示。
    notes: 原料說明以供應商正式資料為準；不說某一種來源一定比較好或比較好吸收；留言畫面用自製，不露真實用戶帳號。
    cta: 妳還想知道全能裡哪一種原料？留言問我，下一支回答妳。
    short_version: 留言「為什麼選藜麥？」→ 老闆拿藜麥回答一句 → 原料卡排開（約15–20秒）。
- key: astaxanthin
  name: 蝦紅素
  directions:
  - name: 族群主題
    intro: 從每天遇到的用眼情境切入。這一類適合先拍，觀眾容易認出自己的生活，也比較適合老闆直接開口講。
    scripts:
    - tab: 上班族｜螢幕接力
      title: 上班看電腦，下班滑手機，妳的眼睛什麼時候下班？
      first_batch: true
      alt_titles:
      - 會議、Excel、LINE輪流看，切換螢幕算休息嗎？
      - 午休滑手機，其實有離開近距離用眼嗎？
      format: 一日行程快剪
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 快剪：電腦→會議投影→LINE→午休滑手機→通勤滑手機→回家追劇
        talk: 不講話，用畫面堆出一整天都在看近
        visual: 主題字幕：「妳的眼睛什麼時候下班？」
      - time: 3–15秒
        camera: 正面中景，直接看鏡頭
        talk: 老闆把自己一天的用眼行程講出來，發現幾乎整天都在看近
        visual: 一日用眼時間軸：08:30電腦／12:30手機／18:00通勤／22:00追劇
      - time: 15–28秒
        camera: 側面45度，手上拿手機、身後是電腦
        talk: 從電腦換到手機，只是「換一個螢幕」，不是休息
        visual: 字幕：「換螢幕 ≠ 休息」
      - time: 28–42秒
        camera: 窗邊中景：放下手機，起身看向窗外遠處
        talk: 真正的休息是暫停近距離用眼：起身、看遠、離開座位
        visual: 字幕：「暫停看近，才算休息」
      - time: 42–55秒
        camera: 桌面俯拍：在行程表上畫出幾段休息時間
        talk: 示範把休息排進一天的具體做法
        visual: 收尾字幕：「讓眼睛也有下班時間」
      photos:
      - 一日用眼時間軸圖。
      - 窗邊看遠的生活照片。
      notes: 不用眼睛受損或恐嚇式動畫；產品不當主角，不說吃蝦紅素就能撐更久。
      cta: 妳今天的螢幕使用時間是幾小時？截圖留言給我看。
    - tab: 上班族｜工作環境
      title: 工作不能少看電腦，可以先改哪三件事？
      alt_titles:
      - 字太小就往前靠，妳的螢幕設定調對了嗎？
      - 雙螢幕很好用，桌面怎麼安排比較順？
      format: 桌面改造示範（3 件事）
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 老闆整個人往前貼近螢幕看小字
        talk: 開場一句：「妳是不是也這樣看電腦？」
        visual: 主題字幕：「工作不能少看電腦，可以先改哪三件事？」
      - time: 3–15秒
        camera: 螢幕設定畫面近拍：把字體和顯示比例放大
        talk: 第一件：字體大小調到不用往前靠
        visual: 大字卡①「字體大小」
      - time: 15–28秒
        camera: 側面中景：調整螢幕高度與前後距離
        talk: 第二件：螢幕位置與距離
        visual: 大字卡②「螢幕位置」
      - time: 28–42秒
        camera: 桌面俯拍：調檯燈、拉窗簾避開反光；把主要螢幕移到正前方
        talk: 第三件：光線與反光；雙螢幕把最常看的那台放正前方
        visual: 大字卡③「光線與反光」
      - time: 42–55秒
        camera: 改造前、改造後的桌面對照
        talk: 收在工作沒辦法少看，但環境可以先調
        visual: 收尾字幕：「先把環境調好」
      photos:
      - 改造前後的桌面照片。
      - 螢幕字體設定畫面。
      notes: 螢幕距離、高度若要給數字，需註明來源；這支不帶產品功效。
      cta: 這三件事，妳的桌面最想先改哪一件？
    - tab: 讀書族｜長時間看近
      title: 讀書排了三小時，有把休息排進去嗎？
      first_batch: true
      alt_titles:
      - 課本換成平板，算讓眼睛休息嗎？
      - 考前一直看小字，讀書環境可以怎麼調？
      format: 讀書計畫表改寫
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 讀書計畫表近拍：一整塊三小時寫著「讀書」
        talk: 用計畫表直接開場
        visual: 主題字幕：「讀書排了三小時，有把休息排進去嗎？」
      - time: 3–15秒
        camera: 正面中景，坐在書桌旁
        talk: 分享準備考試時常常一口氣讀到底，休息都是想到才停
        visual: 字幕：「讀書有排，休息沒排」
      - time: 15–28秒
        camera: 桌面俯拍：在計畫表上切出幾段休息時間
        talk: 把休息直接寫進計畫表，跟讀書一樣排時間
        visual: 改寫後的計畫表
      - time: 28–42秒
        camera: 側面45度：把課本換成平板
        talk: 換成平板還是在看近，不等於休息；順便調整閱讀距離
        visual: 字幕：「課本換平板 ≠ 休息」
      - time: 42–55秒
        camera: 調亮檯燈、把書本拉開一點距離
        talk: 收在讀書環境的照明與距離
        visual: 收尾字幕：「把休息排進讀書計畫」
      photos:
      - 讀書計畫表（改寫前後）。
      - 書桌照明調整的照片。
      notes: 不把保健品描述為「讀更久」的工具；族群以大學生、成人考生為主，不出現兒童。
      cta: 妳讀書的時候會排休息嗎？
    - tab: 讀書族｜營養與作息
      title: 考試前只顧讀書，三餐是不是也隨便吃？
      alt_titles:
      - 讀書族挑營養補充品，先看成分還是廣告？
      - 保健品買好了，睡眠和休息有安排嗎？
      format: 生活反差
      duration: 45–55秒
      shots:
      - time: 0–3秒
        camera: 書桌上泡麵、手搖飲，旁邊一疊考卷
        talk: 用考前書桌的真實樣子開場
        visual: 主題字幕：「考試前，三餐是不是也隨便吃？」
      - time: 3–15秒
        camera: 正面中景
        talk: 考前常見：吃飯隨便、睡得少
        visual: 字幕：「只顧讀書，其他都隨便」
      - time: 15–28秒
        camera: 桌面俯拍：把泡麵換成一份均衡便當
        talk: 先把三餐顧好，蛋白質、蔬菜都要有
        visual: 均衡餐點照片
      - time: 28–42秒
        camera: 側面45度，拿起蝦紅素翻到背標
        talk: 如果要挑營養補充品，先看成分與標示，不是看廣告詞
