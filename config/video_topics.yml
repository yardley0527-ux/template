# 產品拍片主題（/video_topics）。新增產品時在 products 底下加一段即可。
# 結構：products → directions（影片方向）→ scripts（每個主題各自的分鏡）；knowledge_topics 是沒有分鏡的知識型題目。
# 文字中的 **粗體** 會在頁面上轉成粗體。
products:
- key: omnipotent
  name: 全能
  label: B群
  directions:
  - name: 長頭髮方向
    scripts:
    - title: 想把頭髮留長，妳開始注意每天吃什麼了嗎？
      follow_up: 從留長髮的生活需求，談飲食與營養補充的選擇；不承諾全能讓頭髮長快
      approach: 從「想把頭髮留長」的生活目標開始，分享留髮期間除了剪髮、護髮，也開始回頭看自己每天吃什麼；帶到均衡飲食與營養補充的選擇。不承諾全能讓頭髮長快。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 鏡前近拍：用手順過頭髮，比劃一下想留到的長度
        talk: 引出「想把頭髮留長」的生活目標
        visual: 主題字幕：「想把頭髮留長，妳開始注意吃什麼了嗎？」
      - time: 5–15秒
        camera: 正面中景，直接看鏡頭
        talk: 分享留髮期間的心情：除了修剪、護髮，也開始回頭看自己的飲食
        visual: 字幕：「留長髮，不只是等」
      - time: 15–28秒
        camera: 桌面俯拍：一天三餐的照片排開，手指依序點出蛋白質、蔬菜、全穀類
        talk: 談均衡飲食是基礎，三餐裡蛋白質、蔬菜、全穀類都要有
        visual: 真實三餐照片＋食物類別小標
      - time: 28–40秒
        camera: 側面45度鏡頭，拿起全能翻到背面；切成分特寫
        talk: 補充品是飲食之外的安排；選的時候看B群、生物素、鋅等完整配方與每份含量
        visual: 配方分類圖；標註每份含量
      - time: 40–52秒
        camera: 回正面近景，清楚講完關鍵句
        talk: 營養是日常照顧的一部分，頭髮狀況受很多因素影響，不會因為吃了某一樣就長得特別快
        visual: 字幕：「沒有吃了就長快的捷徑」
      - time: 52–60秒
        camera: 產品與餐點同框，定鏡
        talk: 收在耐心與規律：好好吃飯、好好照顧自己
        visual: 收尾字幕：「留長髮，從每天好好吃開始」
      photos:
      - 鏡前整理頭髮的生活照片。
      - 真實三餐照片。
      - 全能最新背標。
      - 配方分類圖（B群＋生物素＋鋅）。
      notes: 不拍「吃了幾週長幾公分」、髮量前後對比或用尺量頭髮變化；口播不說「促進頭髮生長」「生髮」。
    - title: 護髮買了很多，卻常常忙到隨便吃一餐？
      follow_up: 從重視外在保養、忽略吃飯的反差，帶到日常營養
      approach: 從「外在保養很認真，吃飯卻常常隨便」的生活反差開始，再帶到日常飲食、營養補充與生物素。讓關注髮絲保養的女性有共鳴，不承諾吃全能會長髮。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 桌面近拍：護髮產品整齊排好，旁邊放一份簡單早餐；鏡頭緩慢移動
        talk: 點出「保養買得很齊，忙起來卻隨便吃」的反差
        visual: 主題字幕：「護髮很認真，吃飯卻很隨便？」
      - time: 5–15秒
        camera: 正面中景，直接看鏡頭；桌面保留早餐
        talk: 談忙碌時常見的飲食情境：趕時間、餐點重複、少了食物種類
        visual: 插入早餐、便當的真實照片
      - time: 15–25秒
        camera: 桌面俯拍，把可增加的食物放在餐點旁
        talk: 示範先從飲食內容開始照顧自己
        visual: 字幕：「先看看每天吃了什麼」
      - time: 25–38秒
        camera: 側面45度鏡頭，拿起全能，翻到背面；切成分特寫
        talk: 說明選擇補充品時，會看完整B群、C、鋅及原料資訊
        visual: 配方分類圖；不做髮絲效果圖
      - time: 38–48秒
        camera: 背標近拍，指出生物素，再帶到每份含量
        talk: 生物素就是B7；認識成分之外，也要看份量
        visual: "**「B7＝生物素」**名稱圖"
      - time: 48–60秒
        camera: 回正面中景；餐點與產品同框
        talk: 收在日常照顧：外在保養、正常飲食與適當補充一起安排
        visual: 收尾字幕：「照顧自己，也從每天吃的開始」
      photos:
      - 同一張桌面的護髮用品與餐點照片。
      - 真實早餐、午餐照片。
      - 全能最新背標。
      - B7名稱圖、B群＋C＋鋅分類圖。
      notes: 不要拍落髮、髮量前後對比、頭髮變長的時間軸，也不要讓膠囊接到毛囊生長動畫。這支的重點是生活習慣與營養認識。
    - title: 想留長髮，看到「生物素」就直接下單？
      follow_up: 從購物情境，教觀眾看完整配方與份量
      approach: 從「看到關鍵字就想按下單」的購物情境開始，分享自己現在會先停下來看完整配方、每份含量與食用份量，再決定要不要買。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 手機螢幕近拍：滑購物頁面，停在大大的「生物素」字樣，手指準備按下單
        talk: 引出看到單一成分就想買的衝動
        visual: 主題字幕：「看到生物素，就直接下單？」
      - time: 5–15秒
        camera: 正面中景，直接看鏡頭
        talk: 分享自己以前也會被單一成分吸引，現在會先停一下
        visual: 字幕：「先停一下，看完整再決定」
      - time: 15–27秒
        camera: 全能背標近拍，手指指出生物素欄位
        talk: 生物素就是B7；但一瓶產品不會只有一種成分，要看完整配方
        visual: "**「B7＝生物素」**名稱圖"
      - time: 27–40秒
        camera: 側面45度鏡頭，手指依序點過B群、C、鋅、鎂欄位
        talk: 示範看三件事：還有哪些成分、每份含量多少、一天吃幾顆
        visual: 圖卡：「完整成分／每份含量／食用份量」
      - time: 40–50秒
        camera: 桌面俯拍：全能和原本在吃的補充品排在一起
        talk: 提醒對照手上已經在吃的產品，避免重複補充
        visual: 同名成分使用同色框線
      - time: 50–60秒
        camera: 回正面中景，產品入鏡
        talk: 收在選購態度：看懂再買
        visual: 收尾字幕：「看懂標示，再按下單」
      photos:
      - 自製的購物頁面示意畫面（不用他牌真實頁面）。
      - 全能最新背標。
      - B7名稱圖。
      - 比對用的其他補充品標示（遮住品牌）。
      notes: 不比較或貶低他牌；口播不說生物素「讓頭髮長得快」；購物畫面用自製示意，不截他牌頁面。
  - name: 好睡方向
    scripts:
    - title: 明明很累，躺下卻還在想明天的事？
      follow_up: 從睡前狀態談作息、飲食及營養；B6知識作為其中一部分，不導向全能解決睡不著
      approach: 從「身體累了、腦袋還在跑行程」的睡前狀態開始，分享自己睡前整理思緒、固定作息的方法；B6知識只作為日常營養的一部分，不導向全能解決睡不著。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 床邊近拍：關燈前拿起手機看明天行程，又放下
        talk: 引出累了卻停不下思緒的情境
        visual: 主題字幕：「明明很累，躺下卻還在想明天？」
      - time: 5–15秒
        camera: 正面中景，柔和室內光；直接看鏡頭
        talk: 分享忙碌時常有的狀態：腦袋還在排明天的事
        visual: 字幕：「身體累了，腦袋還沒下班」
      - time: 15–28秒
        camera: 桌面俯拍：在紙上寫下明天待辦，放下手機，旁邊一杯溫水
        talk: 分享自己睡前會做的整理：把事情寫下來、固定上床時間
        visual: 字幕：「把明天交給紙，不交給枕頭」
      - time: 28–40秒
        camera: 側面45度鏡頭，接簡單B6知識圖
        talk: 飲食與營養也是日常的一部分；B6參與神經傳導物質合成，是常被討論的營養素之一
        visual: B6知識圖，註明資料來源
      - time: 40–50秒
        camera: 回正面近景，清楚講完關鍵差別
        talk: 營養素的角色不等於產品效果；睡不好先看作息，長期困擾要找醫師
        visual: 字幕：「營養是日常照顧，不是安眠藥」
      - time: 50–60秒
        camera: 臥室定鏡：燈光調暗，手機放到遠處
        talk: 收在建立自己的睡前習慣
        visual: 收尾字幕：「給自己一段好好下班的時間」
      photos:
      - 睡前整理桌面、寫待辦的生活照片。
      - 簡潔的B6知識圖。
      - 全能B6成分欄位。
      notes: 產品不放在床邊當主角；不拍吃完很快睡著、隔天精神變好的畫面；口播不用「助眠」「改善失眠」等字眼。
    - title: 白天靠咖啡撐，晚上又捨不得放下手機？
      follow_up: 從一天的生活循環，談睡眠與日常照顧
      approach: 用「白天靠咖啡、晚上滑手機」的一天循環開場，讓觀眾看見晚睡→白天累→更多咖啡的循環，再分享自己調整作息、好好吃飯與營養補充的小習慣。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 早上近拍：第一杯咖啡，快速剪接到第二、第三杯
        talk: 引出白天靠咖啡撐一整天
        visual: 主題字幕：「白天靠咖啡撐？」
      - time: 5–12秒
        camera: 晚上近拍：躺在沙發滑手機，畫面帶到深夜時間
        talk: 接上晚上捨不得放下手機
        visual: 字幕：「晚上又捨不得放下手機」
      - time: 12–25秒
        camera: 正面中景，直接看鏡頭
        talk: 點出這是一個循環：晚睡→白天累→喝更多咖啡
        visual: 循環圖：「晚睡 → 白天累 → 更多咖啡」
      - time: 25–40秒
        camera: 桌面俯拍：咖啡杯、手機、餐點、全能排在桌上，手逐一移動
        talk: 分享自己調整的小事：咖啡不拖到下午、固定放下手機的時間、早餐和午餐好好吃
        visual: 字幕依序條列三個小調整
      - time: 40–50秒
        camera: 側面45度鏡頭，拿起全能；食用方式特寫
        talk: 營養補充是日常照顧之一，依正式標示使用，不能取代休息
        visual: 最新食用方式照片
      - time: 50–60秒
        camera: 回正面中景收尾
        talk: 收在先從一個小習慣開始調整
        visual: 收尾字幕：「先從一個小習慣開始」
      photos:
      - 早上咖啡、深夜滑手機的生活照片。
      - 循環圖（晚睡→白天累→咖啡）。
      - 全能正式食用方式。
      notes: 不說全能可以取代咖啡或提神；不拍熬夜後吃產品就精神變好的畫面；不給個人化的咖啡因或睡眠醫療建議。
    - title: 晚上才想起B群沒吃，會不會越吃越清醒？
      follow_up: 從實際食用疑問，釐清B群只有提神的印象，再說明使用方式
      approach: 用「收拾一天的東西，才想起忘記補充」的日常情境，帶出B群只有提神的印象，再說明B6的角色。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 晚間桌面近拍：闔上筆電，整理桌面，拿起產品
        talk: 引出「晚上才想到B群，怕吃了睡不著」的疑問
        visual: 主題字幕：「晚上吃B群，會更清醒？」
      - time: 5–15秒
        camera: 正面中景，使用柔和室內光；直接看鏡頭
        talk: 說明大家常把B群和提神放在一起，但B群包含不同營養素
        visual: 字幕：「B群不只有一種營養素」
      - time: 15–28秒
        camera: 側面45度鏡頭，接簡單B6知識圖
        talk: 介紹B6參與神經傳導物質合成，以及它為什麼會出現在睡眠相關討論中
        visual: B6知識圖，註明資料來源
      - time: 28–40秒
        camera: 回正面近景，清楚講完關鍵差別
        talk: 說明「參與相關機制」不等於「吃全能就能助眠」
        visual: 字幕：「營養角色與產品效果，要分開看」
      - time: 40–50秒
        camera: 食用方式特寫，手指指出正式標示
        talk: 使用安排依正式標示及個人情況；不自行增加份量
        visual: 最新食用方式照片
      - time: 50–60秒
        camera: 桌面俯拍：放下產品，收好筆電與手機；不拍入睡結果
        talk: 收在規律使用、安排休息與日常作息
        visual: 收尾字幕：「補充營養，也要好好安排休息」
      photos:
      - 晚間收桌、闔上筆電的生活照片。
      - B6成分欄位。
      - 正式食用方式。
      - 簡潔的B6知識圖。
      notes: 晚間光線用來呈現生活情境；不安排吃完立刻熟睡、隔天精神改善或深睡數據上升的畫面。
  - name: 成分天然＋吸收方向
    scripts:
    - title: 每天要吃的東西，妳會翻到背面看嗎？
      subtitle: 不只看天然，我還會看吸收資料。
      follow_up: 從日常選購習慣，帶到原料來源與標示
      approach: 從「買之前會不會翻背標」開始，讓老闆分享選料時的判斷：來源、含量、吸收研究都要看。吸收是這支的主要內容之一，不只展示藜麥、酵母和柑橘照片。
      duration: 60–75秒
      shots:
      - time: 0–5秒
        camera: 產品正面近拍，手把瓶身轉到背面；鏡頭跟著動作
        talk: 用「每天要吃的東西，買之前會看什麼？」引起注意
        visual: 主題字幕：「妳買保健品，會翻背面嗎？」
      - time: 5–15秒
        camera: 正面中景，拿著產品說明
        talk: 分享挑選標準：不只看正面寫天然，也看用什麼原料、每份含多少
        visual: 字幕依序出現：「來源／含量／研究資料」
      - time: 15–30秒
        camera: 桌面俯拍，產品旁排出四項原料卡
        talk: 介紹PANMOL®、LALMIN® B群、PureWay-C®及LALMIN®鋅
        visual: 原料名稱搭配來源示意照片
      - time: 30–43秒
        camera: 側面45度鏡頭，翻閱原料資料；接資料近拍
        talk: 強調吸收相關資料要看清楚：研究的是哪個原料、用多少、比較什麼
        visual: 自製圖卡：「原料／研究劑量／比較對象／測量指標」
      - time: 43–58秒
        camera: 研究資料摘要與成品標示交替特寫
        talk: 以核對後的原料研究作例子；分清楚研究結果與全能成品資訊
        visual: 標註「原料研究」；保留研究條件
      - time: 58–68秒
        camera: 回正面中景，產品與資料同框
        talk: 說明選料會考量吸收資料，但不能因為來源天然，就直接認定更好吸收
        visual: 字幕：「來源與吸收，都要有資料支持」
      - time: 68–75秒
        camera: 產品定鏡，四項原料卡放在後方
        talk: 整理產品選擇的三個重點
        visual: 收尾：「看來源、看含量、看研究」
      extra_sections:
      - heading: 吸收段落怎麼落實
        paragraphs:
        - PureWay-C®有人體研究評估吸收與血中維生素C濃度，但研究採單次1000mg維生素C，不是全能成品試驗。不能直接把結果改成「全能吸收率高」或套用倍數。Article abstract
        - 因此，這版先呈現**「選料時重視吸收研究」**。若要進一步寫「某原料在特定條件下吸收較快」，需核對全能實際使用的原料規格、完整研究及廣告表達。
      photos:
      - 藜麥穀粒、柑橘來源示意照片。
      - 供應商提供的酵母原料照片。
      - 四項原料名稱卡。
      - 自製的研究條件摘要圖。
      - 全能正式成分與含量標示。
      notes: 不用海綿吸水、膠囊完全溶解等實驗代替人體吸收證據；不沿用「吸收4倍、停留2倍」圖，也不把合成B群描繪成不能吸收。
    - title: 保健品買回家，妳知道裡面用什麼做的嗎？
      follow_up: 從「買了卻不了解」的情境，介紹藜麥、酵母、柑橘來源
      approach: 從「保健品買了很多，卻說不出裡面是什麼」的情境開始，帶觀眾認識全能的原料來源：藜麥、酵母、柑橘，並教大家在背標找到原料資訊。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 櫃子近拍：一排吃到一半的保健品，手拿起其中一瓶
        talk: 引出買了很多卻不知道裡面是什麼
        visual: 主題字幕：「保健品買回家，妳知道裡面用什麼做的嗎？」
      - time: 5–15秒
        camera: 正面中景，直接看鏡頭
        talk: 分享常見情況：只記得「好像對身體好」，沒看過原料
        visual: 字幕：「只知道好，不知道是什麼」
      - time: 15–35秒
        camera: 桌面俯拍：依序放上藜麥、酵母原料照片、柑橘，最後放上全能
        talk: 介紹全能的原料來源：藜麥來源B群（PANMOL®）、酵母來源B群與鋅（LALMIN®）、柑橘來源維生素C（PureWay-C®）
        visual: 原料名稱卡搭配來源示意照片
      - time: 35–47秒
        camera: 背標近拍，手指對照原料名稱
        talk: 教觀眾在背標上找原料資訊
        visual: 原料名稱卡＋背標對照框
      - time: 47–60秒
        camera: 回正面中景，產品與原料卡同框
        talk: 收在了解自己每天吃進去的東西
        visual: 收尾字幕：「每天吃的，至少知道是什麼做的」
      photos:
      - 藜麥穀粒、柑橘來源示意照片。
      - 供應商提供的酵母原料照片。
      - 四項原料名稱卡。
      - 全能正式成分標示。
      notes: 來源照片標註「示意」；不說天然來源一定比較好、比較安全；不貶低合成來源。
    - title: 看到「天然」就放心？我還會多看這幾件事
      follow_up: 從購買判斷，談來源、完整成分與每份含量
      approach: 從「看到天然兩個字就放心」的購買判斷開始，讓老闆分享天然是在意的點，但還會多看來源、完整成分與每份含量。
      duration: 45–60秒
      shots:
      - time: 0–5秒
        camera: 產品包裝近拍，手指點一下「天然」字樣
        talk: 引出看到天然就放心的直覺
        visual: 主題字幕：「看到『天然』就放心？」
      - time: 5–15秒
        camera: 正面中景，拿著產品說明
        talk: 老闆分享：天然是我在意的，但不是唯一標準
        visual: 字幕：「天然很好，但我不只看這個」
      - time: 15–25秒
        camera: 側面45度鏡頭，翻背標指出原料來源
        talk: 第一件事：看來源，原料從哪裡來
        visual: 圖卡①「來源」
      - time: 25–35秒
        camera: 背標近拍成分表
        talk: 第二件事：看完整成分，有哪些營養素
        visual: 圖卡②「完整成分」
      - time: 35–47秒
        camera: 背標近拍每份含量欄位
        talk: 第三件事：看每份含量與一天的食用份量
        visual: 圖卡③「每份含量」
      - time: 47–60秒
        camera: 回正面中景，產品與三張圖卡同框
        talk: 收尾整理三件事
        visual: 收尾字幕：「看來源、看成分、看含量」
      photos:
      - 全能包裝正面。
      - 全能正式成分與含量標示。
      - 三張重點圖卡（來源／完整成分／每份含量）。
      notes: 不說「天然＝沒有副作用」「天然＝吸收更好」；如果提到吸收，依「每天要吃的東西，妳會翻到背面看嗎？」那支的吸收段落限制呈現。
  - name: 孕婦可以吃方向
    scripts:
    - title: 懷孕後，連原本每天吃的保健品都不敢隨便吃？
      follow_up: 從孕期選購的謹慎，說明怎麼確認產品適用資訊
      approach: 承接懷孕後變得謹慎的生活心情，回答「原本吃的產品還適不適合、已經吃孕婦維他命會不會重複」的問題。
      duration: 50–65秒
      shots:
      - time: 0–5秒
        camera: 桌面俯拍，幾款補充品放在一起；拿起其中一瓶查看標示
        talk: 引出孕期對原有補充品產生疑問的情境
        visual: 主題字幕：「懷孕後，原本的保健品還能照吃嗎？」
      - time: 5–15秒
        camera: 正面中景，直接看鏡頭
        talk: 說明孕期選產品，需要重新確認完整資訊
        visual: 字幕：「先確認，別照原本習慣直接加」
      - time: 15–28秒
        camera: 全能背標特寫，指出完整成分與份量
        talk: 展示產品資訊；正式適用說明核對後再填入口播
        visual: 最新完整成分、食用方式照片
      - time: 28–43秒
        camera: 全能與孕期綜合維他命標示並排；手指找相同成分
        talk: 示範如何找重複的B群、C、鋅，整理每日份量
        visual: 同名成分使用同色框線
      - time: 43–55秒
        camera: 側面鏡頭，將標示與補充紀錄表整理在一起
        talk: 說明帶完整資料給產檢醫師或營養師評估
        visual: "**「成分＋份量＋現有補充品」**圖卡"
      - time: 55–65秒
        camera: 回正面中景，資料與產品留在桌上
        talk: 收在確認個人適用性後，依正式方式使用
        visual: 收尾字幕：「孕期補充，先把資訊確認完整」
      photos:
      - 全能最新正式背標。
      - 孕期綜合維他命標示。
      - 每日補充紀錄表。
      - 經品牌確認的孕期適用說明。
      notes: 不使用「完全放心」「孕婦最安心」等絕對保證；沒有個別評估資料前，不直接示範孕婦服用固定顆數。
    - title: 已經吃孕婦維他命，其他保健品還能照原本吃嗎？
      follow_up: 從原有生活習慣，帶到重複成分與每日份量
      approach: 從「懷孕後加了孕婦維他命，原本的保健品也照吃」的生活習慣開始，示範怎麼對照重複成分、加總每日份量，再帶給醫師或營養師評估。
      duration: 50–65秒
      shots:
      - time: 0–5秒
        camera: 桌面俯拍：孕婦維他命和全能放在一起，手在兩瓶之間猶豫
        talk: 引出兩種要不要一起吃的疑問
        visual: 主題字幕：「吃了孕婦維他命，其他還能照吃嗎？」
      - time: 5–15秒
        camera: 正面中景，直接看鏡頭
        talk: 分享懷孕後很多人會在原本習慣上，直接再加孕婦維他命
        visual: 字幕：「新的加上去，舊的還照吃？」
      - time: 15–32秒
        camera: 兩個標示並排特寫，手指找相同成分
        talk: 示範對照：B群、C、鋅、鎂哪些重複
        visual: 同名成分使用同色框線
      - time: 32–45秒
        camera: 側面鏡頭，在補充紀錄表上加總每日份量
        talk: 把每天從不同產品吃到的份量加起來
        visual: 每日補充紀錄表
      - time: 45–57秒
        camera: 回正面近景
        talk: 帶著標示與紀錄表，給產檢醫師或營養師評估再決定
        visual: 字幕：「帶著標示去問，最清楚」
      - time: 57–65秒
        camera: 資料與產品留在桌上，定鏡
        talk: 收在先對照、再決定
        visual: 收尾字幕：「孕期補充，先對照再決定」
      photos:
      - 全能最新正式背標。
      - 孕期綜合維他命標示（遮住品牌）。
      - 每日補充紀錄表。
      - 經品牌確認的孕期適用說明。
      notes: 不說「可以一起吃」「不用停」；不使用「完全放心」等絕對保證；沒有個別評估資料前，不示範孕婦服用固定顆數。
    - title: 懷孕後買保健品，我會先確認這三件事
      follow_up: 用完整成分、食用份量、現有補充品，整理確認方式
      approach: 用「我會先確認這三件事」的清單形式，整理孕期選購保健品前的確認方式：完整成分、食用份量、現有補充品。
      duration: 50–65秒
      shots:
      - time: 0–5秒
        camera: 手寫清單近拍：「孕期買保健品前」
        talk: 引出接下來要講的三件事
        visual: 主題字幕：「懷孕後買保健品，我會先確認這三件事」
      - time: 5–15秒
        camera: 正面中景，直接看鏡頭
        talk: 分享懷孕後選購變得謹慎是很正常的
        visual: 字幕：「變謹慎，是好事」
      - time: 15–27秒
        camera: 全能背標特寫，指出完整成分
        talk: 第一件：看完整成分
        visual: 圖卡①「完整成分」
      - time: 27–39秒
        camera: 食用方式特寫，手指指出正式標示
        talk: 第二件：看食用份量
        visual: 圖卡②「食用份量」
      - time: 39–51秒
        camera: 桌面俯拍：把現在已經在吃的補充品排在一起
        talk: 第三件：列出現在已經在吃的補充品
        visual: 圖卡③「現有補充品」
      - time: 51–65秒
        camera: 回正面中景，清單與產品同框
        talk: 三件事整理好，帶去給產檢醫師或營養師確認
        visual: 收尾字幕：「成分、份量、現有補充品，確認完再吃」
      photos:
      - 手寫確認清單。
      - 全能最新正式背標與食用方式。
      - 現有補充品排列照片（遮住品牌）。
      - 經品牌確認的孕期適用說明。
      notes: 不使用「完全放心」「孕婦最安心」等絕對保證；沒有個別評估資料前，不直接示範孕婦服用固定顆數。
  knowledge_topics:
  - title: 為什麼需要B群
    questions:
    - B群到底不是只有「提神」？
    - B群其實不是一種維生素
    - B1～B12到底差在哪？
    - 為什麼現代人的營養補充品很常看到B群？
  - title: 為什麼需要鋅
    questions:
    - 鋅到底是什麼？
    - 人體為什麼需要「礦物質」？
    - 哪些天然食物含鋅？
    - 女生也需要注意鋅嗎？
  - title: 為什麼需要鎂
    questions:
    - 最近很紅的鎂到底是什麼？
    - 鎂其實是人體需要的礦物質
    - 哪些食物天然含鎂？
    - 為什麼堅果、深綠色蔬菜常被提到？
  - title: 怎麼挑B群
    questions:
    - B群不是數字越高越好？
    - 買B群我第一個看什麼？
    - 天然來源、合成來源差在哪？
    - 看懂營養標示比看「超高單位」重要
  - title: 配方來源
    questions:
    - 為什麼你們選藜麥來源B群？
    - 酵母來源B群是什麼？
    - 不同原料來源差在哪？
