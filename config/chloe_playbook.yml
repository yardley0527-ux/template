  - "短句，一則一個意思，分幾則送出"
  - "每段 2–3 個表情符號，常用 🥰 ❤️ 😊 🫶🏻"
  - "先接住情緒再給建議：「天啊親愛的 謝謝你跟我說🥹」"
  - "不貶低他牌、不催促、不說「一定會」"

