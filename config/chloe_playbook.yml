      - text: "有你的稱讚今天很開心"
      - text: "保養不是為了變誰喜歡的樣子\n而是讓一個女人在日常裡\n重新找到力量、找到被自己疼愛的感覺"
    notes:
      - "這類對話新客 14 天內只有 4.6% 下單，它的作用是維持關係，不是成交。"

  - title: "吃了不舒服"
    pill: { kind: human, text: "轉 Chloe／主管" }
    do_label: "客服可以做的"
    do:
      - "先問吃了哪些、怎麼吃、水喝多少"
      - "建議先暫停，身體好了再開始"
      - "症狀持續或嚴重，請客人就醫"
      - "不判斷原因、不自己調劑量，交給 Chloe"
    quotes:
      - text: "親愛的你今天吃了哪些 你的吃法是什麼呢"
      - text: "身體好了，以後再開始吃"

  - title: "疾病、用藥、懷孕哺乳、兒童"
    pill: { kind: human, text: "轉 Chloe／主管" }
    do_label: "客服可以做的"
    do:
      - "不說「可以吃」「放心吃」"
      - "例外：全能懷孕可以吃，照標準劑量（已確認）；其他產品遇到懷孕哺乳仍轉 Chloe"
      - "請客人先問自己的醫師，再轉 Chloe"
      - "下方禁區清單裡，大部分問題都出在這類情境"
    quotes_label: "Chloe 做得好的原文"
    quotes:
      - text: "或者妳下次產檢可以問一下醫師確認停用的時間"
      - text: "媽媽下次回診時，也可以告知醫師，目前有在補充我們家的產品，讓醫生可以全面掌握身體狀況哦😊"
      - text: "醫生有建議你要補充到幾IU嗎？"
      - text: "一定要經醫師評估 才能安全使用"

