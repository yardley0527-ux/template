sources:
  - "資料：Chloe IG 私訊 2024-01 起、能對到訂單的 6,764 段對話（1,126 位客人），訂單為正式站已付款訂單；原文來自已整理的 2,832 筆溝通做法。"
  - "下單後關懷：2024-01 至 2026-07 有私訊紀錄客人的訂單，看下單後 7 天內 Chloe 的訊息與 120 天內是否再下單。"
  - "限制：數字是「有這樣做的對話比較常成交」，不能證明是因為這樣做才成交；做法是用關鍵字判斷的，會有誤判；樣本少的項目只看方向。"

