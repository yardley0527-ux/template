# Chloe 私訊話術卡（/chloe_playbook）。內容整理自 Chloe 2024–2026 年 IG 私訊與正式站訂單（2026-11-16 分析）。
# 每句 quotes 都是 Chloe 原文；價格與活動是當時的例子，回覆客人時以當期為準。
# pill 種類：data＝有數據支持、human＝轉 Chloe／主管、time＝內容有時效。

stats:
  - value: "28% vs 14%"
    label: "私訊後 14 天內下單 vs 同一批客人平常"
  - value: "40% vs 24%"
    label: "私訊後的單是大組數 vs 沒私訊客人"
  - value: "33% vs 15%"
    label: "新客首單是大組數：私訊過 vs 沒私訊"
  - value: "黑卡沒差"
    label: "黑卡本來就買大組數，不用推"

steps:
  - title: "先問狀況或目的"
    data: "新客下單機率 +8.2 個百分點"
    quote: "可以跟我說說看你目前你的狀況或者需求"
  - title: "講足量吃法、要吃多久"
    data: "新客下單機率 +8.7 個百分點"
    quote: "基本保養一天兩粒可以拉到一天三粒或者是一天六粒 看個人對於體重管理的需求"
  - title: "列出組數價格與滿額贈"
    data: "大組數機率 +8.5 個百分點"
    quote: "如果寶貝平常固定都有在飲用 其實可以考慮 10 盒組數 平均下來會是最划算的"
  - title: "加一句「前提是會持續吃」"
    data: "她推大組數時的固定煞車"
    quote: "前提是寶貝有真的會持續吃喔，才可以讓你囤貨"

step_counts:
  note: "客人講了 7 句以上的對話"
  rows:
    - ["0 步", "532", "36.8%", "15.6%"]
    - ["1 步", "518", "40.2%", "19.7%"]
    - ["2 步", "305", "40.0%", "22.0%"]
    - ["3 步", "89", "48.3%", "29.2%"]
    - ["4 步", "14", "57.1%", "35.7%"]
  summary: "四步全做的對話很少：6,764 段裡只有 25 段，連 Chloe 自己也不常做完。客服照流程做，是最直接能補上的地方。"
  caveat: "客人只講一兩句的對話，做幾步差別不大；要等客人願意多聊，四步才有用。只看一般會員與白卡舊客，0 步下單 30.4%、3 步 47.1%。"

scenarios:
  baseline: "全部對話平均：14 天內下單 27.9%、大組數 12.3%。一段對話可以同時屬於好幾類。"
  rows:
    - ["嫌貴、預算有限", "2.3%", "45.8%", "24.5%", "$13,622", "37.5%", "16.7%"]
    - ["問價格、組數", "5.2%", "43.8%", "24.7%", "$14,664", "28.6%", "9.5%"]
    - ["活動、贈品", "13.9%", "43.6%", "21.6%", "$12,728", "28.8%", "9.6%"]
    - ["吃了不舒服", "4.7%", "37.8%", "16.8%", "$11,109", "26.2%", "7.7%"]
    - ["問吃法、吃多久", "13.0%", "33.9%", "17.1%", "$13,429", "26.9%", "9.6%"]
    - ["回報成效", "9.9%", "33.9%", "15.2%", "$12,672", "29.4%", "6.7%"]
    - ["比較他牌、重複補充", "13.3%", "33.9%", "14.7%", "$11,868", "24.3%", "6.2%"]
    - ["客訴、出貨", "3.6%", "33.9%", "13.5%", "$10,418", "30.0%", "5.0%"]
    - ["疾病、用藥、孕哺", "7.3%", "31.2%", "11.6%", "$11,382", "28.0%", "8.0%"]
  # 下面是原本沒分到上述情境的 57.8% 對話，再細分的結果（每段只算一類）
  other_rows:
    - ["感謝、祝福、聊心情", "17.3%", "18.3%", "7.9%", "$12,368", "4.6%", "0.9%"]
    - ["其他產品問題（換個說法問產品）", "7.5%", "28.1%", "11.6%", "$10,769", "21.2%", "7.1%"]
    - ["出貨、收件、付款", "7.1%", "27.9%", "12.7%", "$11,415", "11.7%", "3.9%"]
    - ["留言 +1、IG 按鈕、轉發活動", "5.5%", "23.5%", "9.7%", "$12,622", "22.2%", "9.5%"]
    - ["想買、問怎麼買、何時開賣", "4.9%", "32.2%", "14.3%", "$12,417", "17.3%", "9.9%"]
    - ["飲食、作息、身體狀況（沒提產品）", "4.3%", "24.8%", "8.5%", "$10,399", "16.0%", "2.0%"]
    - ["只回「好的」、貼圖、圖片", "4.0%", "18.6%", "8.9%", "$13,514", "11.5%", "7.7%"]
    - ["醫美、保養品、其他話題", "2.2%", "27.2%", "11.3%", "$11,374", "9.1%", "9.1%"]
    - ["會員制度、購物金、贈品", "0.6%", "34.1%", "22.0%", "$12,562", "33.3%", "33.3%"]
    - ["回填基本資料、問卷", "0.5%", "24.3%", "5.4%", "$8,514", "25.0%", "12.5%"]
    - ["其他零散問題", "3.9%", "23.4%", "6.9%", "$9,326", "4.3%", "2.1%"]
  takeaway: "嫌貴的客人其實最想買：下單率最高，新客也是。這類對話要好好接，不能當成沒希望。"
  other_takeaway: "最多的是感謝和祝福（17%），新客幾乎不會因此下單，照顧感情就好，不要推產品。新客最多從留言 +1 和 IG 按鈕進來，這群新客有 22% 會下單，第一句回覆很重要。"

cards:
  - title: "新客第一次來問"
    pill: { kind: data, text: "新客下單 +8.2pp" }
    do_label: "怎麼做"
    do:
      - "先問想改善什麼、目前手邊有哪些產品，再推薦"
      - "不要一開始就丟價格或連結"
      - "客人問題很大時，請客人填基本資料再給建議"
    quotes:
      - text: "可以跟我說說看你目前你的狀況或者需求"
      - text: "你的目的是要體重管理還是要基礎保養呢？"
      - text: "寶貝 你想要改善或是比較在意的部分是什麼呢？"
      - text: "可以跟我說說看你的需求 以及目前手邊有哪些產品 可以幫你一起建議哦～"

  - title: "問怎麼吃、要吃多久"
    pill: { kind: data, text: "新客下單 +8.7pp" }
    do_label: "怎麼做"
    do:
      - "依目的給顆數：基本保養與加強的量不同"
      - "講清楚飯前飯後、空腹、分幾次"
      - "依客人作息調整，例如一天只吃兩餐"
    quotes:
      - text: "寶貝沒錯你好聰明\n如果兩餐的話就三顆"
      - text: "親愛的 可以 但是空腹吃膠原蛋白吸收效果最好❤️"
      - text: "美白錠的吃法其實可以依照妳的生活習慣去調整"
      - text: "吃飯吃到一半吞個兩三顆 吃幾口飯再繼續吞兩三顆"
        context: "客人怕吞太多顆時"
    notes:
      - "足量吃法和大組數有關：Chloe 說「一天 5 顆以上」的對話（145 段），14 天內下單 40.7%、大組數 27.6%；沒提顆數的是 27.6%、11.9%。這可能跟產品有關（例如代謝錠本來就吃得多），只看方向。"
      - "注意：顆數以官方建議吃法為準。客人提到用藥、疾病、懷孕哺乳，改走紅色情境。"

  - title: "問價格、要買幾組"
    pill: { kind: data, text: "大組數 +8.5pp" }
    do_label: "怎麼做"
    do:
      - "一次列出 1／3／6／10 瓶的價格，標出現省多少"
      - "平常固定吃的客人，建議大組數「平均最划算」"
      - "一定加上「前提是會持續吃」"
      - "客人買大組數後，再問一次這次的目標"
    quotes:
      - text: "🌟1瓶 $1690(原價$1880)現省190\n🌟3瓶組 $5050 (原價$5640)現省590\n🌟6瓶組 $10050(原價$11280)現省$1230"
        context: "薑黃升級版上市前報價，價格以當期為準"
      - text: "前提是寶貝有真的會持續吃喔，才可以讓你囤貨"
      - text: "想先了解妳這次的目標是什麼呢"
        context: "客人買了大組數之後"
    notes:
      - "有下單的客人裡：主動建議組數，大組數機率再多 13 個百分點；說「平均最划算」多 11 個百分點。"

  - title: "活動與滿額贈"
    pill: { kind: time, text: "內容有時效" }
    do_label: "怎麼做"
    do:
      - "主動告訴客人「差多少就有什麼贈品」"
      - "講清楚活動規則：哪些商品算、購物金算不算"
      - "新客不要用「快賣完、最後一天」催，數據反而略差"
    quotes:
      - text: "寶貝，但因為這個月有活動滿$10,000就有1980清纖粉"
        context: "當時的活動"
      - text: "這次「滿 $20,000 再多送 1 瓶」的活動，指的是單獨 PDRN 商品的消費金額要滿 $20,000，不是整張訂單的總金額喔。"
      - text: "購物金不能夠算在內"
    notes:
      - "有下單的客人裡：提到滿額贈，大組數機率多 23 個百分點（樣本 23 段，只看方向）。"

  - title: "嫌貴、預算有限"
    pill: { kind: data, text: "下單率最高 45.8%" }
    do_label: "怎麼做"
    do:
      - "先說「不用有壓力」，再給少量的開始方式"
      - "少量也說實話：效果會有，只是慢一點"
      - "黑卡、舊客不要再催量"
    quotes:
      - text: "寶貝 真的不用有壓力，照你現在的需要再買就好"
      - text: "用你自己最舒服的方式去消費"
      - text: "效果還是會有的喔，只是速度會比較「溫和一點」"
      - text: "可以先從少少瓶的開始感受，我覺得這個方式很棒"
    notes:
      - "這類回答常出現在後來買大組數的客人對話裡。她會推組數，也會踩煞車，兩件事要一起做。"

  - title: "嫌顆數多、吞不下"
    do_label: "怎麼做"
    do:
      - "說明為什麼要這個量：一顆膠囊裝得下的量有上限"
      - "給吞的方法：分口吞、可以泡水的產品泡水喝"
      - "不鼓勵自己減量，請客人照吃法吃完一瓶再感受"
    quotes:
      - text: "同樣的一個膠囊或一個錠 他們也有最高的上限"
      - text: "你也可以把代謝錠放在水裡面融化像檸檬水一樣喝"
      - text: "我寧可你按照上面的吃法，你吃完一瓶感受一下"
      - text: "愛漂亮在自己的能力範圍內，我們去用最舒服的方式去消費"
    notes:
      - "客人有腸胃病史怕吞太多時，Chloe 曾讓客人先減量一週。這類屬於身體狀況，轉 Chloe。"

  - title: "想買、何時開賣、錯過活動、缺貨"
    pill: { kind: time, text: "開賣場要主管同意" }
    do_label: "怎麼做"
    do:
      - "這類客人 32% 會在 14 天內下單，要盡快回"
      - "先站在客人這邊，不說「下次請早」"
      - "有確定的開賣日期就直接講；沒有就說到貨會優先通知"
      - "請客人登記補貨通知（官方 LINE 打產品名稱）"
      - "有人取消或分期沒過釋出名額時，主動通知"
      - "要開隱藏賣場或保留價格，先問主管"
    quotes:
      - text: "讓你們有空窗了🥹\n姊姊這一次準備更多\n等薑黃一到貨會馬上優先通知寶貝讓妳先補貨"
        context: "2025-10-29，客人等不到薑黃"
      - text: "真的很抱歉～這次膠原蛋白賣得比姐姐預期還要快，目前這一批已經全部售完了"
        context: "2026-09-03"
      - text: "你幫我在官方LINE打全能膠囊 小編幫你貼標籤"
      - text: "如果有人無卡分期沒有通過 放出來 姐姐立刻通知你"
      - text: "寶貝 姐姐比你更焦慮"

  - title: "下單後關懷"
    pill: { kind: data, text: "親自回覆 回購 +4.7pp" }
    do_label: "怎麼做"
    do:
      - "下單後 7 天內，針對這張單講怎麼吃、水喝多少"
      - "請客人收到、吃一陣子後回報感覺"
      - "要是個人化的回覆；群發範本跟回購沒有關係"
    quotes:
      - text: "期待你收到 等你跟我回饋你吃的感覺喔🥰"
      - text: "可以先看看你吃薑黃＋代謝錠後的反應"
    notes:
      - "數據：下單後 7 天內有 Chloe 親自講吃法的訂單，120 天內回購比沒有的多 4.7 個百分點（1,083 單，已按首單與否、卡別、組數大小、年份比較）；只收到群發衛教範本的只多 0.4。有親自回覆的通常是客人自己先傳訊息，客人本身比較投入也有影響。"

  - title: "比較他牌、怕重複補充"
    do_label: "怎麼做"
    do:
      - "不貶低他牌，教客人看專利、劑量、原料"
      - "成分重疊時，請客人先吃完手邊的"
      - "產品沒有客人要的成分，就直說沒有"
    quotes:
      - text: "但這是參考 不代表他們不好唷"
      - text: "不能再重複補充喔，不然劑量會太高喔"
      - text: "你是要吃皮膚的還是吃瘦身"
      - text: "目標是要鎖定足夠劑量鎂的保健食品 那這一款 全能膠囊並沒有添加"

  - title: "回購、回報成效"
    do_label: "怎麼做"
    do:
      - "追問具體哪裡變了"
      - "體重體脂波動時，請客人看身體輪廓、不要天天量"
      - "肯定客人的努力，不把成果全歸功產品"
    quotes:
      - text: "真的嗎 是覺得皮膚變好還是有消水腫嗎😍"
      - text: "因為我希望你觀察身體輪廓 而不是被數字追著跑"
      - text: "慢慢來寶貝👌 養成健康的生活習慣才是最重要的"

  - title: "客訴、瑕疵、沒收到"
    do_label: "怎麼做"
    do:
      - "先謝謝客人告訴我們，認同客人有權利反映"
      - "瑕疵直接補寄，不先質疑"
      - "訂單細節轉官方 LINE 查"
    quotes:
      - text: "天啊親愛的 謝謝你跟我說🥹 沒關係我請物流寄一罐新的給你💖💖"
      - text: "你的反應也是對的，無論你跟我認不認識"
      - text: "因為他們比較了解訂單的情況，可以比較快精準幫你處理問題"

  - title: "留言 +1、IG 按鈕進來的新客"
    pill: { kind: data, text: "新客下單 22.2%" }
    do_label: "怎麼做"
    do:
      - "新客最常從這裡進來；第一句先問對哪個產品有興趣"
      - "再請客人說自己的狀況，接回新客四步"
      - "客人說留言了卻沒收到訊息，先道歉說明系統可能漏掉"
      - "客人說按錯按鈕，引導回官網下單就好"
    quotes:
      - text: "親愛的～你是對哪一個產品有興趣呢？"
      - text: "方便的話 可以跟我分享一下你的狀況 給你更精準的建議哦🫶🏻😊"
      - text: "寶貝 讓你久等了\n有時候訊息量太大 系統會吃掉訊息🥺"

  - title: "出貨、收件、付款"
    do_label: "怎麼做"
    do:
      - "客人說收到了：請客人吃一陣子後回報感覺"
      - "訂單要備註的事，請客人下單後到 LINE 官方找小編"
      - "因為付款分兩張單、加起來才到滿額的，請客人把兩張訂單截圖給主管處理"
      - "出貨時間、物流問題轉官方 LINE 查"
    quotes:
      - text: "期待寶貝的回饋🥰"
      - text: "如果今晚有下單 記得下單後到 LINE 官方找小編，小編幫你訂單備註唷🥰🥰"
      - text: "但是妹妹如果是因為付款的關係，你要分開兩單\n那變成你下單以後你把你兩張訂單的截圖編號給姐姐"

  - title: "會員制度、購物金、贈品"
    pill: { kind: time, text: "制度以官網為準" }
    do_label: "怎麼做"
    do:
      - "2026 年起是新會員制度，差多少續會、升等，請客人登入官網會員後台看"
      - "非首購領不到首購券，照實說就好"
      - "贈品替換、補送、例外，一律先問主管"
    quotes:
      - text: "今年2026年是新的會員制度"
      - text: "寶貝你登錄會員後台資料都看得到喔"
    notes:
      - "這類對話不多（41 段），但 34% 會在 14 天內下單，大組數 22%，多半是快要續會或升等的客人。"

  - title: "飲食、作息、身體狀況（沒提產品）"
    pill: { kind: human, text: "提到疾病轉 Chloe" }
    do_label: "怎麼做"
    do:
      - "先問清楚飲食、作息、喝水量，不急著推產品"
      - "可以給一般生活建議，例如喝水、蛋白質、不要天天量體重"
      - "產品不能取代彼此，也不能取代看醫生"
      - "提到疾病、手術、用藥，一律轉 Chloe"
    quotes:
      - text: "了解😊 你先喝喝看\n有任何問題隨時跟我說❤️"
      - text: "如果妳是長期、嚴重的便秘型\n比較不建議依賴清腸型的產品\n這類產品多半是刺激排便"
      - text: "寶貝我的產品不會讓誰可以取代誰？"
      - text: "姐姐需要你完整資料 可以和健康管理師判斷妳目前是代謝卡住、睡眠不足，還是作息影響到身體狀態。"

  - title: "醫美、保養品、其他話題"
    do_label: "怎麼做"
    do:
      - "不熟的醫美、別人的產品，直說不熟，不亂推薦"
      - "分享醫師、店家時說明不是業配"
      - "勸客人不要衝動做醫美"
      - "剛做完醫美能不能吃保健品，轉 Chloe"
    quotes:
      - text: "不過姐姐沒有在幫忙業配或合作喔，只是單純分享給妳參考。"
      - text: "我就不太敢隨便推薦某一間診所給你"
      - text: "先不要衝動"

  - title: "感謝、祝福、聊心情"
    pill: { kind: data, text: "佔 17%，最多" }
    do_label: "怎麼做"
    do:
      - "真心回應客人的心意，不順勢推產品"
      - "客人生日用固定的祝福文"
      - "客人分享生活就陪著聊，記住客人說過的事"
    quotes:
      - text: "寶貝這樣說姐姐真的會感動耶 🥹🤍\n也要謝謝你們平時一直支持、陪著姐姐，這份心意我都有放在心上"
      - text: "你很棒，今天是你生命中的好日子\n你所需要知道的一切，都會呈現在你眼前"
