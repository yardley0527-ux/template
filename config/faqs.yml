categories:
  - name: "代謝錠"
    faqs:
      - question: "$ 價錢"
        answer: "親愛的❤️ 我的代謝錠\n一瓶 500 顆\n一瓶可以吃一個月\n七月活動價是$3080😊\n\n我們現在也有信用卡以及無卡 3期/6期利率全部我們吸收 🔥\n\n圖卡給親愛的參考❤️ 有其他問題隨時請教我😊\n\nhttps://www.dropbox.com/scl/fi/p12ko7gq97juvkf4sz6k6/2-100.jpg?rlkey=t9ifl65tzlkkxyj0a976ydb9d&st=cpto0rz2&dl=0"
      - question: "一天至少要吃到足量15顆嗎？"
        answer: "親愛的❤️ 代謝錠一天至少要吃足15粒唷～\n\n三餐飯後 一次5~7顆\n如果你想要加強或者是有哪一餐吃的特別油膩、高熱量，那一餐可以吃到7~10顆❤️\n\n那如果你一天只吃兩餐的話\n剩下的5~7顆代謝錠可以空腹做食用😘\n\n記得幫我搭配2500~3000cc的水🔥\n\n謝謝親愛的支持 ❤️ \n等你跟我回饋你吃的感覺喔🥰"
      - question: "一定要吃那麼多顆嗎？"
        answer: "親愛的❤️  如果你吃過益生菌或膠原蛋白，應該會發現每包成分大約是4、5克，有些甚至6克。\n\n而我的代謝錠，那為什麼一天建議最少要吃15顆呢？\n如果你把這15顆敲成粉末，總量其實比一包膠原蛋白或益生菌還少，連5克的粉末都不到！但因為粉末狀態比較酸，擔心不好入口，所以才製成錠劑，讓大家服用更方便😊\n\n這個劑量是符合每日三大酸及蔬果營養的需求量哦✨"
      - question: "一天一定要三次嗎"
        answer: "（先詢問需求）\n\n如果針對粉刺的話，一天要吃三次\n\n如果你要消水腫的話，你可以集中在兩次\n\n飯後吃\n\n親愛的❤️ 代謝錠的成分來自天然蔬果萃取，屬於水溶性營養素，在身體內的停留時間約2~4小時✨ \n為了讓吸收效果更穩定，建議一天分三次補充，搭配2500~3000cc的水，幫助身體維持良好的代謝循環哦～\n\n那為什麼一天建議最少要吃15顆呢？\n如果你把這15顆敲成粉末，總量其實比一包膠原蛋白或益生菌還少，連5克的粉末都不到！但因為粉末狀態比較酸，擔心不好入口，所以才製成錠劑，讓大家服用更方便😊\n\n這個劑量是符合每日三大酸及蔬果營養的需求量哦✨"
      - question: "懷孕期間能服用嗎\n孕婦"
        answer: "親愛的❤️ 懷孕期間可以吃代謝錠！如果身體比較浮腫，可以透過代謝錠幫助代謝水分、減少水腫\n至於薑黃，建議等到坐月子期間再開始服用，因為在坐月子期間，燃燒脂肪的效果會更好哦😊"
      - question: "請問孕婦可以使用嗎"
        answer: "親愛的❤️  代謝錠主要是蔬果的三大有機酸，是非常溫和的產品唷❤️ 包括孕媽咪、產後媽咪、小孩都可以放心食用\n\n懷孕期間如果身體比較浮腫，可以利用代謝錠去促進循環、代謝會比較順，對於體內濕氣重、水腫、腸道代謝差這些也有幫助😊\n\n另外懷孕期間，我會建議補充我們的膠原蛋白和全能\n\n待會我會傳一份我們公司雜誌上關於全能膠囊的資訊給你參考\n\n在孕期期間，全能膠囊中的維生素成分非常適合懷孕的媽媽們，像是葉酸、生物素和B12等營養，對寶寶的健康發展有很大幫助💖\n\n再來，也可以補充膠原蛋白，不僅能提供美容保濕效果，還能幫助減少妊娠紋的生成\n利用膠原蛋白去維持肚皮的彈性，減少因皮膚擴張帶來的不適\n\n除此之外，很多媽媽會擔心產後胸部失去彈性\n我們的日本專利彈力蛋白，可以幫助上胸有彈性喔😊\n\nhttps://www.yardley.tw/pages/mama-baby-magazine-interview\n\n親愛的您好～\n我們的代謝錠是以天然蔬果來源，主成分是三大有機酸（檸檬酸、蘋果酸、琥珀酸），屬於非常溫和、日常可以安心補充的營養配方。\n孕期、產後、甚至小朋友都可以食用唷🥰\n\n懷孕期間，很多媽咪會出現水腫、腸胃蠕動變慢、容易覺得身體濕濕重重的感覺，這時候補充代謝錠，可以幫助促進循環、代謝水分、讓排便也更順暢，讓整個人輕盈起來，也比較舒服。\n\n建議每天搭配足量的水，效果會更明顯唷～\n有任何搭配保健的問題也都可以隨時問我們"
      - question: "請問代謝錠是減肥的嗎？\n功效？\n瘦身"
        answer: "親愛的❤️ \n代謝錠是天然萃取的三大酸（檸檬酸、琥珀酸、蘋果酸）啟動我們的TCA cycle\n讓你把身體不需要的廢物藉由尿液跟氣體排放出去\n長期吃下來 你會發現你的排便變順暢\n因為身體的廢物都很順利的排出體外\n\n你會發現不會那麼水腫了，皮膚變好了\n另外，代謝錠其實是鹼性的，所以對胃酸過多，胃食道逆流的症狀也都會有幫助喔😊\n\n親愛的❤️  我先跟你分享關於代謝錠\n我的客人這邊給我最直觀的回饋\n1. 水腫消了\n2.粉刺變少了\n3.排便順暢了\n4..尿液變多了，放屁也變多\n因為代謝錠會幫你把身體不要的廢物\n藉由尿液跟氣體排出體外\n那你一開始吃你也會發現常常口渴\n多喝水也是對身體好喔\n\n哈囉親愛的❤️ 謝謝你對我的產品有興趣😊\n代謝錠主成分是三大代謝酸（檸檬酸、蘋果酸、琥珀酸）\n它的作用是提升細胞能量運作、幫助燃脂、促進水分和乳酸排出\n所以它的主要效果包括妳說的兩個效果它都有幫助\n\n1. 瘦身：加速基礎代謝 對於代謝慢、水腫型身材特別有幫助\n2. 改善粉刺水腫：從體內環境做清理 代謝順了 皮膚自然比較穩定不爆痘"
      - question: "吃法"
        answer: "親愛的❤️ 代謝錠我先跟你說吃法\n\n如果你的飲食習慣是一日三餐\n那你幫我三餐飯後，一次吃五顆～￼\n￼如果你想要加強或者是有哪一餐吃的特別油膩、高熱量，那一餐可以吃到7顆\n￼￼\n￼如果你不是一日三餐的話，你再跟我說說你的飲食習慣是什麼？我在根據你的習慣跟你說怎麼吃😊\n\n也可以跟我說說看你的需求\n我來幫你評估喔😊"
      - question: "跟以前吃過的不一樣有異味容易碎掉"
        answer: "親愛的❤️ 比利時代謝錠嚴選天然蔬果萃取～✨\n蔬果有機萃取三大酸，我們無添加賦形劑，吃進我們的食道很快就會融化讓效果發揮得更快💗\n姐姐後來在家庭號升級版讓整個效能大幅提升⬆️⬆️\n吸收的速度更快了！！😊"
      - question: "消水腫"
        answer: "🔹 睡前攝取太多鹽分或水分 影響體內鈉鉀平衡 讓水分滯留\n🔹 循環較差或淋巴代謝不佳 尤其是長時間坐著或睡姿影響\n🔹 營養不均衡 蛋白質攝取不足\n\n1️⃣ 營養不均衡 蛋白質攝取不足\n\n2️⃣ 身體缺水 反而會讓身體儲存水分 造成水腫\n\n3️⃣ 循環不好：久坐久站、運動量少，血液和淋巴循環變差，水分滯留在下半身\n\n4️⃣荷爾蒙變化：月經前、壓力大、睡眠不足，會影響體內水分調節，讓身體更容易腫脹"
      - question: "酒糟肌"
        answer: "親愛的❤️ \n酒糟肌除了外用保養、日常防曬，從體內調理也是很重要的一環喔💕\n\n我的代謝錠主要是蔬果的三大有機酸，不是刺激性或熱性的配方，對酒糟膚質來說相對溫和唷❤️\n\n幫助促進循環、代謝比較順，對於體內濕氣重、水腫、腸道代謝差這些也有幫助😊"
      - question: "有減脂功效嗎？"
        answer: "親愛的❤️ \n代謝錠會幫助提升代謝率幫助身體更有效率地將食物轉化為能量 而不是儲存成脂肪 特別是針對下半身或是容易水腫的部位效果很明顯唷😊"
      - question: "味道酸 可否泡水喝"
        answer: "親愛的❤️ \n我們升級配方後代謝錠會溶的比較快 你可以丟到水裡讓他融化後喝 或是一次吃一顆兩顆 分次吃比較不酸😊"
      - question: "檸檬酸可以食用嗎"
        answer: "檸檬酸（Citric acid）是一種天然有機酸\n\n廣泛存在於許多水果和蔬菜中\n\n含有檸檬酸的常見食物：\n\n1. 檸檬是檸檬酸的主要來源，含量非常高\n\n2. 青檸中的檸檬酸含量也很豐富\n\n3. 橙子的酸味主要來自檸檬酸\n\n4. 葡萄柚，這種水果同樣擁有較高的檸檬酸含量\n\n5. 草莓雖然以甜味為主，但也含有檸檬酸\n\n6. 鳳梨含有一些檸檬酸，使其稍具酸味\n\n7. 蕃茄中也含有檸檬酸。\n\n8. 櫻桃也具有一定的檸檬酸含量\n\n9. 豌豆和胡椒中也有微量檸檬酸\n\n檸檬酸在食品中不僅提供酸味，還具有抗氧化的特性😊\n\n就像很多酵素吃了\n會幫助排便\n\n但很多食物酵素也會萃取出出來當清潔用品啊，像木瓜酵素\n\n而且這些清潔用品也可以強調拿來洗蔬果\n\n所以\n\n了解清楚來源才是最重要的\n\n＋代謝錠圖卡"
      - question: "一次吃這麼多顆不會造成腎臟負擔嗎?"
        answer: "親愛的❤️  謝謝你詢問我的代謝錠😊\n\n我們的代謝錠主要成分是來自天然蔬果與酵素植萃\n\n檸檬酸 蘋果酸 琥珀酸\n\n這些都是身體原本就存在的三大循環酸\n\n參與三酸循環（TCA cycle） 幫助細胞製造能量的關鍵營養素⚡\n\n不是像藥品那樣需要經過肝腎大量解毒喔\n\n檸檬酸、蘋果酸\n像你平常喝檸檬水或吃蘋果裡面就有\n這些天然物質 進到身體裡會參與能量製造\n幫助我們把吃進去的食物 變成可以用的體力\n\n琥珀酸\n它是身體裡細胞在呼吸、在動時會自然產生的成分\n像是細胞的「小馬達」在轉動時會用到它\n幫助你不容易累 體力用得比較順😊\n\n親愛的 你想要改善或是比較在意的部分是什麼呢？\n可以跟我說說看你目前你的狀況或者需求\n我來給你建議喔😊"
      - question: "多囊體質能服用嗎"
        answer: "親愛的❤️ 當然可以～我的代謝錠主要是蔬果的三大有機酸，對任何人來說都很溫和唷❤️\n\n包括孕媽咪、產後媽咪、小孩都可以放心食用\n\n代謝錠 對於促進循環、代謝比較順，對於體內濕氣重、水腫、腸道代謝差這些也有幫助😊\n\n親愛的 你想要改善或是比較在意的部分是什麼呢？\n可以跟我說說看你目前你的狀況或者需求\n我來給你建議喔😊"
      - question: "吃代謝錠會讓身體變成酸性體質嗎？"
        answer: "親愛的❤️ 代謝錠不會讓身體變成酸性體質的喔～不用擔心💛\n\n檸檬酸 蘋果酸 琥珀酸\n但它們是屬於「有機酸」 進到身體後會變成幫助細胞產能的小幫手\n不會影響身體的酸鹼值\n\n這些成分反而是幫助你代謝變好、能量變順\n\n代謝錠其實是鹼性的，所以對胃酸過多，胃食道逆流的症狀也都會有幫助喔\n\n就像你喝蘋果醋的時候\n雖然味道酸酸的 但進到身體反而是鹼性反應\n能幫助代謝 讓胃酸平衡\n很多人吃了代謝錠反而覺得比較舒服 不再那麼脹或逆流 概念是一樣的😊"
      - question: "代謝變好會不會掉頭髮？"
        answer: "我們不會因為代謝變好而掉頭髮哦 😆\n反而代謝變好了 體內的循環好了\n頭皮會更容易吸收營養 頭髮反而「長得比較健康」\n\n掉頭髮的原因通常是壓力 睡眠差 缺乏營養（尤其是B群、鋅、蛋白質）\n有任何問題隨時請教我唷😊"
      - question: "出國不水腫吃法建議"
        answer: "如果擔心出國旅遊水腫 盡量食物可以多吃一些蛋白質或者瓜類食物，以及最最重要的 水分一定要額外多補充哦 2500~3000cc左右都很好😊"
      - question: "喝酒之後可以吃代謝錠幫助代謝嗎"
        answer: "哈囉親愛的❤️\n\n我的代謝錠和薑黃很適合放在飯後和飲酒前補充\n\n喝酒之後 身體需要動員很多能量去代謝酒精\n\n代謝錠裡面的 有機三大酸 \n檸檬酸、蘋果酸、琥珀酸\n可以幫助加速能量代謝、循環\n\n在喝酒前後吃代謝錠\n可以幫助身體加速代謝循環\n讓不舒服感 水腫等等 比較快舒緩喔\n\n同時，薑黃可以幫助肝臟代謝 酒精代謝 所以在飯後和喝酒前補充 對保護肝臟和加速解酒有幫助😊\n\n但還是要注意酒量以及要多多補充水分喔\n\n✅ 健康建議的酒量：\n👩 女性：一天不超過 10-15 克酒精（大約 半杯紅酒 / 330ml啤酒 / 30ml烈酒）\n👨 男性：一天不超過 20-30 克酒精（大約 一杯紅酒 / 500ml啤酒 / 60ml烈酒）\n\n有任何問題歡迎隨時請教我喔😊"
      - question: "對婦科多囊的效果"
        answer: "哈囉親愛的❤️\n代謝錠對於多囊卵巢症候群會有幫助\n\n我們的代謝錠主成分是三大酸（檸檬酸、蘋果酸、琥珀酸）\n這三種天然有機酸是能量循環的核心\n我們吃下去的糖、油、蛋白質\n最後都要進入 「檸檬酸循環（TCA循環）」來燃燒產能\n\n但多囊女生的身體比較容易「能量卡住、代謝變慢」\n所以必須補充足夠的有機三大酸\n\n一旦補充代謝錠就補充這麼多水果萃取的三大酸\n就像把代謝火爐裡的木材加滿\n可以幫助你：\n✅ 提升基礎代謝 ➜ 幫助瘦身＋降脂肪\n✅ 排除代謝廢物 ➜ 小腹不硬脹、水腫變少\n✅ 間接穩定胰島素 ➜ 體重控制＋週期調理\n\n但我會搭配薑黃一起使用 效果會更全面\n\n多囊卵巢 或者其他婦科問題 都可以透過 【美日雙專利高濃度薑黃】來保養\n\n薑黃能幫助穩定雌激素代謝、減少發炎、抑制異常細胞增生 讓女性的卵巢與子宮組織維持健康 減少雌激素受體帶來的不良影響 讓身體慢慢回到平衡的狀態\n\n建議用量是 一日2次飯後吃，一次2~3顆\n那因為薑黃會活血，所以如果你的月經血量偏多\n月經期間建議暫停使用薑黃\n\nhttps://shengtingbio.com/polycystic-ovary-syndrome/ \n這份我們公司雜誌提供關於多囊的資訊分享給你參考唷"
      - question: "- 可否一次沖泡一天的量（15顆）\n- 沖泡方法"
        answer: "親愛的❤️ \n基本上可以五顆代謝錠搭配500 CC\n但如果你覺得太酸\n你也可以變成700 CC❤️\n一切都可以靠自己去抓比例\n太酸就加多一點水！\n不夠酸，就再加幾顆代謝錠❤️\n\n所以一天15顆可以搭配1500~2100cc\n然後一天要喝約3000cc的水哦！😊\n\n哈哈沒錯寶貝 很推薦你夏天用這個方法補充順便補水😎"
      - question: "每次吃完會一直想要小便嗎"
        answer: "親愛的❤️ \n尿液會變多 但是不會讓妳一直跑廁所哦！\n代謝錠主要是在幫妳把身體不要的水分跟廢物排掉\n但前提是妳水要有喝夠 身體才有東西可以代謝\n所以會讓你正常大小便 😊\n\n我先跟你分享關於代謝錠\n我的客人這邊給我最直觀的回饋\n1. 水腫消了\n2. 粉刺變少了\n3. 排便順暢了\n4. 尿液變多了，放屁也變多\n\n因為代謝錠會幫你把身體不要的廢物\n藉由尿液跟氣體排出體外，那你一開始吃你也會發現\n常常口渴，多喝水也是對身體好喔"
      - question: "反應：一開始吃代謝錠會長痘痘是正常的嗎？"
        answer: "親愛的❤️ 放心～\n代謝錠是在幫妳打開身體的代謝節奏\n把堆積的水分、廢物和賀爾蒙代謝物排出去\n所以很多人吃了後明顯覺得水腫退了、排便順、精神變輕盈\n\n那每個人的體質不同\n如果你剛開始皮膚粉刺稍微活躍是代謝啟動的反應\n代表身體真的在排老廢物 是好的現象\n\n多喝水，一天至少2500～3000cc！\n很快就會穩定下來，後續膚況也會越來越好唷😊\n\n親愛的您好🥰\n代謝錠是幫助調整身體的代謝節奏，把多餘水分、老廢物質和賀爾蒙代謝物排出體外✨\n有些人初期會出現粉刺或痘痘，是代謝啟動時的暫時反應，屬於正常的排毒現象唷～\n\n建議這段期間多喝水（一天至少2500～3000cc） 、飲食清淡，幫助代謝更順、膚況更穩定唷😊"
      - question: "反應：為什麼會造成胃不舒服"
        answer: "親愛的❤️ \n代謝錠是鹼性的\n一般吃了反而覺得腸胃更舒服\n甚至也可以改善胃食道逆流\n\n但每個人的身體狀態不太一樣\n如果妳這幾天壓力比較大、吃東西太快、或空腹時間太久\n也都有可能讓胃比較敏感\n\n親愛的你先試試看一次三顆 水配約500cc調整看看😊\n\n官方line:\n\n親愛的您好～\n代謝錠本身是鹼性設計，對多數人來說反而能幫助中和胃酸、讓腸胃更舒服，有些朋友甚至反應長期吃之後胃食道逆流的狀況也改善了。\n\n但每個人的身體狀況不太一樣～\n如果這幾天有壓力比較大、吃太快、空腹時間太長，這些因素也都可能讓胃變得比較敏感，導致一時出現不適的反應。\n\n建議您可以先這樣調整看看👇\n👉 每餐先吃3顆，搭配約400~500cc溫水\n👉 若當餐吃得比較少，也可以稍微延後10分鐘再吃\n\n💧每天的飲水量建議至少 2500～3000cc，對於促進代謝、幫助腸胃蠕動、排出體內廢物都非常重要。\n🍽️ 飲食的部分建議留意，每餐盡量攝取足夠的蛋白質與碳水，不要吃太少或太清淡（例如只喝湯或水果）\n\n盡量避免空腹太久，也不要吃太快，因為吃飯的速度也會讓腸胃變得比較敏感～\n\n您可以先觀察1～2天的身體反應，如果還有其他不舒服的地方，也歡迎隨時聯繫我們😊"
      - question: "暫停會不會恢復原狀\n回彈"
        answer: "親愛的❤️  吃代謝錠的原理是幫妳「打開身體本來就有的代謝通道」\n像是三酸循環（TCA）、肝膽排毒、乳酸代謝這些機制\n\n長期吃可以幫妳「穩定＋清理＋拉升代謝能力」\n\n當妳作息、飲食、體內循環穩定下來\n即使之後不吃 也會保留住那段時間建立起來的「體質基礎」\n\n就像運動一樣 停下來不會立刻打回原形\n\n因為代謝錠本身不是藥、不是刺激型成分\n沒有依賴性、不會破壞原本的代謝系統\n\n但如果停吃後回到熬夜、外食、壓力大、久坐不動\n\n當然代謝也會自然變慢一點\n\n所以跟你的生活飲食作息有關😊"
      - question: "尿酸"
        answer: "親愛的❤️ 尿酸偏高或痛風體質的人\n是可以吃代謝錠的 而且裡面的三大有機酸（蘋果酸、檸檬酸、琥珀酸）\n反而對這類體質是有幫助的\n\n為什麼對尿酸體質有幫助？\n\n✔ 檸檬酸、蘋果酸屬於「弱鹼性有機酸」\n能幫助尿液變得比較鹼性\n進一步促進尿酸排出、減少結晶堆積在關節\n\n✔ 琥珀酸是細胞能量循環中自然產生的中間物\n可以提升代謝率、幫助乳酸與尿酸等代謝廢物清除\n\n✔ 搭配充足的水分攝取（三大酸＋水＝尿酸代謝效果更好）\n長期下來對於降低體內酸性負擔、維持尿酸穩定是友善的😊\n\n小提醒：\n如果是「痛風急性發作期」建議先避開任何保健品\n等穩定後再補充代謝營養會比較安全\n平常穩定保養、尿酸偏高未發作階段\n代謝錠是可以吃、也適合吃的喔！\n\n🌿什麼是尿酸？\n尿酸是身體分解「嘌呤」這種物質之後產生的代謝廢物\n本來會透過腎臟排出 尿液排掉\n但如果「產太多」或「排太少」\n就會堆在血液裡或關節處變成結晶 ➜ 就是俗稱的「尿酸高」「痛風」\n\n🔥容易讓尿酸升高的原因包括：\n\n1️⃣ 吃太多高嘌呤食物（例如內臟、海鮮、火鍋湯、紅肉、啤酒）\n2️⃣ 喝水太少、排尿不順 ➜ 代謝廢物排不出去\n3️⃣ 肥胖＋代謝症候群體質 ➜ 容易內臟發炎、影響腎臟排酸功能\n4️⃣ 壓力大＋熬夜＋常喝含糖飲料或酒精 ➜ 促使尿酸生成更多\n5️⃣ 腎功能偏弱、藥物副作用 也會讓尿酸排出減慢\n\n📌所以尿酸高不是單一「吃錯」\n而是身體的代謝被卡住、代謝廢物出不去的結果\n\n✨這時候就要做三件事：\n✅ 減少高嘌呤來源\n✅ 補足水分（體重x40cc以上）\n✅ 吃進有幫助代謝的天然有機酸（像代謝錠裡的三大酸）"
      - question: "痛風"
        answer: "親愛的❤️ 痛風體質的人真的很適合補充代謝錠\n因為痛風的根本不是吃錯幾餐那麼簡單\n而是整體「代謝力變慢＋體內排酸卡住」的結果\n\n痛風是因為「尿酸代謝不順」\n當身體沒辦法把產生的尿酸好好排出\n它就會積在血液裡、跑到關節裡結晶\n最後變成關節腫、痛、發炎\n\n但很多人忽略\n尿酸代謝靠的就是身體的「三酸循環」＋肝腎＋血液循環\n這些路一旦卡住，尿酸就出不去😊\n\n🔥代謝錠怎麼幫助痛風體質？\n\n✅ 補進天然三大酸（檸檬酸、蘋果酸、琥珀酸）\n這些酸能讓尿液變得比較鹼性\n幫助尿酸在腎臟被順利排出 不容易結晶\n\n✅ 提升整體代謝節奏\n讓身體把吃進去的糖、油、蛋白質都用掉\n不會轉成多餘的乳酸、脂肪、尿酸堆積在體內\n\n✅ 幫助排水、減輕關節負擔\n痛風的人常有水腫、腎臟排毒慢、體重偏重\n代謝錠可以溫和排出多餘水分、減少腫脹感\n\n（吃法）"
      - question: "拉肚子"
        answer: "所以很簡單\n\n就像你今天喝蘋果醋你應該會有點拉肚子\n\n因為蘋果醋裡面有蘋果果酸\n\n代表酸類的東西會讓你腸道蠕動😊\n\n親愛的，你自己可以斟酌變成飯後吃三顆\n然後你再把15顆平均分配到一整天一整\n\n因為代謝錠是可以空腹吃的\n\n官方回答：\n\n親愛的您好～謝謝您的提問😊\n\n代謝錠中含有天然的有機酸（像是檸檬酸、蘋果酸等），這類成分會促進腸道蠕動、幫助代謝循環，有些人在早上空腹或泡水飲用較多時，腸胃較敏感就可能出現輕微腹瀉的情形。\n\n若您早上有這樣的狀況，建議：\n✔ 改為三餐「飯後」搭配溫水整顆吞服或者泡500cc左右的水喝\n✔ 視情況調整為每餐3～4顆，讓身體慢慢適應\n\n若症狀仍持續不適，也歡迎再與我們聯繫協助調整喔～💛"
      - question: "腸胃不好 和 空腹飲用有關係嗎"
        answer: "親愛的❤️  跟腸胃不好無關\n\n而是會增加腸胃蠕動\n\n就像你吃完飯你喝蘋果醋可能也會增加腸胃蠕動\n\n就像你喝檸檬水，也會增加腸胃蠕動\n\n因為酸類的東西本來就會增加腸胃蠕動\n\n只是每個人的體質不同\n\n所以這部分你可以自己斟酌去觀察\n\n但可以給你的保證是絕對不會對身體造成任何的負面影響😘"
      - question: "可否放在不鏽鋼保溫瓶"
        answer: "親愛的 不建議放在不鏽鋼保溫瓶裡喔❤️\n就像檸檬水不能放保溫瓶一樣\n建議你放在玻璃杯、陶瓷杯、透明水瓶中沖泡會比較安全😊"
      - question: "是否會增加排便"
        answer: "親愛的❤️ 謝謝你對我的產品有興趣😊\n\n你目前想改善的狀況是排便不順嗎？還是水腫、代謝差、容易脹氣呢？\n\n我可以根據你的需求幫你安排代謝錠的吃法 也看看要不要搭配其他保養會更有感💕\n\n我們家的代謝錠除了幫助代謝提升\n也有很多人反映吃了之後排便變順、肚子比較不脹\n\n因為代謝錠是天然萃取的三大酸（檸檬酸、琥珀酸、蘋果酸）\n\n啟動身體的燃脂路線 同時促進腸道蠕動\n\n讓你把身體不需要的廢物藉由尿液跟氣體排放出去\n\n長期吃下來 你會發現你的排便變順暢\n因為身體的廢物都很順利的排出體外\n\n你會發現不會那麼水腫了，皮膚變好了\n\n另外，代謝錠其實是鹼性的，所以對胃酸過多，胃食道逆流的症狀也都會有幫助喔😊\n\n除了代謝錠以外\n我們的膠原蛋白其實也可以幫助排便喔😊\n很多客人回饋說 喝了之後不只是皮膚變好\n連排便都變得比較順\n\n因為我們這款膠原蛋白每包含有15克的水溶性膳食纖維\n這種纖維在腸道裡會吸水膨脹\n可以幫助增加糞便體積、柔軟度，刺激腸道蠕動\n讓排便更順暢、不會那麼乾硬或卡卡的～\n\n每天早上空腹喝一包\n除了幫助肌膚補充膠原蛋白、幫助排便\n還可以利用膳食纖維穩定血糖\n\n兩者可以搭配膠原蛋白早上空腹喝 效果會更明顯唷～"
      - question: "飯前跟飯後吃有差別嗎"
        answer: "親愛的❤️ 代謝錠可以空腹吃 也可以飯後吃\n如果單純想要幫助消水腫、啟動代謝\n空腹吃或飯後吃其實效果都差不多\n\n但如果妳也有排便不順、小腹脹氣、容易消化慢的狀況\n那就會建議妳放在飯後吃\n因為這樣可以順便幫助消化、帶動腸胃蠕動\n排便會比較順 肚子也比較不會卡卡的💛\n\n所以看妳的需求調整就可以唷😊"
      - question: "容易胃食道逆流可以喝嗎"
        answer: "親愛的～謝謝妳的詢問😊\n如果妳有胃食道逆流的狀況 是可以安心喝代謝錠的唷！\n\n我們家的代謝錠是由天然三大代謝酸（檸檬酸、蘋果酸、琥珀酸）組成\n它其實是鹼性的～\n反而可以幫助身體調節胃酸、穩定腸胃環境✨\n所以對胃酸過多的人，胃食道逆流的症狀也都會有幫助喔😊\n\n建議妳一定要飯後吃代謝錠\n\n每餐3～5顆開始\n\n看看身體的反應\n等身體習慣後再慢慢增加到完整劑量（一天15顆）\n慢慢調整觀察哦\n有任何問題隨時請教我😊"
      - question: "空腹吃，是否跟我喝檸檬水是相同的道理"
        answer: "寶貝完全不一樣喔\n\n你喝檸檬水只有檸檬\n（三大酸圖卡）\n但是代謝錠\n除了檸檬以外更多蔬菜水果的酸喔"
      - question: "腸胃炎可否吃"
        answer: "可以吃代謝錠\n腸道現在很多壞菌在作祟\n幫助壞菌排出體外\n幫你腸胃重整\n丟進水裡喝也會讓你腸道比較舒服一點哦"
      - question: "是否要和中藥、一般感冒藥、其他保健品間隔"
        answer: "親愛的～\n飯後吃代謝錠、、這樣的組合可以一起吃\n不需要特別間隔\n飯後吃反而會幫助吸收更穩定"
      - question: "<12歲\n小朋友也可以吃嗎？\n\n\n想請問小朋友目前幾歲呢？\n是想針對哪方面的需求幫孩子補充呢？（像是腸胃消化、情緒專注、體力或其他方面）"
        answer: "（排便困擾）\n\n親愛的可以唷\n小朋友建議用量\n一次 2～3 顆\n一天飯後三次\n每顆搭配約 100cc 溫水\n\n小朋友的代謝本來就比大人強\n所以要讓小朋友多攝取原型食物 多活動 多喝水 對排便就會很有幫助😊\n\n可以幫小朋友多準備奇異果 地瓜 芭樂 木耳 南瓜\n這些食物富含天然水溶性＋不溶性膳食纖維 對腸道很溫和有效哦！\n\n（粉刺痘痘需求 10~12歲）\n\n親愛的可以唷\n小朋友建議用量\n一次 3~5 顆\n一天飯後三次\n每次搭配約 300~500cc 溫水\n\n✅ 原型食物為主\n像是地瓜、糙米、燕麥、玉米取代白飯白麵\n幫助穩定血糖 不刺激皮脂腺過度分泌\n\n✅ 優質蛋白質\n每天攝取雞蛋、豆腐、魚肉或雞胸肉\n幫助皮膚修復 痘痘才會好得快\n\n✅ 蔬果豐富的膳食纖維\n尤其綠色蔬菜、番茄、胡蘿蔔、蘋果\n能幫助排便順暢 讓毒素不囤積在皮膚\n\n✅ 好油脂不能少\n像是酪梨、堅果、橄欖油 這些有助抗發炎\n讓皮膚油水平衡不再狂冒痘\n\n親愛的 小朋友長粉刺通常和荷爾蒙變化＋油脂分泌旺盛有關\n\n所以要讓小朋友多攝取原型食物 多活動 多喝水 對皮膚也會很有幫助😊"
      - question: "牙齒酸是否是太刺激現象"
        answer: "親愛的您好～😊\n我們的代謝錠配方是以鹼性為主，主要成分像是檸檬酸鈣、蘋果酸、琥珀酸等，屬於身體可代謝的天然有機酸鹽，不同於檸檬水或碳酸飲料中的酸性物質，不會對牙齒琺瑯質造成長期腐蝕性的刺激，請您放心❤️\n\n若您在咀嚼或含太久時有短暫的酸感，可能是牙齒本身比較敏感或近期有咬合、清潔上的變化。\n\n補充完代謝錠後，建議您可以再喝一杯溫開水，並輕輕漱口\n減少成分殘留在牙齒表面的機會，特別適合牙齒比較敏感的朋友\n同時補充水分，也能促進排便與代謝效果更明顯喔！\n\n有其他問題也都歡迎再問我唷💛"
  - name: "全能膠囊"
    faqs:
      - question: "$ 價錢"
        answer: "親愛的，我的全能\n一瓶 60 顆\n一瓶可以吃約15天\n價錢是 1880😊\n\n\n（活動期間回答）\n親愛的，我的全能\n一瓶 60 顆\n一瓶可以吃約15天\n原價是 1880😊\n\n姐姐現在官網因為有在做活動\n單瓶$1699\n3瓶組$5070\n\n預計到下禮拜一優惠就結束了～ 如果你有興趣的話，非常推薦你可以現在下單，因為是最最划算的價格😊\n\n我們現在也有信用卡以及無卡 3期/6期利率全部我們吸收 🔥\n\n圖卡給親愛的參考❤️ 有其他問題隨時請教我😊\n\nhttps://www.dropbox.com/scl/fi/p12ko7gq97juvkf4sz6k6/2-100.jpg?rlkey=t9ifl65tzlkkxyj0a976ydb9d&st=cpto0rz2&dl=0"
      - question: "吃法"
        answer: "Ｂ群建議吃法是\n增強體力：飯後一天2次、一次2顆 \n幫助入睡、養髮：飯後一天3次、一次2顆\n\n12歲以下兩顆 以上和成人一樣"
      - question: "會不會睡不著，晚上特別精神"
        answer: "這是一個常見的錯誤觀念哦～\n其實，除非睡前服用了高劑量的 B1，才有可能影響睡眠\n相反地，缺乏 B 群反而會更容易導致失眠現象！\n\n如果妳服用全能膠囊後覺得精神過於亢奮，有可能是以下幾種情況：\n1️⃣ 空腹服用，或是晚餐與服用膠囊的時間間隔太久\n2️⃣ 進行 168 間歇性斷食，當日的食物攝取量較少\n3️⃣ 進食後僅搭配澱粉類食物，沒有其他營養均衡的搭配\n\n這種情形其實是因為全能膠囊裡的 B1 和 B2，會幫助糖分進入大腦，導致妳感覺精神較好\n但這並不是全能膠囊本身的問題，而是妳當餐的營養搭配不夠完整哦😊\n\n參考連結：https://www.instagram.com/p/C6v5lHHBc6p/?igsh=MWwzZGJ5bnVleGp1Nw==\n\nB6：幫助製造血清素和褪黑激素，讓心情放鬆、睡眠更穩定\nB12：調整生理時鐘，促進褪黑激素分泌，對抗疲勞、提升睡眠品質\n\n如果要放在睡前吃Ｂ群，可以搭配一湯匙無糖優格，優格中富含鈣和色胺酸，幫助色胺酸轉化為血清素與褪黑激素，雙重加強睡眠效果"
      - question: "男性可以吃嗎？針對掉髮"
        answer: "親愛的，想先知道你的掉髮狀況！\n營養補給對於增加髮量和抑制落髮有相當大的輔助效果，雖然遺傳性因素可能需要較長的時間才能看到明顯改善，但補充適當的營養絕對能帶來幫助✨\n\n那本身你有雄性禿的困擾，這個屬於你先天性的體質，吃保健品不會到完全新的改善，但絕對會有間接的幫助，因為畢竟我們都外食之多，飲食不均衡會讓你原本這個先天性的困擾造就更嚴重的問題發生\n\n親愛的 如果你本身有雄性禿的傾向\n那這屬於先天體質的部分\n吃保健品不會一下子有明顯新生髮的變化\n但絕對會有間接穩定的幫助\n\n尤其是針對外食多、營養攝取不均、壓力大、作息亂這些因素\n長期下來都會讓原本的落髮問題變得更明顯\n\n所以我會建議可以從頭皮循環、毛囊營養、荷爾蒙平衡這幾個方向慢慢打底\n讓你的頭髮越掉越少、整體變得穩定\n\n男性掉髮問題的常見原因有：\n\n遺傳＋雄性荷爾蒙影響（DHT）\n\n壓力大、作息亂：會加快毛囊萎縮\n\n缺乏鋅、B群、生物素：毛髮營養供應不穩\n\n油脂過多或頭皮發炎：堵塞毛孔＋刺激毛囊退化\n\n\n-----\n我們的Ｂ群含有 B2 B6 B7 這些都可以整體改善頭皮環境 \n對油性頭皮＆掉髮族群非常重要\n\n親愛的，姊姊看到你的問題\n\n關於你的先生頂髮量偏少的問題\n\n我們可以分幾個方向來看\n\n你可以跟姊姊分享先生的飲食習慣\n\n還有洗髮用品\n\n吃姊姊的全能當然也是一個方向\n\n只是我們用更全面的方式來看看怎麼改善你先生的情況\n\n你可以跟姊姊分享\n然後我再給你建議"
      - question: "產品適合我嗎"
        answer: "親愛的如果你壓力特別大，或是飲食超級不均衡，\n抑或是長期熬夜工作，想要長頭髮\n我的全能可以穩定情緒 去醣（大餐後吃可以穩定血糖）\n我們的成分含有B7、鋅可以幫助長頭髮😊"
      - question: "如何好睡"
        answer: "全能膠囊裡面的B6、B12需要搭配含蛋白質的食物，\n這樣才能幫助身體產生血清素，進而促進褪黑激素，讓睡眠更穩定哦😊"
      - question: "Ｂ群可否改善白髮\n如何長頭髮 預防白髮 防止掉髮"
        answer: "寶貝，B群可以幫助改善白髮 但更重要的是它能讓你睡得更好 精神更穩定 氣色也會變得更好\n因為頭髮的主要成分是角蛋白（蛋白質的結構）\n沒有足夠的蛋白質，頭髮就會變得脆弱、容易掉落。\n除了吃我們的Ｂ群，平常一定要多補充蛋白質\n像雞蛋、魚、雞肉、豆腐、堅果等，都是很好的來源😊"
      - question: "少年白"
        answer: "哈囉親愛的 謝謝你的詢問❤️ \n你是最近才發現白髮變多 還是一直以來都有呢？\n是集中在某個部位 還是整體變多呢？\n如果是近期才開始 可能跟 壓力、睡眠、營養流失 有關\n如果是從小就有 遺傳的影響比較大😊\n你的日常飲食一定要專注補充這些營養  蛋白質 優質碳水 鐵 維生素Ｄ 和Ｂ群\n這些營養素在我們身體造就我們的毛囊健康\n尤其是蛋白質和碳水，是毛囊的建材和燃料，缺一不可\n\n均衡飲食 再搭配全能B群＋C鋅鎂作為輔助💆🏻‍♀️\n\n利用其中的B5+B7+鋅，強韌髮根，減少掉髮，讓髮量更豐盈！同時促進黑色素生成 維持頭皮健康\n\n雖然少年白無法完全逆轉 但透過營養補充與生活調整 是可以延緩白髮增長的\n因為外食多 飲食不均衡 容易讓 白髮狀況惡化 站在營養角度 一天6粒補充 是個穩定的輔助方式\n營養補給的好處不只影響 髮量 也能幫助 好睡眠、提升代謝 調理身體的同時 也讓頭皮獲得更多養分😊"
      - question: "有控醣產品嗎"
        answer: "全能可以放在餐前空腹吃 \n啟動代謝、幫助控醣\n因為裡面的B6和鎂 \n對於穩定血糖、減少血糖波動有幫助～\n這樣能避免血糖忽高忽低造成的疲勞或是容易想吃甜食哦"
      - question: "才購買其他品項，但是有睡眠問題"
        answer: "日常飲食中多多補充這些含有色氨酸食物\n\n也推薦妳可以補充我們的全能膠囊（裡面有B群＋Ｃ鋅鎂）\n\n幫助放鬆、穩定情緒、減少睡醒疲累感\n\n可以先看看你吃（已購買產品）後的反應 以及飲食方面可以多留意"
      - question: "鎂的含量"
        answer: "哈囉親愛的❤️\n\n關於鎂的部分 我們使用的是來自米糠的天然萃取物\n\n主要是為了協助整體營養的穩定與吸收\n\n所以我們在配比上，複方的部分屬於我們的機密，就沒有特別顯示😊\n\n客人另詢 鎂 含量問題\n\n關於鎂含量的問題，我們產品中的鎂是來自米糠萃取物，可以幫助穩定產品中的營養素✨\n全能膠囊的設計重點在於透過維生素B、維生素C及礦物質的均衡搭配\n為身體提供全面的支持，而不是單純用來補充高量的鎂\n所以我們在配比上，複方的部分屬於我們的機密，就沒有特別顯示💕"
      - question: "產後掉髮原理"
        answer: "親愛的❤️ 謝謝你的詢問～ \n\n產後落髮是很常見的\n落髮和情緒有關\n也和身體的賀爾蒙變化有很大的關係\n\n懷孕的時候\n因為雌激素大量分泌\n頭髮都被停留在生長期 停止自然掉落\n所以會覺得髮量較豐厚～\n\n但產後雌激素突然驟降\n身體一下子要回到原本的節奏\n這時候累積下來本來就應該自然掉落的頭髮\n就會集中在產後3到6個月大量掉落\n\n那這時候建議媽媽除了懷孕期間補充全能Ｂ群膠囊，產後也要持續補充！\n\n✔️ B6 B12 幫助血液循環 讓頭皮可以有養分滋養\n✔️ 鋅＋鎂 可以穩定神經系統 降低壓力 幫助激素慢慢恢復平衡\n✔️ 維生素C 幫助膠原蛋白生成 支持毛囊和頭皮健康\n\n幫助產後身體快速修復\n\n親愛的 如果還有其他想了解的地方\n都可以隨時跟我說喔😊"
      - question: "對男生的好處"
        answer: "哈囉親愛的❤️ \n男生非常適合\n因為男生的需求會更高 消耗也更快\n所以補充全能Ｂ群＋Ｃ鋅鎂是很重要的日常保養\n\n因為男生壓力普遍比較大\n如果長期高壓＋晚睡\n還會大量消耗身體裡的鎂\n再加上飲食若偏鹹、高油少蔬菜\n鎂本來就攝取不足 更容易流失\n\n再來，鋅是「男性賀爾蒙代謝」超級重要的營養素\n但男生壓力大 熬夜 飲食不均衡\n也會很容易消耗鋅\n加上身體本身如果有慢性發炎\n也會讓鋅快速消耗掉\n\n有足夠鎂和鋅的男生\n👉🏻 精神會比較好\n👉🏻 脾氣比較穩定\n👉🏻 體態比較容易維持\n👉🏻 皮膚、頭髮、體力會更好\n👉🏻 同時也保護心血管健康\n\n建議吃法\n增強體力：一天2次、一次2顆\n幫助入睡：一天3次、一次2顆\n\n至少連續吃滿2–3個月"
      - question: "可否改善淺眠"
        answer: "哈囉親愛的❤️\n妳說的這種不是入睡困難 而是睡不久、早醒型的淺眠問題\n其實是跟神經系統、壓力荷爾蒙、鎂與B群缺乏比較有關喔～\n這時候吃全能膠囊很適合！\n\n全能膠囊裡面有：\n✔ B群＋鎂 ➜ 穩定自律神經、舒緩緊繃、幫助大腦放鬆\n✔ 天然穀物來源的C與鋅 ➜ 修復神經、補充夜間所需營養\n✔ 酵母來源的營養素 ➜ 幫助情緒穩定、減少焦躁醒來的機會\n\n適合半夜容易醒、醒來後難再睡著的人哦\n\n建議吃法：\n🌟兩餐飯後各3粒"
      - question: "睡前吃法"
        answer: "如果放在睡前吃，建議搭配 幾口優質蛋白質 來穩定血糖、幫助吸收哦～\n\n可以搭配幾口無糖優格 無糖豆漿 半個水煮蛋等等\n\n因為全能膠囊裡面的B6、B12需要搭配含蛋白質的食物\n\n這樣才能幫助身體產生血清素，進而促進褪黑激素，讓睡眠更穩定哦🌙\n\n裡面的B6、B12加上蛋白質食物\n\n能幫助身體產生血清素，進而促進褪黑激素，讓睡眠更穩定哦🌙"
      - question: "掉髮 落髮"
        answer: "這裡幫您整理一下我們產品中針對頭髮健康的重點成分與建議，讓您更清楚從營養角度怎麼幫助改善掉髮：\n\n💛 掉髮常見原因：\n壓力大、熬夜、睡不好\n\n賀爾蒙失衡（如產後、更年期）\n\n缺乏營養（如B群、鋅、蛋白質）\n\n頭皮循環不良\n\n頭髮保健的部分\n你的日常飲食一定要專注補充這些營養  蛋白質 優質碳水 鐵 維生素Ｄ 和Ｂ群\n這些營養素在我們身體造就我們的毛囊健康\n尤其是蛋白質和碳水，是毛囊的建材和燃料，缺一不可\n\n因為長期缺乏蛋白質會導致毛囊萎縮，出現掉髮和髮量減少\n\n建議在你的飲食過程中早上第一餐 碳水一定要吃 還有蛋白質的攝取 額外去補充 一定會有幫助的\n\nhttps://www.shengtingbio.com/hair-loss-tips-for-managing/ \n\n親愛的 你可以觀察看看\n\n如果每天掉落約50到100根頭髮都是正常範圍內 就不用太焦慮\n\n這篇也給你參考看看\n\n希望對你有幫助😊"
      - question: "痛風可否食用"
        answer: "哈囉親愛的❤️\n謝謝妳的詢問～\n—\nB3（菸鹼酸）是身體能量代謝中非常重要的輔酶之一\n我們產品中的B群屬於「基礎營養補充型」\n符合國健署建議標準\n劑量約在 15–30mg/天 左右\n這種劑量不會影響尿酸代謝 對痛風體質來說是安全可使用的\n—\n📌 只有在「藥用級高劑量B3（超過1000mg/天）」的情況下\n才有可能影響尿酸排出\n所以一般保健型B群並不會導致痛風或讓尿酸升高\n—\n另外像是 B1、B2、B6、葉酸\n這些營養素在「嘌呤代謝＋尿酸排出＋神經穩定」的路徑中\n都有非常重要的角色\n適量補充反而有助於讓身體代謝更順暢 不容易累積毒素或水腫唷～\n\n對於需要長期吃降尿酸藥、腎排酸能力比較弱的族群\nB群能支援肝臟解毒、神經修復 不會增加負擔\n\n對痛風體質來說是安全的日常營養支持哦！"
      - question: "高劑量的維他命會不會有副作用？"
        answer: "親愛的 \n如果你有額外補充它牌維生素 \n水溶性的維他命吃多了一樣會從尿液排掉 \n基本上不補充超過每日上限即可\n\n脂溶性的（像A、D、E、K）才是我們比較會注意的\n吃太多會囤在身體裡 可能出現肝腎負擔、鈣質堆積等狀況\n\n那我們的全能B群\n劑量都是符合國健署建議範圍內的保養劑量\n不會造成過量或副作用\n只要依照建議吃法服就沒問題哦😊"
      - question: "膠囊顏色不一樣是否正常"
        answer: "是的，膠囊顏色因為上一批的顏色缺貨了，所以以不影響任何的效果唷😘\n\n親愛的您好～謝謝您的細心詢問💛\n關於您提到的 B 群膠囊顏色不同的情況，是因為之前使用的膠囊外殼原物料供應顏色缺貨才做了調整，但請您放心，內容成分與功效完全相同，品質也都經過嚴格把關，不會影響您的使用喔 😊\n如有其他問題也歡迎隨時與我們聯繫～"
      - question: "為何Ｂ群可以改善痘痘"
        answer: "因為維生素B3、B5 和 B6對於痘痘肌和皮膚的發炎反應很有幫助\n可以調節皮脂分泌、減少發炎、加快痘痘修復的速度\n也能幫助肌膚在代謝過程中穩定下來、不那麼容易反覆冒痘\n\nhttps://www.shengtingbio.com/eat-vitamin-b-complex-to-improve-your-skin/"
      - question: "心悸跟想嘔吐反應是否適合？"
        answer: "親愛的～妳說吃了之後會心悸、想嘔吐，身體熱熱的感覺\n這種情況我們會先考慮是對「B群中的菸鹼酸（維生素B3）」有反應\n\n這叫做一種很常見的現象：Niacin Flush（菸鹼酸潮紅反應）\n\n🌿這是因為菸鹼酸有輕微「擴張血管」的作用\n有些人對這個反應比較敏感\n吃完後可能會出現：\n✔ 臉或身體發熱發麻\n✔ 頭暈、微微心悸\n✔ 有點想吐或不舒服的感覺\n\n這不是過敏，也不是身體不能接受\n而是一種暫時性的反應\n有些人吃一段時間就會適應了，或者減量、飯後吃會比較舒服\n\n—\n✅ 姊姊建議妳這樣試試看：\n1️⃣ 先減量吃，從一天1～2顆開始\n2️⃣ 一定要「飯後服用」，不要空腹吃\n3️⃣ 如果身體還是很不舒服，或症狀持續很久\n→ 那就建議先停用，再由營養師幫妳評估是否要更換成不含菸鹼酸或劑量更低的配方\n\n只要妳不是出現「呼吸困難、喉嚨緊、全身紅疹」這類過敏反應\n大多數這種熱感是可以觀察、也會漸漸適應的唷\n\n在國外很多運動員為了比賽前提升爆發力＋增加血液循環\n會大量補充**B群，特別是含有B3（菸鹼酸）**的配方\n因為B3有「擴張血管」的功能，可以讓肌肉更快充血、代謝效率更好\n而且不會違反藥檢，是合法又自然的營養補給方式\n\n\n就像姊姊平常熬夜工作、精神快撐不住的時候\n我也會加強補充B群，讓身體的「血管打開」\n精神撐得住、腦袋也比較清楚\n這也是為什麼有些人吃B群後會覺得熱熱的、臉紅紅的\n那就是B3在發揮作用唷！\n\n如果你吃完有一點麻麻熱熱，那是代表循環在打開、代謝在運作\n只要不是過敏反應，通常過一段時間身體會慢慢適應的喔～\n\n官方：\n\n\n\n\n親愛的寶貝～ 您反映的熱熱刺刺、心跳加快的情況，可能是體質對B3（菸鹼酸）較敏感，這種反應在營養學上稱為『Niacin Flush』，不是過敏喔，而是一種血管短暫擴張、促進循環的生理現象\n\n這種感覺通常會在5～15分鐘內自動退去，不會對身體造成傷害，但如果您覺得不舒服，建議可以：\n1️⃣飯後馬上吃B群（可減緩吸收速度）\n2️⃣搭配大量水分幫助代謝\n3️⃣如反應仍不舒服，我們也可以為您調整食用方式\n\n\n謝謝您細心的回饋～😍\n想問親愛的，您目前的B群是怎麼食用？一天三餐都吃嗎？是飯前還是飯後吃呢？"
      - question: "脂漏性皮膚炎"
        answer: "親愛的❤️ 脂漏性皮膚炎的成因可以分成內因＋外因\n\n內在因素：\n1️⃣ 皮脂分泌過多、油水平衡失調\n→ 通常出現在T字部位、頭皮、鼻翼兩側、耳後等「出油多的區域」\n\n2️⃣ 壓力大＋睡眠不足 → 自律神經失調\n→ 導致皮脂腺活性異常，出油量忽高忽低，也會影響免疫反應\n\n3️⃣ 免疫系統偏弱／慢性發炎體質\n→ 對皮膚常見的菌種（如馬拉色菌）產生過度反應，引發紅、癢、脫屑\n\n4️⃣ 營養不均、B群、鋅與Omega-3脂肪酸不足\n→ 導致皮膚屏障修復變差，炎症更容易反覆發作\n\n外在刺激：\n5️⃣ 氣候變化（特別是天氣冷＋乾）\n6️⃣ 洗得太乾淨／使用過度刺激的洗面乳、酒精、去角質產品\n7️⃣ 高糖、高乳製品、高油炸食物攝取頻繁\n→ 這些會促使皮脂分泌混亂，加重發炎反應\n\n所以要從內部調節＋營養補回來\n\n你的日常飲食要專注多多補充  維生素B群（特別是B2、B6、B7生物素）、鋅、Omega-3脂肪酸（EPA、DHA）、維生素D 和高抗氧化食物\n\n\n這些都會幫助你穩定皮脂分泌、修復皮膚、減少發炎反應的基礎營養\n\n哪些原型食物要多吃？\n✅ B群豐富的食物：糙米、地瓜、雞蛋、深綠色蔬菜、酵母粉、堅果\n✅ 鋅：南瓜籽、牡蠣、紅肉、蛋黃、芝麻粉\n✅ Omega-3：鮭魚、秋刀魚、亞麻仁籽、奇亞籽、胡桃\n✅ 維生素D：曬太陽、鮭魚、香菇、蛋黃\n✅ 高抗氧化食物：番茄、甜椒、藍莓、綠花椰、紅蘿蔔、葡萄"
      - question: "尿液\n尿尿顏色不黃 \n是否正常"
        answer: "親愛的 謝謝你的詢問😊 \nB群會讓尿變黃，是因為裡面的B2（核黃素）是亮黃色的！\n吃進去後如果有多的、用不完的，身體就會直接尿出來～所以才會變成那種很黃很黃的尿尿\n\n現在市面上很多B群是化學合成的\n人體吸收率較低\n所以常常會覺得吃了Ｂ群尿尿顏色都會變黃\n\n我們家的B群是天然酵母來源的\n溫和且吸收率高～身體一吃進去就立刻拿去用\n所以尿液顏色就不會黃黃的\n\n代表身體有完整吸收到營養🔥"
      - question: "多久有效 長頭髮"
        answer: "至於多久有感覺 大部分人吃了睡眠和精神狀態馬上就會很有感，頭髮的部分需要你去慢慢感受囉\n\n親愛的可以觀察看看，前面兩個月掉髮變少 再來會新髮變粗、髮線開始填補、整體蓬鬆度感覺出來，至少觀察2～3個月是一個完整週期哦❤️"
      - question: "孕婦可以食用嗎？\n懷孕 孕期"
        answer: "親愛的，謝謝你詢問我的全能膠囊😊\n\n孕期是媽媽和寶寶都在同步發育的關鍵時期\n\n孕期期間是可以安心食用的喔\n\n我等下也會傳一篇我們內部雜誌的專業資訊給妳\n\nhttps://www.yardley.tw/pages/mama-baby-magazine-interview \n\n在孕期期間，全能膠囊中的維生素成分非常適合懷孕的媽媽們，像是葉酸、生物素和B12等營養，對寶寶的健康發展有很大幫助💖\n\n全能建議三餐飯後各服用三粒，B群能有效緩解抽筋和孕吐的不適\n如果症狀較為明顯，可以考慮適量增加用量為一次四粒\n\n那親愛的再評估看看，有問題、想進一步了解產品再隨時詢問喔😊"
      - question: "懷孕：全能＋其他綜合維他命"
        answer: "親愛的您好～謝謝您的提問🥰\n懷孕期間若您已經有補充綜合維他命，也可以搭配我們的 全能膠囊（B群＋C鋅鎂） 一起使用唷✨\n\n📍如果您已有吃綜合維他命：\n➡️ 可將全能膠囊作為「加強補充」\n➡️ 建議早晚飯後各2顆，一天2～4顆即可👌\n\n📍若是單獨補充全能膠囊：\n✅ 建議三餐飯後各3顆\n幫助穩定神經、補充能量、減緩孕期情緒與疲勞不適💛\n\n📌 若有孕吐或抽筋困擾：\n👉 可將劑量調整為每餐4顆\n補足B群、鎂與維生素C，幫助改善孕吐、緩解抽筋🌿"
      - question: "壓力性荷爾蒙失調（變胖）"
        answer: "妹妹\n\n當妳長期壓力大，身體的確容易出現壓力性荷爾蒙失調的狀況，不只影響體重（容易變胖）\n還可能導致身體各種不適，比如睡眠障礙、容易疲勞、代謝變慢等等，整體進入一個亞健康狀態\n\n我用這種方式表達\n你應該比較清楚\n\n妳目前選擇的搭配：「代謝錠＋薑黃＋全能B群」是非常好的組合喔\n\n這三種營養素可以從不同面向改善妳的身體：\n\n我來解釋給你聽\n\n✅ 代謝錠：幫助調節代謝機能、促進循環、消除水腫，也能讓妳的身體更輕盈\n\n✅ 薑黃：非常適合改善身體的急性發炎狀態，特別是妳壓力大的時候更容易發炎，薑黃就像一個溫柔的「滅火器」，能幫助妳緩解壓力帶來的不適感\n\n✅ 全能B群：是專門針對壓力大設計的，B群能有效穩定情緒、舒緩壓力，讓妳晚上更好入睡，並且恢復活力，整體提升身體抵抗壓力的能力"
      - question: "一天6顆"
        answer: "寶貝\n關於劑量\n\n全能膠囊裡的營養成分（B群、鋅、鎂、專利酵母等等）\n是依照科學建議劑量去設計的\n\n一天的標準建議是 2～4顆 就能有效補充頭皮、毛囊需要的營養，幫助頭髮健康生長、同時改善睡眠\n\n但為什麼有些人，甚至我會吃到6顆？\n\n那是屬於「加強劑量」的吃法，通常是針對\n\n\t•\t最近壓力大、掉髮特別明顯\n\t•\t熬夜、作息不穩\n\t•\t想要在短期內加快效果\n\n所以不是一定要每天6顆，妳可以依照狀況調整\n\n\t•\t維持保養：每天 2～4 顆\n\t•\t加強時期：短時間可以到 6 顆\n\n至於成本的部分\n\n不用擔心喔～正常保養劑量的話，一瓶大概就是能吃一個月左右\n只有在妳想要快快看到效果\n或是狀況比較嚴重的時候才會拉高到6顆\n\n等狀況穩定下來，再回到日常劑量就好"
  - name: "薑黃"
    faqs:
      - question: "$ 價錢"
        answer: "親愛的，我的薑黃\n一瓶 60 顆\n一瓶目前優惠$1599\n一瓶可以吃約15天\n\n我們現在也有信用卡以及無卡 3期/6期利率全部我們吸收 🔥\n\n圖卡給親愛的參考❤️ 有其他問題隨時請教我😊\n\nhttps://www.dropbox.com/scl/fi/p12ko7gq97juvkf4sz6k6/2-100.jpg?rlkey=t9ifl65tzlkkxyj0a976ydb9d&st=cpto0rz2&dl=0"
      - question: "吃法"
        answer: "美日雙專利高濃度薑黃+朝鮮薊\n建議食用方式：\n✅日常保健\n一日2次，一次2顆\n\n✅體重管理保養（想要消除內臟脂肪、作息不正常都會熬夜、起床有口臭、身體很容易痠痛）\n一日3次，一次2顆\n\n薑黃的部分建議用量是兩餐飯後 各2~3粒\n那因為薑黃會活血的特性\n如果你月經血量比較多 \n生理期期間可以先暫停使用😊\n\n那薑黃的話，看你本身的經血量，因為薑黃有活血的功能，其實對經期本身不會有負面影響，但如果本身就是經血量較多的人，會因為它的活血特性，變得更多，怕造成你的不便，所以建議經期可以停吃！\n\n但如果本身就是血量偏少，那就可以吃，沒關係的☺️\n\n記得幫我搭配2500~3000cc的水🔥\n\n謝謝親愛的支持 ❤️ \n等你跟我回饋你吃的感覺喔🥰"
      - question: "陰虛的體質吃妳的薑黃，會上火嗎？"
        answer: "親愛的💖 薑黃偏溫，陰虛體質若燥熱明顯，可能會上火（如喉乾、口渴）。建議每日 1-2 粒開始，搭配涼性食材，多喝水平衡，若有不適可暫停並諮詢中醫師哦"
      - question: "不會吞/因為膠囊外殼長痘痘"
        answer: "如果妳不喜歡膠囊或腸胃比較敏感，可以把膠囊拆開，將粉末倒入口中後搭配溫開水飲用，也可以加入溫度低於40度的飲品中直接喝，但粉末味道稍苦，效果完全不會打折💛"
      - question: "哺乳期間可以吃嗎？"
        answer: "哺乳期間是可以適量補充薑黃的哦✨ 薑黃中的薑黃素具有抗氧化和抗發炎的特性，對於產後恢復、幫助減少炎症都有一定幫助\n\n如果妳的乳汁分泌穩定，建議每天飯後1-2粒，搭配足夠的水分補充即可\n\n如果妳還在哺乳中，但有出現退奶或乳汁減少的狀況\n建議先暫停薑黃的補充，觀察一下身體變化\n\n等到完全退奶、胸部不再脹痛或分泌乳汁\n就可以放心開始吃薑黃囉～✨\n\n它會幫助妳退得更乾淨、代謝比較順\n身體也會舒服很多💛"
      - question: "吃薑黃為什麼可以改善熬夜的肝臟發炎呢 我是長期熬夜者"
        answer: "熬夜會讓肝臟負擔變重，因為肝臟晚上需要修復和排毒，長期下來容易堆積毒素、發炎，甚至傷害肝細胞，讓代謝變差，導致疲勞、臉色暗沉，甚至脂肪肝的風險增加\n\n我的薑黃很厲害，用了美國Ginfort®專利薑黃素，吸收率提升27倍，搭配美國專利黑胡椒，再增加2000%吸收效率，讓薑黃素能快速作用到肝臟，減少發炎反應，穩定肝細胞\n\n薑黃素能抑制體內的發炎因子，這些因子通常會因熬夜或壓力而增加。當發炎反應被控制，肝臟細胞就能更穩定，減少損傷，因此可以改善熬夜的肝臟發炎哦\n\n我的產品還加入了朝鮮薊、靈芝幫助解毒和修復，芝麻素、五味子加速脂肪分解、抗氧化，全面保護肝臟，讓肝臟運作更輕鬆\n\n建議使用 任兩餐飯後各三顆 做加強保養"
      - question: "懷孕可否吃"
        answer: "親愛的,\n薑黃會燃燒脂肪\n但是你懷孕需要脂肪\n所以薑黃建議你坐月子再補充"
      - question: "經期期間可以使用嗎？"
        answer: "如果妳是體質偏燥熱／經血量本來就偏多的人，建議月經期間暫停使用喔！\n如果妳是容易水腫、經前悶脹、體虛但經血量適中，這時候吃薑黃反而會讓妳比較舒緩、循環順一點✨"
      - question: "囊腫體質適合嗎？"
        answer: "親愛的～囊腫體質是可以補充的喔🌸\n薑黃能幫助穩定雌激素代謝 減少發炎！\n讓卵巢跟子宮組織更健康✨\n想要調整體質的話 會是很好的輔助保養💛"
      - question: "如果月經量很大的時候，是可以吃薑黃的嗎？"
        answer: "薑黃本身有促進循環、抗發炎、幫助賀爾蒙代謝的功能\n所以如果經血量已經偏多、或有經痛明顯、血崩體質\n🌿建議生理期間暫停服用薑黃\n尤其是在「經期前兩天～月經結束前」這段時間先停掉\n等經期過後再繼續吃來穩定賀爾蒙與發炎體質\n👉 這樣會讓妳的週期更穩、流量更正常不過頭"
      - question: "婦科問題"
        answer: "親愛的您好～\n關於婦科方面的保養，像是子宮肌瘤，可以透過營養素來進行長期調理與穩定。這邊幫您整理建議的核心產品搭配與簡單說明，讓您更清楚怎麼吃 👇\n\n薑黃能幫助穩定雌激素代謝、減少發炎、抑制異常細胞增生 讓女性的卵巢與子宮組織維持健康 減少雌激素受體帶來的不良影響 讓身體慢慢回到平衡的狀態\n\n建議搭配的保健品組合：\n1️⃣『美日雙專利高濃度薑黃+朝鮮薊』\n\n- 具抗氧化與抗發炎功能\n- 能抑制不正常細胞增生、協助穩定女性荷爾蒙與雌激素受體的活性\n- 適合有子宮肌瘤、子宮內膜異位、巧囊、多囊等婦科困擾者做日常調理\n\n2️⃣『全能膠囊（含B群＋鋅＋鎂＋C）』\n\n- 幫助神經系統穩定、抗壓、情緒平衡\n- 鎂與維生素C對女性賀爾蒙代謝及免疫系統也很有幫助\n\n💡 為什麼這樣搭配？\n婦科問題的根源往往與雌激素代謝異常、慢性發炎、壓力指數過高有關\n\n薑黃可以幫助改善荷爾蒙代謝環境，\n\n全能膠囊則幫助身體恢復自我修復與調節能力，讓女性系統慢慢回到平衡狀態\n\n美日雙專利高濃度薑黃+朝鮮薊\n建議食用方式：\n✅日常保健\n一日2次，一次2顆\n\n✅體重管理保養（想要消除內臟脂肪、作息不正常都會熬夜、起床有口臭、身體很容易痠痛）\n一日3次，一次2顆\n\nhttps://shengtingbio.com/information-about-uterine-myoma/\n這篇我們公司雜誌提供關於子宮肌瘤的資訊給你參考哦😊"
      - question: "多囊"
        answer: "哈囉親愛的❤️\n\n多囊合併胰島素阻抗的體質\n\n身體會比較容易發炎、賀爾蒙代謝慢、排卵不規律\n\n這些情況都會讓體重卡住、經期不穩定、痘痘粉刺反覆\n\n不管是多囊 還有關於婦科任何問題都可以利用我的日本美國專利薑黃來保養 \n\n而且有效可以去抑制腫瘤細胞病變 \n\n或者是女性卵巢組織跟子宮組織的細胞 \n\n因為雌激素受體而產生不好的影響都可以慢慢的緩轉\n\n薑黃能\n✅ 幫助穩定發炎反應\n✅ 支援肝臟代謝荷爾蒙\n✅ 輕微調節胰島素敏感度、改善水腫\n\n姊姊也會建議\n薑黃搭配全能膠囊（補B群＋Ｃ鋅鎂）\n整體會讓身體比較不容易失衡、代謝順一點\n\n吃法建議：飯後2～3顆，一天兩次\n\n那因為薑黃會活血的特性\n如果你月經血量比較多 \n生理期期間可以先暫停使用\n\n有其他問題隨時請教我😊"
      - question: "有排便功效嗎"
        answer: "親愛的❤️\n薑黃會有間接幫助排便變順的效果\n他會幫助肝膽代謝 \n因為膽汁分泌變好\n進而刺激腸胃蠕動\n平常腸胃比較慢的人會有感～"
      - question: "含量"
        answer: "關於詢問的含量的問題\n由於我們的產品是以複方形式製作\n每種成分的比例是經過精心設計以達到最佳配合效果\n\n這意味著單獨一種成分的具體劑量無法個別列出\n因為我們注重的是成分間的\n協同作用及整體效果🥹\n\n是通過精心選擇的成分組合製成\n旨在提供最佳的效果💛\n\n\n基於其對於婦科疾病和體脂改善的綜合作用，並非單一成分的量\n\n我們更重視的是產品的整體效能和安全性，並確保每一批產品都經過嚴格的質量控制，以符合我們對效果和安全性的高標準\n\n親愛的對如何使用我們的產品以獲得最佳效果有任何疑問，我們非常樂意提供進一步的建議🫶🏻\n\n我們的產品絕對是經過嚴格的認證標準\n讓您吃得安心又有效🥰🥰"
      - question: "薑黃主要是針對什麼做保養的"
        answer: "您好🥰\n我們家的【美日雙專利高濃度薑黃】主要針對以下方向保養：\n\n🌿 降體脂肪：幫助啟動脂肪代謝、改善內臟脂肪堆積\n🌿 養肝排廢：提升肝臟代謝力，特別適合熬夜、外食、常喝酒者\n🌿 婦科調理：協同舒緩經前不適、循環差、水腫體質\n🌿 抗發炎：調整體質、降低體內慢性發炎狀況 \n🌿 清晨口氣與腸胃代謝：針對起床口氣重、代謝差、宿便問題也有幫助\n\n特別添加美國Ginfort® & 日本專利高濃度薑黃，吸收率高達一般薑黃的280倍🔥\n不僅代謝力提升，還能幫助身體抗發炎、排除廢物，讓你從內而外更輕盈！"
      - question: "幾歲可以吃\n小朋友"
        answer: "補充薑黃的部分\n👶 6歲以下：建議以天然食材中的薑黃為主（如料理中加薑黃粉），不建議額外補充高濃度保健品。\n🧒 7–12歲：一天兩顆，並建議「飯後」補充，避免空腹造成腸胃刺激。\n🧑 13歲以上：可依個人體質逐步調整至成人劑量（一天四顆），或持續維持一天兩顆\n\n只要會吃副食品就可以吃了"
      - question: "我想瘦大腿的脂肪，那我吃薑黃素會瘦到胸部跟臉嗎？"
        answer: "姐姐說\n\n妳不用擔心吃薑黃素會讓妳臉或胸部變瘦呢！\n\n薑黃素最棒的地方，就是它會專門針對妳身體裡不健康的脂肪\n\n（例如大腿、肚子這些白色脂肪細胞）\n\n把這些頑固的脂肪慢慢代謝掉\n\n而像胸部跟臉頰，本來就是應該保留健康脂肪的地方\n\n薑黃素不會去影響這些健康的脂肪細胞\n\n所以完全不用擔心臉或胸部會因此而瘦下來喔❤️\n\n放心吃吧，妳的大腿脂肪會漸漸離開，但臉蛋和胸部的豐盈美麗會繼續留在妳身上"
  - name: "美白膠囊"
    faqs:
      - question: "$ 價錢"
        answer: "親愛的，我的美白\n一瓶 60 顆\n可以吃半個月至一個月根據個人需求調整\n價錢是 1980😊\n\n姐姐現在官網因為有在做活動\n單瓶$1799\n3瓶 $5270\n\n預計到明天優惠就結束了～ 如果你有興趣的話，非常推薦你可以現在下單，因為是最最划算的價格😊\n\n我們現在也有信用卡以及無卡 3期/6期利率全部我們吸收 🔥\n\n圖卡給親愛的參考❤️ 有其他問題隨時請教我😊\n\nhttps://www.dropbox.com/scl/fi/p12ko7gq97juvkf4sz6k6/2-100.jpg?rlkey=t9ifl65tzlkkxyj0a976ydb9d&st=cpto0rz2&dl=0"
      - question: "如何和高血壓的藥做搭配？"
        answer: "正常情況下是可以補充的，建議和藥物間隔兩小時以上服用\n\n建議美白起床和睡前空腹吃兩粒\n\n下次回診時，也可以告知醫師，目前有在補充我們家的產品，讓醫生可以全面掌握身體狀況哦"
      - question: "可以跟膠原蛋白一起吃嗎？"
        answer: "可以，因為兩個都是建議空腹食用的～一起吃效果更好喔！"
      - question: "可以早上或晚上一次吃嗎？"
        answer: "可以，但是要記得空腹食用，吃完不要馬上吃東西，至少間隔1、2小時"
      - question: "吃法"
        answer: "（若尚未表明需求）親愛的 你想要改善或是比較在意的部分是什麼呢？\n\n日常保養早或晚空腹兩粒 加強保養可以早晚空腹各2~5粒\n\n可以跟我說說看你目前你的狀況或者需求\n我來幫你評估喔😊\n\n🌟美白NMN膠囊 /抗老亮白\n建議食用方式：睡前、一起床這兩個時間都可以吃，記得一定要空腹。\n✅日常保養：早或晚空腹2顆\n✅加強保養：早晚空腹各3顆"
      - question: "黑肉底 有效嗎"
        answer: "親愛的 謝謝你詢問我的美白😊\n\n黑肉底、肌膚暗沉其實是來自\n黑色素細胞的活性比較旺盛\n比較容易受到紫外線 熬夜 壓力或糖分的刺激而啟動\n讓肌膚「偏暗 偏黃 容易沉澱」\n\n以及，身體無法代謝掉這些沉澱的色素\n沒有足夠的抗氧化力幫妳清理髒東西\n\n我們的美白錠\n從源頭幫妳「調節黑色素細胞」\n裡面的 SOD、NMN、 白藜蘆醇、葡萄籽萃取、莓果多酚等等成分 能幫妳做到\n✔️ 抑制黑色素生成訊號\n✔️ 減少自由基（熬夜壓力後的氧化傷害）\n✔️ 幫助肌膚穩定新陳代謝力"
      - question: "如果有預算考量可以一天吃一次嗎？"
        answer: "親愛的❤️\n一天吃一次沒問題喔\n\n你可以安排在早上空腹和膠原一起吃\n一天吃2~4顆\n\n那美白膠囊適合長期補充維持狀態 \n讓肌膚從內而外透亮細緻\n\n因為我們的皮膚是6週左右為一個週期 \n建議持續補充美白2~3個週期維持狀態哦！\n\n💡也提醒親愛的 夏天到了 一定要搭配防曬措施 \n才能讓美白效果更好哦💕"
      - question: "可否長期服用\n\n聽說白藜蘆醇會活化雌激素"
        answer: "哈囉親愛的❤️\n\n白藜蘆醇可以長期補充！而且它目前許多研究支持可以作為日常穩定保養的成分\n它的抗氧化力高、支援細胞修復、幫助賀爾蒙代謝\n對於女性荷爾蒙、皮膚、睡眠、抗老保養效果都很穩定\n\n白藜蘆醇屬於植物多酚\n它的作用是屬於類雌激素活性弱、選擇性調節\n意思是：\n✔ 雌激素高的人 它不會讓妳更高\n✔ 雌激素低的人 它會有輕微的支持與修復作用\n\n所以是很溫和 不會活化雌激素 不用間接服用哦\n\n姊姊的美白是可以每天吃、穩定吃的 不需要刻意停用❤️"
      - question: "請問你們NMN跟膠原蛋白飲是差在哪\n需要一起吃嗎"
        answer: "親愛的您好～\n這兩款產品其實是從不同方向幫助肌膚變得更年輕、透亮、Q彈，搭配起來效果會更快、更全面！\n\n📌 NMN美白膠囊：主攻抗老化、淡斑、亮白，裡面有白藜蘆醇、NMN、SOD、兒茶素等成分，\n幫助肌膚抗氧化、減少暗沉與細紋、延緩老化，從底層還原肌膚的光澤感。\n\n📌 膠原蛋白飲：除了高劑量膠原蛋白（日本NEO魚皮＋德國水解膠原）讓肌膚更澎潤有彈性之外，\n裡面還有15克日本膳食纖維，不只是讓肌膚更漂亮，\n還能幫助穩定血糖、增加飽足感，對於控制體重和身體代謝也有加分效果唷！\n\n為什麼建議一起吃？\n因為這兩個其實是「內外兼顧」的組合：\n✨ 美白膠囊打底抗氧化，幫助透亮、還原年輕光澤\n✨ 膠原蛋白飲負責補充彈性結構，讓肌膚澎潤、細緻有彈性\n一起搭配，效果會更完整、更快有感！\n\n吃法建議：\n🌟早上空腹吃效果最好：\n\n膠原蛋白飲：起床空腹 1 包（配 300～500cc 溫水）\n\n美白膠囊：可一起搭配服用，早晚空腹 2 顆"
      - question: "姐姐 我有買你們家的NMN\n之前市面上有一支產品 號稱是只針對抗老細胞作用的 「指向型NMN」\n說一般的NMN是對所有細胞 包括腫瘤細胞的作用 而非指針對抗老細胞\n想詢問姐姐 這個論點對你們家產品 有衝突嗎？ 謝謝您"
        answer: "妹妹\n\n我簡單來說好了，用最簡單的方式跟你說\n\n含有NMN的食物\nNMN天然存在於多種食物中\n\n常見富含NMN的食物包括\n\n\n        •        花椰菜\n        •        毛豆\n        •        酪梨\n        •        番茄\n        •        高麗菜\n        •        小黃瓜\n        •        蘑菇\n        •        牛肉\n        •        蝦子\n\n那什麼是N M N呢？\n\nNMN\n\n全名為「β-煙醯胺單核苷酸」（Nicotinamide Mononucleotide）\n是一種維生素B3（菸鹼酸）的衍生物\n\n主要功能是合成NAD+，參與人體多種代謝反應，協助將食物轉換為能量\n\nNAD+對於細胞能量產生、抗老化、維持細胞健康等有重要作用\n\n但NAD+分子過大，無法直接從食物中攝取，需透過NMN等前驅物質在體內轉換\n\n這個論點並不會對我們的產品造成衝突喔！\n\n市面上的「指向型NMN」多數為人工化學合成，主打只作用於特定老化細胞\n\n而一般NMN則是廣泛作用於全身細胞，包含健康細胞、老化細胞以及病變細胞\n\n我們家的NMN則是從天然花椰菜中萃取而成，屬於天然來源，提供全方位的抗老支持\n\n‼️而非人工化學合成，因此作用方式本來就不同，兩者各有優勢，也不會互相衝突或影響功效\n\n可以放心使用😍"
      - question: "NMN 含量問題"
        answer: "親愛的您好～謝謝您的提問🥰\n我們的美白膠囊是以天然植萃＋科學配方設計，\n✔️ 台灣專利酵母萃取 5mg（萃取而來的NMN）\n\n\n\n寶貝 姊姊的美白膠囊是以天然植萃＋科學配方設計\n含有台灣專利酵母萃取 5mg（萃取而來的NMN)\n\n哈囉親愛的💛\n\n關於詢問的含量的問題\n由於我們的產品是以複方形式製作\n每種成分的比例是經過精心設計以達到最佳配合效果\n\n所以單獨一種成分的具體劑量無法個別列出\n因為我們注重的是成分間的\n協同作用及整體效果🥹\n\n單一來源不等於效果最好\n✨ 複方搭配才是關鍵\n根據哈佛研究\nNMN搭配白藜蘆醇一起吃\n能讓體內的「青春因子NAD⁺」濃度提升超過160%\n比單吃300mg還有效 ！\n所以真正懂保養的人會選「組合」不是「單一數字」\n\n穩定吸收才是王道\n就像維他命C一樣\n吃1000mg跟吃2000mg 不代表吸收就多一倍\n吸收率、代謝方式、搭配營養素才是重點\n\n關鍵是選擇有清楚來源＋信譽好的品牌 而不是被單一詞彙限制\n\n一個好的產品\n不只是「高單一劑量」而已\n而是整體設計要考量：吸收效率、安全性、配方協同作用 和 客人的真實使用感受\n\n我們的產品絕對是經過嚴格的認證標準\n讓妹妹吃得安心又有效🥰🥰\n\n親愛的妳真的很棒 願意多問多了解\n代表妳在為自己挑選值得信任又安全的保健支持💛\n\n官方line:\n\n\n\n親愛的您好💛謝謝您的提問～\n\n我們的產品是複方配方，因此我們不會單獨列出每個成分的「毫克數」，因為我們更重視的是成分間的協同作用，以及實際的使用感受🌿\n\n以白藜蘆醇和NMN為例，根據哈佛研究指出，兩者搭配補充能讓體內的NAD⁺濃度提升超過160%，比單吃高劑量還有效！這也是我們產品設計的核心理念——重視整體效能。\n\n親愛的可以再評估看看，有需要了解更多細節，或想搭配其他保養方案，歡迎隨時問我們喔😊\n\n這邊也提供產品資訊連結讓您參考👉\n🔗 https://shengtingbio.com/nmn/"
      - question: "白藜蘆醇 含量問題"
        answer: "親愛的您好～謝謝您的提問🥰\n\n我們的美白膠囊是以天然植萃＋科學配方設計\n加拿大葡萄皮萃取 10mg（萃取而來白藜蘆醇）\n每顆含有1mg白藜蘆醇\n\n若有想要搭配加強保養效果，也可以搭配膠原蛋白或維生素C一起使用唷～"
      - question: "婦科問題\n子宮肌瘤可否食用"
        answer: "親愛的 謝謝你詢問我的美白😊\n\n我們家的產品都是天然無添加 不含雌激素 \n有子宮肌瘤的女生 可以放心吃沒問題唷❤️\n\n我們的美白膠囊配方天然且溫和 \n\n✅哈佛教授認證的配方 \n讓你從底層開始 亮白 抗老 透出自然光澤感\n🌿 加拿大葡萄皮白藜蘆醇：高效抗氧 讓肌膚更明亮\n🥦 日本專利花椰菜NMN：啟動年輕細胞修復\n\n親愛的吃我們家的產品絕對不用擔心喔😘\n姐姐公司可是得到國家品牌玉山獎的認證企業🥳🏆\n\n很開心你對我的產品有興趣\n有任何問題歡迎隨時請教我喔😊"
      - question: "沒有防曬習慣"
        answer: "寶貝，那我的美白你吃的一定會很開心\n\n裡面主要成分是花椰菜萃取的NMN\n葡萄皮萃取的白藜蘆醇\n\n放在一起抗氧化跟美白的效果非常好，因為我的比例是科學配方"
      - question: "是否能淡化曬斑\n\n痘疤"
        answer: "寶貝，我的美白\n\n裡面主要成分是花椰菜萃取的NMN\n\n葡萄皮萃取的白藜蘆醇\n\n放在一起抗氧化跟淡化曬斑的效果非常好，因為我的比例是科學配方\n\n\n所以 針對淡斑、曬斑、亮白、痘疤\n\n因為裡面有白藜蘆醇、NMN、SOD等成分\n\n可以幫助肌膚抗氧化、減少暗沉與細紋、延緩老化\n\n從底層還原肌膚的光澤感"
      - question: "可否替代防曬品"
        answer: "（已購買客）\n\n\n寶貝 美白膠囊可以幫妳抗氧化、減少黑色素生成和減少膚色不均\n\n但如果遇到強烈紫外線 還是會造成膠原蛋白流失＋曬斑沉澱\n\n所以內服＋外用都做到效果是最好的 \n\n防曬擦了 美白效果會更好更持久\n\n尤其妳的皮膚現在已經變很漂亮了 更要守住！\n\n你目前用的防曬是哪款？\n\n然後你的需求是要上妝、還是單純透明的防曬？\n\n姊姊幫你推薦適合你的😊\n\n身體的話我是用biore 輕透水凝露\n\n親愛的 臉上的防曬，有顏色的話,我目前是用Chanel的潤色滋潤\n型 或是dior有颜色\n你可以去靠櫃試用一下\n外出補防曬的,你必須用氣墊\nArmani 訂製雪紡亮白精華氣墊\n\n單純透明,開架式的話\n理膚寶水 全護極致抗油光防曬亮白乳\nUVA PRO SPF50+PA++++"
      - question: "哺乳可否吃"
        answer: "親愛的您好～謝謝您的提問🥰\n我們的美白在哺乳期間是可以安心補充的唷！\n\n特別是媽媽在哺乳期常常睡眠不足、身體疲勞、膚況不穩定，這時補充這類抗氧化、細胞修護型營養素，能夠幫助：\n✅ 穩定體力與精神\n✅ 支持皮膚代謝、亮白與均勻膚色\n✅ 調理體內抗氧化力，幫助淡化色斑\n\n🌟美白NMN膠囊 /抗老亮白\n建議食用方式：睡前、一起床這兩個時間都可以吃，記得一定要空腹。\n✅日常保養：早或晚空腹2顆\n✅加強保養：早晚空腹各3顆"
      - question: "早上和茶 咖啡 間隔多久"
        answer: "親愛的您好～謝謝您的提問🥰\n\n如果您早上是空腹補充美白膠囊，建議與茶、咖啡間隔至少1小時以上會比較好喔！這樣可以避免茶葉單寧與咖啡因影響吸收。\n\n📌 小提醒：\n☕ 咖啡不建議空腹飲用，會刺激胃酸、影響腸胃舒適度\n👉 建議搭配早餐一起喝，對身體比較溫和💛\n\n\n有其他搭配上的問題也歡迎再問我唷～😊"
      - question: "麥芽糊精"
        answer: "寶貝啊，你對麥芽糊精有深入的了解嗎\n\n保健食品（如錠劑、粉劑、膠囊）中的有效成分劑量極低\n\n直接製作會導致體積過小、不易操作，或因吸濕性高、流動性差而難以穩定生產\n\n‼️麥芽糊精作為賦形劑，能夠讓活性成分均勻分散、附著，便於壓錠、充填膠囊或包裝成粉末\n\n所以 這部分\n要考量好跟不好，是要往這個方向去想\n\n保健食品常添加麥芽糊精，主要是為了加工品質穩定\n\n麥芽糊精\n\n來源 可由多種澱粉來源製成\n\n常見有玉米、小麥、大米、木薯等\n\n所以親愛的\n\n麥芽糊精本身並無明顯危害\n重點是來源\n\n姐姐選擇的是「非基改」、「無麩質」來源的麥芽糊精\n\n經國際公認為安全（GRAS）\n正常攝取下無明顯健康風險"
