        answer: "回答"
      - question: "可以代理嗎"
        answer: "親愛的謝謝你的詢問，我的產品目前不會開放代理\n如果你對我的品牌有興趣，可以看看我的網頁喔😊\n\n網頁上有比較詳細的資訊\n謝謝你喜歡我的品牌\n\nhttps://www.yardley.tw/pages/join-as-brand-ambassador"
      - question: "電波 音波 打完多久可以用美容儀"
        answer: "親愛的～剛打完音波建議先讓皮膚休息幾天\n\n通常3～5天後等皮膚比較穩定再開始使用美容儀會比較安全哦❤️\n\n親愛的～打完鳳凰電波後建議先讓肌膚好好修復幾天\n建議至少間隔5～7天再開始使用美容儀比較安全唷😊"
      - question: "國外海外寄送"
        answer: "哈囉親愛的❤️\n\n謝謝你的詢問～ 新加坡暫時沒有開放運送哦🥺 \n我們目前只有寄送到香港及澳洲\n如果有台灣的親友 也可以幫忙代收再寄送過去唷～\n讓你參考看看💛"
      - question: "常見問題"
        answer: "回答"
      - question: "產品多快見效"
        answer: "1. 親愛的 請問你目前有什麼健康問題想要解決呢\n2. 介紹產品\n3. 效果的話 每個人的體質不一樣無法給一個準確的數據\n但大部分的客人1-2個月內就很有感囉\n現階段妳最需要的還是穩定補充足夠的營養 讓身體有能量去調整和適應哦😊"
      - question: "按摩工具：刮臉是不是要用油才能刮呢！請問用什麼油呢"
        answer: "我的工具設計非常順滑，不用油也可以輕鬆使用，效果一樣好。如果妳想增加滑順感，也可以使用手邊的乳液、精華液甚至面霜\n如果想用油的話，推薦植物油，像甜杏仁油、荷荷巴油，或者溫和的椰子油都很適合\n妳可以依照自己的習慣選擇要不要使用哦❤️😊"
      - question: "詢問 未知價格"
        answer: "哈囉親愛的，你放心會有一個很棒的折扣😊"
      - question: "怎麼購買"
        answer: "購買的話先到官網註冊會員，再記得綁定官方LINE 才不會漏接優惠訊息及重要通知唷\n\nhttps://liff.line.me/1645278921-kWRPP32q/?accountId=yardley"
      - question: "想請問按摩器具一定要搭配產品購買嗎？"
        answer: "哈囉親愛的，我沒有在販售這些按摩小物🥹\n\n這些都是隨著我每個月的保健食品給會員的組合禮物\n\n所以這部分未來你可以關注我的保健食品，如果你有喜歡的你可以下單在每個月的活動就會收到這個禮物"
      - question: "類風濕關節炎"
        answer: "親愛的～謝謝妳詢問我的產品❤️\n有類風濕性關節炎的話\n建議挑選適合的營養品來幫助抗發炎、穩定免疫反應、減少身體氧化壓力💪\n\n我們有幾款產品就很適合幫助調理這類體質👇\n\n💛 薑黃膠囊\n👉 幫助抗發炎、保護關節、舒緩早上僵硬不適\n👉 含有薑黃素＋黑胡椒＋多酚植物酵素組合\n\n🧡 蝦紅素\n👉 是超強的抗氧化劑 可以穩定免疫反應、有助於改善發炎，降低關節問題、還能保養眼睛\n\n🧬 美白膠囊（含NMN＋植萃多酚）\n👉 幫助細胞修復、穩定發炎反應、同時也讓皮膚更亮\n\n🌿 B群＋鋅＋鎂複方\n👉 幫助身體抗壓、穩情緒、支持神經與肌肉功能、減緩疲勞感\n\nhttps://shengtingbio.com/superoxide-dismutase/"
      - question: "備孕期"
        answer: "親愛的～謝謝妳詢問我的產品❤️\n\n我們家的產品在備孕期間是可以安心補充的唷\n但還是要看妳目前的身體狀態與想調整的目標是什麼\n\n備孕期的話 我會建議補充 全能Ｂ群 和 美白膠囊\n\n我等下也會傳一篇我們內部雜誌的專業資訊給妳\n\n✅ 全能Ｂ群：備孕期需要大量維生素來穩定內分泌、提升能量\n尤其是B群＋鋅＋鎂這些關鍵營養素，可以幫助妳的身體慢慢調回最佳狀態\n也建議另一半一起補充～因為男性備孕也非常需要鋅\n建議一天6顆，分兩到三餐飯後補充\n\n✅ 美白膠囊：不只是為了肌膚亮白\nNMN 對卵母細胞修復力也有幫助\n尤其年齡增加後，卵子的抗氧化能力會下降\n這時候補充 NMN 是在做“基礎修護”，讓未來好孕更順利💗\n\n✅ 薑黃膠囊 \n→ 降低三酸甘油脂\n→ 幫助加速新陳代謝，甩掉多餘脂肪\n→ 對備孕中容易疲累、水腫、或生理期不規律的女生特別有幫助\n\nhttps://www.yardley.tw/pages/mama-baby-magazine-interview\n\n全能 👉兩餐飯後 各3粒\n美白 👉 一天空腹3粒\n薑黃  👉  兩餐飯後 各2~3粒"
      - question: "備孕期\n如果客人詢問膠原"
        answer: "另外備孕期也可以開始補充膠原蛋白呦✨ \n\n我的膠原蛋白是市場首款足量添加\n一包裡面含有6克的德國專利水解膠原蛋白+日本專利「魚皮」彈性蛋白\n膳食纖維15g+膠原蛋白6000mg\n\n除了讓臉部維持水嫩保濕，還能幫助減少妊娠紋的生成！\n因為膠原蛋白能維持皮膚彈性，能大大減少因肚皮擴張帶來的不適感🥰\n\n每天早上空腹喝一包\n因為裡面有15克膳食纖維\n除了幫助肌膚補充膠原蛋白\n還可以利用膳食纖維穩定血糖❤️\n\n親愛的謝謝你詢問我的產品\n有任何問題隨時請教我哦"
      - question: "毛孔問題"
        answer: "親愛的 ❤️ 毛孔大 毛孔粗 是身體給妳的訊號\n毛孔是皮膚的「排油口」\n當它變粗、變明顯\n跟以下內在問題是息息相關的\n\n🔸油脂分泌過多 → 跟雄性荷爾蒙、B群缺乏、鋅缺乏、血糖不穩有關\n🔸膠原蛋白流失 → 毛孔周圍沒支撐力 → 拉扯變形變粗\n🔸慢性發炎＋高糖飲食 → 肌膚代謝亂、毛孔閉鎖卡垢\n🔸皮膚缺水＋角質肥厚 → 毛孔硬硬厚厚看起來就明顯"
      - question: "敏感肌 洗臉機 使用方法"
        answer: "寶貝 你的肌膚比較敏感 你幫我一週用1~2次，洗的時間不要太久\n\n泛紅敏感的部位先稍微避開清潔"
      - question: "長痘痘體質\n長大顆痘痘"
        answer: "親愛的 你痘痘都長在哪些部位呢 以及會長痘痘的情況多久了呢\n\n因為痘痘有分很多種 有內分泌型痘痘、代謝型痘痘，還是腸道型痘痘"
      - question: "內臟脂肪"
        answer: "親愛的 我想了解你內臟脂肪的狀況 \n是醫生檢查有說數值過高嗎？\n\n內臟脂肪不像皮下脂肪那麼明顯摸得到\n它是包在我們肝臟、腸道、胰臟周圍的小肚肚脂肪\n當它堆積太多時 身體就會進入慢性發炎狀態🔥\n這種發炎不會痛 但會影響荷爾蒙代謝、血糖穩定、甚至讓你很容易累、睡不好、瘦不下來"
      - question: "下巴長內包粉刺\n\n粉刺種類\n\n清潔方法"
        answer: "親愛的❤️\n\n如果容易長粉刺\n是因為荷爾蒙波動＋油脂分泌旺盛＋清潔死角的地方\n尤其熬夜、壓力大、甜食吃多、代謝循環差時\n毛孔代謝變慢\n油脂和老廢角質就卡在裡面\n慢慢就變成粉刺\n\n常見的粉刺種類有\n✔ 開放性粉刺（黑頭粉刺）\n毛孔開口露在空氣中被氧化發黑的\n\n✔ 閉鎖性粉刺（白頭粉刺／內包粉刺）\n毛孔口被皮膚蓋住 油脂和角質被困在裡面\n看起來是小小一粒但摸起來有凸起感\n也是最容易演變成發炎紅腫痘的粉刺喔\n\n建議你的日常清潔和保養都要留意\n\n🌸 1. 溫和清潔\n早晚用溫和的潔面乳洗臉\n重點是清潔T字＋下巴區但不要過度搓揉喔\n\n🌸 2. 代謝角質\n每週可以用溫和的酸類產品\n幫助毛孔代謝老廢角質\n但不用天天擦 避免過度刺激\n\n🌸 3. 保濕補水\n適度保濕可以維持皮膚屏障健康\n幫助油水平衡 讓粉刺比較不容易堆積\n\n🌸 4. 控糖＋穩定作息\n少吃甜食、少熬夜\n保持荷爾蒙和血糖穩定\n粉刺自然慢慢減少\n\n產品的部分，可以利用這兩樣調整和修復\n\n✔ 代謝錠（促進循環＋排水＋減少粉刺痘痘）\n✔ 全能膠囊（補B群C鋅鎂 調節油脂代謝＋抗發炎）\n\n修復、保養：\n✔ 美白膠囊（補充白藜蘆醇＋SOD，抗氧化＋修復痘疤）\n✔ 膠原蛋白（提升肌膚結構穩定度＋讓毛孔更緊緻平滑，含15克膳食纖維還能幫助腸道代謝 早上一包還可以利用膳食纖維穩定血糖）\n\n如果針對粉刺的話，一天要補充三次代謝錠\n\n以上是我的建議給你參考\n多喝水也會對膚況越來越好\n皮膚會慢慢變得穩定🥰\n\n親愛的 如果妳是容易長粉刺的膚質\n可以多留意是沒有以下這些習慣～\n\n🌙 熬夜、壓力大\n🍰 太常吃甜食、奶類、炸物\n💧 水喝太少、排便不順\n\n當毛孔的代謝變慢\n油脂＋老廢角質堆在一起\n久了就變成小粉刺 一顆一顆藏在臉上\n\n親愛的～\n鼻翼附近如果常常冒粉刺 \n這個位置跟腸胃還有皮脂腺相關\n\n代謝循環差時\n毛孔代謝變慢\n油脂和老廢角質就卡在裡面\n慢慢就變成小粉刺"
      - question: "長出了肝斑\n建議可以吃什麼改善"
        answer: "哈囉親愛的❤️ 謝謝你的詢問\n長肝斑不只是外表的事 其實這是身體在對妳發出訊號\n我來幫妳說明原因＋建議妳從內保養的方向唷👇\n\n肝斑是屬於混合型黑斑\n會同時受到內在賀爾蒙變動＋外在環境刺激影響\n不像曬斑那麼單純 也不是擦一點淡斑霜就能解決的問題\n\n內因性：體內賀爾蒙與壓力失衡引起\n\n像是懷孕、更年期、月經週期不穩\n這些會讓雌激素、黃體素波動\n導致黑色素生成異常\n\n再加上壓力大、熬夜、睡不好\n會讓皮膚的修復速度變慢、屏障功能變差\n變成「容易留色＋難代謝」的體質\n慢性發炎也會讓斑越來越深\n\n外因性：紫外線＋環境刺激累積傷害\n\n即使是陰天、冬天 紫外線UVA還是會穿透到真皮層\n讓皮膚長期處在「發炎＋光老化」的狀態\n這就是為什麼很多人防曬做了 但還是越來越暗沉、出斑點\n\n肝斑是混合型斑點，位置深，成因複雜 → 一定要內外一起調理\n\n外在要注意防曬、保濕、溫和保養\n內在要從「荷爾蒙代謝、抗氧化、肝臟排毒、發炎體質調理」下手\n\n飲食上也很重要 🌿 1. 每天一定要吃夠「蛋白質」\n蛋白質是皮膚修復＋黑色素代謝的關鍵\n✅ 每餐至少有一種：蛋、豆腐、雞胸肉、鮭魚、毛豆\n✅ 早餐不空腹喝咖啡 要搭蛋白質一起吃\n\n🌿 2. 加入抗氧化食物 幫助身體清黑色素\n\n✅ 綠色蔬菜（花椰菜、菠菜、秋葵）\n✅ 紫紅色蔬果（藍莓、番茄、葡萄、甜菜）\n✅ 黃色蔬果（南瓜、紅蘿蔔、木瓜）→ 含β-胡蘿蔔素 幫助亮白肌膚\n\n🌿 3. 減少促黑色素的刺激食物\n\n❌ 甜食、奶茶、精緻澱粉（白吐司、蛋糕）\n❌ 辣的、炸的、燒烤 → 會讓皮膚發炎更容易留色素\n❌ 咖啡過量 → 影響B群＋鐵吸收 會影響膚色修復力\n\n🌿 4. 固定時間進食，睡前三小時不進食\n\n賀爾蒙代謝有「作息時差」 晚上不吃東西\n身體才有餘力修復皮膚、排黑色素\n搭配睡前不滑手機 幫助妳膚況變穩又透亮\n\n建議妳吃這幾樣：\n\n✅ 美白膠囊（白藜蘆醇＋NMN＋SOD）\n→ 抗氧化、抑制黑色素生成、穩定賀爾蒙\n→ 幫助從內提亮膚色＋改善暗沉斑點\n👉 起床＋睡前空腹 各2~3粒\n\n✅ 薑黃（抗發炎＋肝臟解毒＋賀爾蒙代謝）\n→ 幫助身體清理色素廢物、穩定荷爾蒙型斑點\n👉 兩餐飯後各2～3粒\n\n✅ 膠原蛋白（修復皮膚＋養膚打底）\n→ 有效幫助皮膚代謝、亮白、保水透亮\n👉 起床空腹 1包 配500cc溫水飲用"
      - question: "手術前後保健品吃法建議"
        answer: "親愛的 術前一週建議你暫停活血類保健品\n\n包括\n ✅ 薑黃（活血＋抗發炎）\n✅ 魚油（Omega-3）\n✅ 銀杏\n✅ 納豆激酶／納豆粉\n✅ 蒜頭萃取（大蒜精）\n\n術後約7～10天，等傷口穩定再開始吃\n\n或者等醫生確認傷口收口良好、沒有出血或瘀血現象\n\n就可以開始使用薑黃來幫助消炎與修復循環囉！"
      - question: "藥盒保存"
        answer: "寶貝 姊姊的藥盒都可以放 沒有限制喔❤️\n\n但想提醒親愛的，盡量就裝當天份就好～\n\n因為如果放太多天就會比較容易受潮喔😊"
      - question: "孕媽咪組合\n\n懷孕 孕婦 推薦組合介紹"
        answer: "哈囉親愛的❤️\n恭喜妳即將迎接小寶貝的到來～\n\n懷孕期間，我會建議補充我們的全能膠囊、膠原蛋白、代謝錠和魚油\n\n待會我會傳一份我們公司雜誌上關於全能膠囊的資訊給你參考\n\n1️⃣ 在孕期期間，全能膠囊中的維生素成分非常適合懷孕的媽媽們，像是葉酸、生物素和B12等營養，對寶寶的健康發展有很大幫助💖 支持胎兒神經發育＋穩定媽媽情緒＋幫助睡眠與代謝\n\n2️⃣ 再來，也可以補充膠原蛋白，不僅能提供美容保濕效果，還能幫助減少妊娠紋的生成，維持皮膚彈性！同時增加飽足感＋順暢排便\n\n3️⃣ 代謝錠（檸檬酸 蘋果酸 琥珀酸）：天然水果萃取三大酸 幫助腸胃蠕動\n如果身體比較浮腫，可以透過代謝錠幫助代謝水分、減少水腫\n預防便秘＋消水腫＋幫助 能量代謝不疲勞\n\n4️⃣ 最後，魚油\n✔ 補充Omega-3對胎兒腦部與視網膜發育非常重要\n✔ 還能幫助媽媽穩定情緒＋減少孕期發炎指數\n\n可以針對你的需求去做選擇\n\n這些都是天然無添加 媽媽可以安心吃～"
      - question: "懷孕 可否吃薑黃＋美白"
        answer: "親愛的，寶寶還不需要像 NMN 這類的營養成份\n美白的保養，建議可以等到坐月子之後再開始補充～\n\n而薑黃雖然有助於燃燒脂肪，但因為懷孕期間其實是需要一些脂肪來保護你和寶寶的，所以薑黃也建議等產後再補比較適合唷！\n\n姊姊會建議現在我們要把錢花在刀口上，代謝錠可以讓懷孕期間的水腫情況改善，還有補充媽媽和寶寶都需要營養的「全能膠囊」\n，以及幫助維持皮膚彈性，減少妊娠紋的「膠原蛋白」"
      - question: "更年期"
        answer: "親愛的～謝謝妳的詢問❤️\n我等等會傳一篇文章給妳參考 裡面會更完整講到妳的狀況和營養補充方向\n\n接近更年期的階段\n日常一定要注意這幾個關鍵：\n✅ 足夠的B群、維生素D、蛋白質、魚油omega-3、鈣、薑黃及抗氧化物\n✅ 均衡飲食＋規律運動\n\n如果妳本身沒有特別水腫\n那就不一定需要每天補代謝錠\n但我非常建議妳加入薑黃\n因為它能改善體脂肪、照顧子宮、調養卵巢\n也對肝臟很有幫助 對抗痠痛、口臭、睡不好都很有感✨\n\n我會建議你補充以下\n\n✅ 全能B群膠囊＋Ｃ鋅鎂\n👉 補回流失的B群、維生素C、鋅、鎂\n👉 幫助神經穩定、睡眠變好、頭髮生長、皮膚修復\n👉 適合長期壓力大、飲食不均、晚睡族\n\n✅ 膠原蛋白飲\n👉 含15g水溶性膳食纖維＋6000mg德日雙膠原\n👉 幫助腸道蠕動、膚況透亮、睡得更好\n👉 改善細紋、代謝慢、腸胃卡卡的人\n\n✅ 薑黃膠囊\n👉 內含五大護肝成分＋黑胡椒提升吸收率\n👉 對抗熬夜、體脂高、體力差、起床口苦口臭\n👉 更年期前後最需要照顧肝＋子宮的配方\n\n✅ 美白膠囊\n👉 專門針對粒線體老化打底的抗氧化設計\n👉 加入白藜蘆醇＋NMN＋橙皮素＋SOD\n👉 能改善暗沉、痘疤、黑眼圈 讓皮膚亮、透、白\n\nhttps://shengtingbio.com/osteoporosis/\n\nhttps://shengtingbio.com/strategies-to-prevent-heart-disease/\n\n這兩份我們公司雜誌提供關於更年期照顧心血管和預防骨質疏鬆的資訊分享給你參考唷\n\n薑黃可以爲骨骼及關節提供良好環境，間接有助骨骼健康 預防骨質疏鬆和心血管"
      - question: "糖尿病"
        answer: "寶貝 我會建議這三樣一起搭配吃\n從根本幫他穩血糖、降糖化、抗發炎\n\n🌿 魚油\n裡面的Omega-3\n能幫助身體對胰島素的敏感度變好\n改善糖化、穩定血糖不飆升\n也能減少脂肪囤積在肚子腰側這些地方\n\n🌸 再來補充膠原蛋白 \n早上空腹1包＋500cc水\n除了幫肌膚補充彈性\n還有加進15克的高膳食纖維\n能延緩血糖上升速度＋幫助腸道代謝\n\n清纖粉（預計7/22上市，餐前吃）\n👉 如果他常吃外食、大餐、油膩的\n這款可以放在飯前阻斷糖分與油脂吸收\n主要目的是減少身體體吸收澱粉\n進而穩定血糖\n還有幫助糖分燃燒"
      - question: "子宮肌瘤等問題"
        answer: "寶貝們\n\n關於\n「吃膠原蛋白可能會增加致癌風險？」\n\n很多長期有在補充膠原蛋白的妹妹\n都開始有點緊張\n\n我想跟親愛的好好說清楚\n\n我也順便引用這一段\n\n是榮總婦產科女醫生她拍的影片唷\n\n先說一個很重要的觀念\n\n膠原蛋白本質就是蛋白質\n\n當我們喝進去之後\n其實會被消化分解成\n「胺基酸」與「小分子胜肽」\n\n‼️那我的膠原蛋白已經就是分子的胜肽\n\n而這些大分子的胺基酸\n其實每天都存在於我們的飲食中\n\n\n魚\n雞肉\n豬肉\n豆類\n\n這些食物裡面\n本來就有胺基酸\n\n而且\n‼️‼️目前的科學研究\n並沒有證據證明膠原蛋白會致癌\n\nhttps://www.threads.com/@urogynecologist_drhsieh/post/DTHMFEfkQe6?xmt=AQF0r9EgwPAom2hJ1U8QklnRIp_lJlQ5FCRYA5tBJVMqv8S3updHwGEiTKITCkt9LjiITVCq&slof=1\n\n因為 膠原蛋白本身其實是很單純的蛋白質來源\n\n正不會影響荷爾蒙\n\n真正需要注意的是什麼？\n\n所以親愛的何謂雌激素\n\n✔ 蜂王乳\n✔ 胎盤素\n✔ 大豆異黃酮\n\n這些成分本身就和 荷爾蒙調節有關\n\n那有些人就需要依照自己的身體狀況評估\n\n首先\n\n在針對寶貝說的\n\n我唷先一個一個幫你釐清\n\n👉 膠原蛋白\n👉 NMN＋白藜蘆醇\n👉 薑黃\n\n這幾個本身\n\n👉 都不是荷爾蒙\n👉 也不是直接補雌激素的東西\n\n植物雌激素\n\n主要會出現在\n像是「大豆異黃酮」這一類\n\n但你買我的這幾個產品\n是沒有這一類成分的"
      - question: "膠原蛋白會不會子宮肌瘤"
        answer: "https://www.threads.com/@prof.jeng/post/DZM0UzIE2X9?xmt=AQG09PtmpAPvjGB9DUf7TmMvTeV63JVppErkvWsdB44IqoK9KJl_4kmRjsOaIvutFJMpXQFx&slof=1"
