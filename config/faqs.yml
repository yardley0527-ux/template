      - question: "這款膠原蛋白孕婦可以食用嗎？\n\n\"妊娠紋\n肥胖紋\""
        answer: "我們這款膠原蛋白孕婦是可以安心食用的喔！\n從孕期初期就可以開始補充膠原蛋白，不僅能提供美容保濕效果，還能幫助減少妊娠紋的生成\n膠原蛋白還有助於維持肚皮的彈性，減少因皮膚擴張帶來的不適\n除此之外，很多媽媽會擔心產後胸部失去彈性\n我們的日本專利彈力蛋白，可以幫助上胸有彈性喔😊"
      - question: "一天吃一包 ?"
        answer: "一天就只要吃一包 足夠讓你皮膚變漂亮了\n不需要吃到兩包喔\n因為裡面有6000mg膠原蛋白＋15g膳食纖維，\n如果你吃其他牌子可能要吃到2包膠原、3包膳食纖維\n但我們配方很足量，一天一包就夠了\n我們還有獨家的豐胸、長頭髮專利🔥\n讓你變美、變瘦的同時，不用擔心瘦到胸部💓"
      - question: "味道"
        answer: "寶貝我們的膠原無色無味、姐姐沒有調味\n我們用的是最高成本的魚皮膠原蛋白\n本身就沒幾乎沒味道\n🎯給你最自然的進去身體穩定血糖\n這就是最天然的味道喔，你可以泡進水裡直接吞下去\n記得搭配500cc的常溫水效果最好呦😊"
      - question: "只配水 喝不下去"
        answer: "親愛的 因為早上起床本來就要喝一杯水 所以會建議早上空腹順便配水喝\n\n那如果你喝不下去，基本上常溫 不含糖的飲品都沒問題唷\n\n這款膠原蛋白採用日本專利NEO配方，分子量<2200 Da 超好吸收，\n不需特別搭配維他命C即可全面滋養～\n當然，如果你想額外補充綜合維他命，當然也沒問題～😊"
      - question: "很多人說膠原蛋白要搭配Ｃ才能發揮最大功效，\n這個需要嗎？"
        answer: "姊姊的膠原蛋白採用日本專利NEO配方，分子量<2200 Da 超好吸收，\n不需特別搭配維他命C即可全面滋養～\n當然，如果親愛的想額外加強吸收，可以搭配我的全能膠囊😊\n\n親愛的我們的膠原蛋白有魚皮彈力蛋白+水解膠原蛋白❤️‍🔥\n給你彈性支撐以外還幫你填補之間的空隙\n不用另外補充維他命c也非常有效果唷💓\n（膠原結構圖）"
      - question: "有沒有維他命Ｃ"
        answer: "寶貝沒有維他命Ｃ  因為搭配平常的食物就有維他命C的合成，再加上我們的全能膠囊裡面有維他命C 所以膠原蛋白要輔助我們的會員在美麗保養上面廣升級😊"
      - question: "請問有濕疹可以吃嗎"
        answer: "保水度提升 建議搭配薑黃😊"
      - question: "新產品膠原蛋白是素的嗎"
        answer: "膠原蛋白都是動物性的膠原蛋白🥹\n植物性膠原蛋白實際上是一個 市場行銷名詞，\n而不是真正的科學術語。\n膠原蛋白只存在於動物體內！\n大部分聲稱”植物性膠原蛋白“都是從某些植物提取出多醣類成分（像蘆薈多醣、海藻膠），\n結構上跟膠原蛋白完全不同。"
      - question: "膠原蛋白有含雌激素嗎？"
        answer: "親愛的 謝謝你詢問我的膠原蛋白😊\n膠原蛋白是從魚皮或魚鱗等動物組織中提取的結構性蛋白質，本身不含雌激素\n因為其分子結構與雌激素無關\n\n此外，魚膠原蛋白通常來源純淨，較不易受到激素污染\n若產品未添加其他含激素的成分，例如蜂王乳或大豆異黃酮，\n則不會影響內分泌系統或雌激素水平\n因此，選擇純膠原蛋白產品即可避免相關風險\n\n親愛的吃我們家的產品絕對不用擔心喔😘\n姐姐公司可是得到國家品牌玉山獎的認證企業🥳🏆\n\n很開心你對我的產品有興趣\n有任何問題歡迎隨時請教我喔😊"
      - question: "膠原蛋白是否有添加荷爾蒙 \n\n有子宮肌瘤可以吃嗎?\n有子宮肌瘤的女生\n\n有囊腫可以吃嗎？\n有囊腫的女生"
        answer: "親愛的 謝謝你詢問我的膠原蛋白😊\n\n我們家的產品都是天然無添加 不含雌激素 \n有子宮肌瘤的女生 可以放心吃沒問題唷❤️\n\n那這邊跟你說明\n膠原蛋白本身是天然的蛋白質，主要由氨基酸組成\n而賀爾蒙 雌激素是屬於醇或酮類，這是兩種完全不同的物質\n\n膠原蛋白的結構 是由 三股螺旋組成，再切割成小分子的胜肽\n這個過程中 完全不含任何激素或賀爾蒙成分\n\n一般來說 會影響女性荷爾蒙的成分 有這幾種：\n✔ 植物性雌激素（像是：大豆異黃酮、紅花苜蓿、野葛根）\n✔ 活性類似賀爾蒙的草本成分（像是：當歸、白芍、人參）\n\n我的膠原蛋白是從魚皮萃取的的結構性蛋白質 是市場首款足量添加\n一包裡面含有6克的德國專利水解膠原蛋白+日本專利「魚皮」彈性蛋白\n膳食纖維15g+膠原蛋白6000mg，本身不含雌激素\n\n所以，選擇純膠原蛋白產品 就可以避免相關風險喔！\n\n親愛的吃我們家的產品絕對不用擔心喔😘\n姐姐公司可是得到國家品牌玉山獎的認證企業🥳🏆\n\n很開心你對我的產品有興趣\n有任何問題歡迎隨時請教我喔😊\n\n親愛的 這邊的圖卡分享給你\n\n放心吃🔥🔥😘\n\n這邊也額外跟親愛的分享，潛在會影響到荷爾蒙或造成假性雌激素堆積的\n是我們每天吃進去的加工品或環境賀爾蒙來源：\n\n❌ 塑膠杯、外帶便當盒（含環境荷爾蒙雙酚A）\n❌ 豆漿類每天喝過量（尤其是非發酵豆製品）\n❌ 零食餅乾、速食（含反式脂肪、人工香料）\n❌ 飲料含糖＋添加物，影響肝臟代謝賀爾蒙\n❌ 含激素的肉品來源不明（像三層肉、進口雞翅）\n\n同時也要留意長期累積的飲食和生活型態 對身體的影響\n保健品反而是幫我們修補、代謝、穩定的食物💛"
      - question: "膠原蛋白50歲以上是否適合補充"
        answer: "親愛的～謝謝你詢問我的膠原蛋白😊\n 我的膠原蛋白很適合50+補充✨\n\n到了50歲之後，膠原流失速度會加快一倍以上\n尤其在更年期前後\n如果有以下狀況\n🔸 皮膚鬆垮乾燥\n🔸 骨質變疏鬆\n🔸 關節痠軟、筋骨卡卡\n🔸 甚至連眼睛乾澀、頻尿\n其實都跟膠原蛋白有關！\n\n不只是為了皮膚或關節好\n最重要的是👉 裡面有添加15g 日本專利水溶性膳食纖維\n對有血糖問題、代謝慢、排便不順的人來說很重要💛\n\n一包裡面含有6克的德國專利水解膠原蛋白+日本專利「魚皮」彈性蛋白\n膳食纖維15g+膠原蛋白6000mg\n\n✔️ 幫助穩定飯後血糖\n✔️ 減少糖分吸收過快的波動\n✔️ 溫和刺激腸道蠕動、改善便祕\n✔️ 同時補膠原蛋白～照顧皮膚、關節、骨本\n\n💡尤其對於吃飯偏軟、蔬菜吃得少\n這一包剛好補回「日常缺的纖維＋蛋白質」✨\n\n我們的膠原蛋白無色無味\n每天早上喝一包 搭配300~500cc的常溫水\n皮膚亮、腸道順、代謝更好👍\n\n（問需求、傳介紹文、賣場連結）"
      - question: "金絲燕窩是有什麼功效"
        answer: "金絲燕窩裡面的燕窩酸是目前研究發現對「皮膚、免疫、修復力」非常重要的生物活性成分\n\n尤其在我們的配方中，是選用日本專利金絲燕窩＋高活性濃縮技術\n\n功效包括：\n\n✔ 提升肌膚防禦力：保護表皮屏障、讓肌膚穩定不容易過敏發炎\n✔ 促進膠原蛋白吸收與再生：搭配我們小分子膠原，幫助更有彈性更澎\n✔ 提高修復速度：針對皮膚乾燥、泛紅、術後肌膚或夜貓族膚況超有感\n✔ 溫和養顏、無激素性影響：適合長期保養、連孕產期也能安心吃\n\n簡單說膠原蛋白是「建材」\n金絲燕窩是「加速修護＋保護建材不流失」的天然守護力\n\n兩者相輔相成哦"
      - question: "加到水裡"
        answer: "哈囉親愛的❤️ 謝謝你詢問我的膠原蛋白～\n\n空腹吃膠原蛋白吸收效果最好❤️\n剛起床的時候胃內胃酸濃度高，可快速分解膠原蛋白成小分子胺基酸，且無其他食物干擾，有助於更高效吸收\n另外，膠原蛋白的吸收需依賴小腸壁運輸蛋白進行主動運輸\n空腹狀態下競爭減少，吸收效率更佳\n搭配燕窩促進膠原蛋白合成\n\n所以姐姐的想法是反正我們早上起床跟晚上睡前都要喝一杯水\n因為你不可能起來就喝飲料\n所以你就是把我們的膠原蛋白粉倒進水裡面，他是無色無味一杯\n膳食纖維15克還有6000mg膠原蛋白的仙女水\n\n倒進其他飲品不是不行\n如果能夠空腹喝是最棒\n而且我的特殊專利無色無味\n建議妹妹可以倒進常溫水裡喝喔😊\n\n寶貝～空腹喝水＋膠原蛋白吸收效果最好❤️\n姐姐的想法是反正我們早上起床跟晚上睡前都要喝一杯水\n因為你不可能起來就喝飲料\n所以你可以建議他把膠原蛋白粉倒進水裡面\n\n倒進其他飲品不是不行\n如果能夠空腹喝是最棒\n建議妹妹的朋友可以倒進常溫水裡喝喔😊\n\n偶爾如果還是想到進飲品試試看的話，不建議含糖的哦  容易糖化影響膠原蛋白效果"
      - question: "會長痘痘嗎"
        answer: "親愛的 謝謝你詢問我的膠原蛋白😊\n\n我們家的產品都是天然無添加 \n不用擔心會長痘痘 可以放心吃沒問題唷❤️\n\n那這邊跟你說明\n膠原蛋白本身是天然的蛋白質，主要由氨基酸組成\n\n膠原蛋白的結構 是由 三股螺旋組成，再切割成小分子的胜肽\n這個過程中 完全不含任何激素或賀爾蒙成分\n\n不會影響我們的荷爾蒙\n所以就不會長痘痘哦！\n\n那姊姊的膠原蛋白是從魚皮萃取的的結構性蛋白質 是市場首款足量添加\n一包裡面含有6克的德國專利水解膠原蛋白+日本專利「魚皮」彈性蛋白\n膳食纖維15g+膠原蛋白6000mg，本身不含雌激素\n\n所以，選擇純膠原蛋白產品 就可以避免相關風險喔！\n\n親愛的吃我們家的產品絕對不用擔心喔😘\n姐姐公司可是得到國家品牌玉山獎的認證企業🥳🏆\n\n很開心你對我的產品有興趣\n有任何問題歡迎隨時請教我喔😊\n\n親愛的 這邊的圖卡分享給你\n\n放心吃🔥🔥😘"
      - question: "可否改善肥胖紋\n可否改善妊娠紋"
        answer: "寶貝會改善的\n因為妊娠紋的形成\n就是膠原蛋白跟彈性纖維被撐破了\n\n這就是為什麼孕媽咪在懷孕初期就要補膠原蛋白\n去減少孕媽咪妊娠紋生成\n還能幫助肚皮比較不會乾癢或裂開\n\n補充膠原會讓皮膚比較緊實 紋路也會比較淡哦！"
      - question: "彈力蛋白含量"
        answer: "寶貝妳好～\n\n姐姐在這裡跟妳仔細說明一下，讓妳吃得安心也更清楚我們家的膠原蛋白到底多厲害❤️\n\n因為太有效了，所以很多妹妹也很好奇\n\n苼莛生技所使用的膠原蛋白，是來自日本專利的 NEO魚皮膠原蛋白，它並不是一般市面上的膠原蛋白\n\n而是透過嚴選「昂貴魚種的魚皮來源」所萃取\n\n✅ 通過日本JIS及國際ISO雙重認證\n✅ 符合JHFA（日本營養食品協會）標準\n✅ 富含Desmosine與Isodesmosine（也就是鎖鏈素與異鎖鏈素）\n\n這些是彈性蛋白中特有的胺基酸結構，是維持皮膚彈性與韌性的關鍵元素！\n\n很多妹妹會問：「這樣到底有幾毫克的彈力蛋白？」\n\n其實我們的配方設計邏輯和傳統數字不同～\n我們不是單純在補充『彈力蛋白』的毫克數\n\n而是透過 NEO專利膠原胜肽 來 刺激妳自己體內的彈力蛋白生成與活化\n\n這種方式不只是補進去，而是啟動妳皮膚自己的修復能力\n\n\n🌟關鍵就在於內含的「膠原胜肽」能促進身體中 LOX（Lysyl Oxidase，鎖鏈素） 的生成，進而加強 tropoelastin 的交聯，讓整個彈性蛋白網絡更緊實、有彈性\n\n這也是為什麼吃我們的膠原蛋白，很多妹妹會發現：\n✅ 皮膚變得更Q、更有彈性\n✅ 胸部線條感覺更飽滿\n✅ 整體緊實感明顯提升\n\n因為這款NEO膠原蛋白，是選用「鰹魚的大動脈球」部位，這個部位是極少數天然富含高彈性蛋白的來源！\n\n再加上我們的魚皮膠原蛋白本身：\n        •        分子量更小 → 更好吸收\n        •        幾乎沒有魚腥味 → 更順口\n        •        是從魚皮（非魚鱗、非陸地動物）萃取 → 更純淨\n\n所以與其說「含多少毫克的彈力蛋白」，更正確的說法是：\n\n我們的膠原蛋白是設計來「啟動妳體內彈力蛋白」的生成與活化。\n\n👉 吃進去的不是死的數字，而是有活性的修復能力！\n\n而且我們在日本也有豐胸與彈力改善的專利實驗數據佐證，顯示這樣的配方結構，對於肌膚彈性與緊實度的提升，是有明確效果的！\n\n這個也提供給妹妹看\n\n因為謝謝你吃了別人又想到我\n\n單價高是因為裡面還有15克\n日本專利水溶性膳食纖維\n\n幾乎跟一個膳食纖維代餐包一樣\n\n所以寶貝\n妳不用擔心我們的膠原蛋白有沒有「加進去」彈力蛋白，因為我們的膠原胜肽本身就有能力「喚醒」身體自然生成彈力蛋白，效果比直接補充還要更有感、更有效！\n\n吃得安心、吸收得快、變化明顯，這就是姐姐這麼驕傲推薦這款膠原蛋白的原因❤️\n\n而且更得到世界品質標章的金獎"
      - question: "脹氣反應"
        answer: "親愛的 \n比較有可能是豆製品或者奶類製品導致 \n當然你進食的速度也會影響哦\n吃太快、沒咬夠、邊吃邊說話 也會脹氣\n水喝不夠 也會造成脹氣\n\n妳可以試試把豆漿 優格減少\n或者豆漿要微波加熱後再喝\n這樣比較不容易刺激腸胃 也比較不會脹氣❤️\n\n如果常常會脹氣\n建議可以加入代謝錠 起床空腹和膠原一起吃 \n或者放飯後吃 一天三次 一次五顆 \n幫助你代謝掉多餘廢氣和水腫 \n幫助你正常上廁所 不腹瀉"
  - name: "蝦紅素"
    faqs:
      - question: "$ 價錢"
        answer: "親愛的，我的蝦紅素 \n一盒有60顆\n一瓶可以吃一個月\n價錢是1899\n\n我們現在也有信用卡以及無卡 3期/6期利率全部我們吸收 🔥\n\n圖卡給親愛的參考❤️ 有其他問題隨時請教我😊\n\nhttps://www.dropbox.com/scl/fi/p12ko7gq97juvkf4sz6k6/2-100.jpg?rlkey=t9ifl65tzlkkxyj0a976ydb9d&st=cpto0rz2&dl=0"
      - question: "成人建議吃法"
        answer: "專利蝦紅素+三重花青素+維生素AE晶亮膠囊\n\n 建議食用方式：\n✅ 基礎防護-每日早餐或午餐後 2顆，搭配含好油脂的食物（如堅果、酪梨、橄欖油）吸收效果更佳！\n適用對象：上班族基礎保養/學生課業用眼/輕度3C使用者\n\n✅進階防護-每日早餐或午餐後一次食用4顆\n適用對象：隱形眼鏡族群/重度數位工作者/已出現不適症狀者\n\n如果眼睛已經很不舒服，你收到蝦紅素前幾天先吃4顆\n等狀況穩定，有改善之後再調整為2顆作為日常保養😊\n－－－－－－－－－\n\n如果眼睛已經很不舒服，有疲勞、乾癢酸澀等問題，你收到蝦紅素前幾天先吃3~4顆\n等狀況穩定，有改善之後再調整為2顆作為日常保養😊\n\n可以放在第一餐飯後一次吃完❤️\n\n謝謝親愛的支持～\n\n等你回來告訴我你的感覺喔 😘\n\n親愛的 如果是平常保養的話，每天吃2顆就可以了\n如果偶爾眼睛比較乾、酸、疲勞嚴重的話\n可以短期內先吃到4顆，等穩定後再回到2顆保養❤️"
      - question: "有在吃葉黃素的人\n\n\n平常有補充葉黃素的話 還可以繼續補充嗎"
        answer: "哈囉親愛的 謝謝你的詢問❤️ \n想了解妳目前的眼睛的狀況以及想要改善的需求是什麼呢？\n是預防視力退化 還是因為眼睛常常痠澀疲勞呢？\n家族是否有黃斑部病變、白內障的病史？\n可以跟我分享一下你的狀況 給你更精準的建議哦🫶🏻😊\n\n如果你家族裡有人有黃斑部病變、白內障的病史\n葉黃素可以繼續補充\n搭配蝦紅素一起吃，可以更加全面照顧眼睛\n\n但如果妳是平常用眼比較多\n像是看電腦、手機、開車看不清楚、眼睛常常乾乾的\n那蝦紅素就很足夠囉～因為它能直接放鬆睫狀肌\n幫助對焦清晰、舒緩眼壓和疲勞💕\n\n哈囉親愛的 謝謝你的詢問❤️ 其實葉黃素主要是針對黃斑部退化的問題 比較適合年長者 或 已經有黃斑部病變風險的人\n\n但如果 你現在眼睛只是容易乾澀、疲勞、對焦不清楚 那 真正需要補充的其實是蝦紅素哦！\n\n蝦紅素 比葉黃素更適合 長時間用眼、用3C多、容易眼睛痠澀疲勞的人 因為我的眼睛產品能夠 穿透視網膜 幫助睫狀肌放鬆 3-5天就會有感\n\n葉黃素適合保護黃斑部 如果你家族 有人有白內障 或者是網膜病變 可以補充葉黃素當作預防保養，但沒有黃斑部退化風險的人 建議補充蝦紅素 才能真正解決眼睛乾澀 酸 問題！\n\n另外，這類產品一定要選擇軟膠囊的 才能發揮最大效果😊\n\nhttps://shengtingbio.com/cataract/"
      - question: "本身已經有黃斑部病變了\n新產品對眼睛還有改善的效果嗎"
        answer: "親愛的 謝謝你的詢問～ 蝦紅素的核心優勢是「穿透視網膜屏障」，幫助抗氧化、減少視網膜發炎，這對 眼睛疲勞、乾澀、視覺對焦不清 的人特別有幫助。而且，蝦紅素也能減少 視網膜細胞的氧化壓力，在某種程度上保護黃斑部\n\n但如果已經確診黃斑部病變，建議需要搭配 葉黃素+DHA（魚油） 來提供更完整的保護，因為葉黃素主要是黃斑部的「濾藍光+抗氧化防護層」，DHA則能維持視網膜細胞的流動性與健康。\n\n所以如果你的眼睛 只是容易疲勞、對焦不清楚、乾澀，這款蝦紅素很有效✨ 但如果已經確診病變，建議 蝦紅素+葉黃素+DHA 一起搭配，才能更完整保護眼睛哦😊"
      - question: "小朋友可以吃嗎？\n建議吃法"
        answer: "小朋友可以吃 小朋友除非近視，不然不用特意補充哦😊\n\n親愛的，謝謝你詢問我的蝦紅素\n\n小朋友的話，我會建議一天一顆就好，而且記得要飯後吃，因為蝦紅素是脂溶性的，飯後吃才會吸收比較好😘\n\n如果你們家小朋友是比較偶爾才用眼睛很累（像寫功課或打電動時間不多），也可以改成隔天吃一顆就好喔\n\n但如果有長時間用平板或電腦寫作業，眼睛真的有比較吃力的話，每天一顆當保養❤️\n\n有任何問題都歡迎隨時請教我喔\n\n也跟親愛的說明\n蝦紅素對小朋友的眼睛健康有以下益處：\n\n 1.        抗氧化與抗發炎：蝦紅素能清除自由基，減少視網膜與黃斑部的氧化壓力，預防因藍光和紫外線造成的傷害\n\n2.        改善眼睛疲勞與乾眼症狀：研究顯示，蝦紅素可緩解長時間使用3C產品導致的睫狀肌僵硬與眼睛疲勞，並提升對焦調節力\n\n3.        促進微血管循環：蝦紅素可增加眼睛脈絡膜的血流，有助於維持視力健康"
      - question: "小朋友近視到400度 可以吃蝦紅素嗎"
        answer: "小朋友可以吃蝦紅素唷～\n如果小朋友有近視的狀況 特別是已經到400度\n會建議可以開始幫他補充保護眼睛的營養\n像蝦紅素這類抗氧化成分對眼睛很溫和也很有幫助✨\n\n建議在早餐或午餐後吃2顆就好 持續保養下來 對眼睛乾澀、疲勞和保護視網膜都有幫助😊"
      - question: "8歲小朋友 乾癢問題"
        answer: "如果她眼睛容易乾癢不舒服\n那可以讓她吃看看蝦紅素唷\n\n有助於保護視網膜、減少乾澀、提升眼睛的抗氧化力\n\n建議可以白天飯後吃一顆\n吃個一兩週看看\n如果她覺得眼睛比較不容易癢癢的 就可以繼續穩定保養唷😊"
      - question: "三酸 高血脂"
        answer: "姊姊的蝦紅素 可以降低血中三酸甘油脂 ＆減緩發炎反應和氧化壓力 以及心血管健康😊"
      - question: "全素可食嗎？"
        answer: "成分都是來自天然紅球藻萃取 是全素來源～\n\n但外層膠囊是動物性明膠製作\n如果你吃的是「全素」的話 建議咬開或剪開膠囊吃裡面的營養油哦😊\n那姊姊也很推薦素食者補充蝦紅素 對眼睛 皮膚 血管抗氧化都很棒 是少數素食者能補到的脂溶性抗氧化劑唷❤️"
      - question: "甲狀腺結節可以吃嗎"
        answer: "姊姊的蝦紅素是天然紅球藻萃取是植物來源的蝦紅素！不含碘、不刺激甲狀腺🙌所以對有甲狀腺結節的人來說 反而可以幫助「抗氧化＋減少發炎刺激」😊"
      - question: "會有過敏問題嗎？"
        answer: "親愛的謝謝你的詢問💛 \n我們的蝦紅素來自德國專利紅藻萃取 不是來自蝦子哦！\n使用的是Haematococcus pluvialis雨生紅球藻 \n完全純素🌿\n\n如果你對蝦類過敏 這款是可以安心補充的😊\n\n親愛的 你想要改善或是比較在意的部分是什麼呢？\n可以跟我說說看你目前你的狀況或者需求\n我來幫你評估😊"
      - question: "晚餐後吃會效果一樣嗎？"
        answer: "哈囉親愛的❤️\n晚上飯後吃也可以沒問題喲 效果是一樣的～\n\n會建議放在白天飯後補充\n是因為下午是眼睛最容易疲勞的時候\n白天補一點進去 眼睛比較舒服\n整個人也比較有精神不會累累的😌"
      - question: "眼睛雷射"
        answer: "哈囉親愛的～\n像姐姐之前在直播跟限動裡一直跟大家說的\n葉黃素主要是照顧視網膜表層細胞和黃斑部\n\n但你剛做完眼睛手術 更需要的是\n照顧水晶體、玻璃體、甚至角膜到視網膜整體的修護\n這時候就建議葉黃素＋蝦紅素一起補充會比較完整\n\n✨葉黃素建議你一天補到 10mg\n✨我們家的蝦紅素兩顆就有 4mg\n你剛術後 建議可以吃到3~4顆 讓修復更到位\n等狀況穩定，有改善之後再調整為2顆作為日常保養😊\n\n可以試著補充看看 相信對你真的會很有幫助的💕\n有任何問題也都可以問我唷😊\n\n傳送圖卡\n1) https://www.dropbox.com/scl/fi/1csb1e657tn7dop50pslj/8.jpg?rlkey=69lvnkb4bqjskdqagb88clp34&st=huzgidv3&dl=0 \n\n2) https://www.dropbox.com/scl/fi/t6nvo82ipwo7570auu88t/11.png?rlkey=wnwta0lzf0irtg8tlcsai63m4&st=sdkc0c73&dl=0"
      - question: "需要補充「蝦紅素」症狀：\n\n飛蚊症、\n眼壓高、\n用眼疲勞、\nhttps://shengtingbio.com/4-major-benefits-of-astaxanthin/ \n3C族群、\nhttps://shengtingbio.com/astaxanthin-and-anthocyanidin/ \n青光眼、\n乾眼症。\nhttps://shengtingbio.com/dry-eye-syndrome/ \n\n緋聞"
        answer: "哈囉親愛的❤️\n長期用眼、長期戴隱眼、3C族群、乾眼、飛蚊症、眼壓偏高、疲勞型等問題\n\n這些都屬於 氧化壓力太高 和 眼睛微循環不良\n\n像姐姐之前在直播跟限動裡一直跟大家說的\n葉黃素主要是照顧視網膜表層細胞和黃斑部\n\n但你眼睛現在已經有明顯的不適症狀\n\n你需要的是照顧水晶體、玻璃體、甚至角膜到視網膜整體的修護\n\n如果你手邊有葉黃素 可以兩款一起吃\n✔️ 葉黃素建議你一天補到 10mg\n✔️ 我們家的蝦紅素兩顆就有 4mg\n\n如果已經眼睛很不舒服，你收到蝦紅素前幾天先吃4顆\n等狀況穩定，有改善之後再調整為2顆作為日常保養😊\n\n傳送圖卡\n1) https://www.dropbox.com/scl/fi/1csb1e657tn7dop50pslj/8.jpg?rlkey=69lvnkb4bqjskdqagb88clp34&st=huzgidv3&dl=0 \n\n2) https://www.dropbox.com/scl/fi/t6nvo82ipwo7570auu88t/11.png?rlkey=wnwta0lzf0irtg8tlcsai63m4&st=sdkc0c73&dl=0\n\n圖卡分享給妹妹更了解❤️"
      - question: "需要補充「葉黃素＋蝦紅素」症狀：\n\n版本一：白內障\nhttps://shengtingbio.com/cataract/ \n版本二：夜間視力下降\n版本三：老化性眼睛退化"
        answer: "哈囉親愛的❤️\n如果是家中長輩有白內障的問題\n建議補充「葉黃素＋蝦紅素」幫助減緩惡化、保養眼睛晶體喔！\n\n白內障主要是水晶體因為氧化、老化而混濁，會讓視力變模糊、怕光、對比度變差\n這時候光靠葉黃素是不夠的\n\n像姐姐之前在直播跟限動裡一直跟大家說的\n葉黃素主要是照顧視網膜表層細胞和黃斑部\n\n而蝦紅素是目前公認眼睛抗氧化力最強的營養素之一\n能幫助保護水晶體、玻璃體、視網膜微血管循環，對白內障這類問題很重要！\n\n建議搭配兩種營養素一起補充\n✔️ 葉黃素建議你一天補到10mg\n✔️ 我們家的蝦紅素兩顆就有 4mg\n\n建議家長收到蝦紅素後吃4顆作為日常保養😊\n\n替換左邊紅色的部分\n\n版本二：夜間視力下降\n如果是家人或自己有出現夜間視力變差、開車時看不清楚、怕光或對比度變低的情況，這通常跟視網膜退化、氧化壓力高有關\n\n版本三：\n如果是年紀增長後感覺眼睛容易疲勞、乾澀、視力慢慢退化\n\n傳送圖卡\n1) https://www.dropbox.com/scl/fi/1csb1e657tn7dop50pslj/8.jpg?rlkey=69lvnkb4bqjskdqagb88clp34&st=huzgidv3&dl=0 \n\n2) https://www.dropbox.com/scl/fi/t6nvo82ipwo7570auu88t/11.png?rlkey=wnwta0lzf0irtg8tlcsai63m4&st=sdkc0c73&dl=0"
      - question: "需要補充「葉黃素＋蝦紅素」症狀：\n\n黃斑部病變"
        answer: "哈囉親愛的❤️\n\n如果是家人或自己有黃斑部病變的問題\n建議盡早補充「葉黃素＋蝦紅素」來保護視力、減緩退化喔\n\n因為黃斑部是我們眼睛視力最核心的位置\n一旦退化會影響看東西清晰度、閱讀能力，甚至分辨人臉都會變困難\n \n但是只靠葉黃素其實不夠完整的\n像姐姐之前在直播和限動裡說過的\n葉黃素主要是照顧視網膜表層細胞和黃斑部\n但如果已經開始有病變，就需要蝦紅素的幫忙！\n\n因為蝦紅素是目前最強的眼部抗氧化營養素之一\n可以修護深層視網膜細胞、幫助眼睛微血管循環\n搭配葉黃素才能把「表層＋深層」一起顧好\n\n簡單說\n葉黃素是「補回去」黃斑部缺的營養\n蝦紅素是「修復＆守護」黃斑部不再惡化\n\n兩種搭配，才是真正能從結構到機能全面照顧黃斑部的方式哦！\n✔️ 葉黃素建議你一天補到10~20mg\n✔️ 我們家的蝦紅素兩顆就有 4mg\n\n如果已有病變、視力模糊、看東西扭曲或視野中心暗點等狀況\n收到蝦紅素後吃4顆作為日常保養😊\n\n備註：\n\n黃斑部病變的形成，主要跟以下幾個因素有關：\n 1. 葉黃素流失／不足 → 黃斑部本身結構退化\n 2. 長期藍光傷害與自由基堆積 → 視網膜細胞氧化\n 3. 微血管循環變差 → 養分無法順利送到視網膜\n 4. 發炎反應 → 加速退化、模糊、病變惡化"
      - question: "結膜下出血（眼睛有血塊）"
        answer: "•        常見描述：眼白一塊紅紅的，看起來像血絲爆開\n        •        常見原因：熬夜、壓力大、用力咳嗽或打噴嚏、便祕、眼壓波動\n        •        處理建議：大多數是無害、會自行吸收。可提醒多休息、多喝水觀察幾天。若反覆出現應就醫。\n        •        不建議當下補充原因：不是視網膜問題，蝦紅素、葉黃素無明顯幫助。"
      - question: "眼睛紅腫發炎（結膜炎、針眼）"
        answer: "•        常見描述：眼睛紅腫、癢、流眼淚、有分泌物\n        •        常見原因：病毒/細菌感染、過敏或眼部清潔不當\n        •        處理建議：需注意清潔、避免揉眼，必要時用藥或看醫生。\n        •        不建議當下補充原因：處於急性發炎期時補充保健品效益不大，且不應取代治療。待恢復後可視情況補蝦紅素（抗發炎）。"
      - question: "視網膜剝離"
        answer: "•        常見描述：突然視野出現黑影、閃光感、視線模糊甚至缺損\n        •        處理建議：為眼科急症，立即就醫！\n        •        不建議補充原因：葉黃素／蝦紅素無法解決問題，術後才可評估是否需輔助保養。"
      - question: "糖尿病視網膜病變"
        answer: "•        常見描述：糖尿病患者視力模糊、暗影、看不清楚\n        •        處理建議：需眼科定期追蹤與血糖控制。蝦紅素和葉黃素可作為醫師允許下的輔助保養，不可單獨使用作為處理方式。"
      - question: "眼部外傷或手術恢復期"
        answer: "•        常見描述：剛做完白內障手術、雷射矯正手術或眼睛有撞擊紅腫\n        •        建議說法：可先休息，術後可依醫師建議評估補充。不要在傷口或術後急性期內補蝦紅素等高抗氧化產品（可能影響傷口癒合）"
      - question: "飛蚊變多\n\n緋聞"
        answer: "親愛的 如果妳看到的小黑點是因為玻璃體退化或液化造成的，那大多是正常的老化現象，對視力影響不大，不用太擔心💛\n\n但是如果眼睛突然出現很多飛蚊\n或者有閃光、視線模糊\n這有可能跟視網膜破裂、剝離或出血有關\n建議妳要盡快看眼科確認喔\n\nhttps://shengtingbio.com/eye-floaters/ \n\nhttps://shengtingbio.com/10-warning-signs-symptoms-of-eye-problems/ \n這份我們公司雜誌提供關於飛蚊症的資訊分享給你❤️\n（圖卡）\n蝦紅素能深入玻璃體 減少蛋白質變性，進而降低飛蚊症發生率哦～\n\n蝦紅素建議你一天補到6~12mg\n我們家的蝦紅素兩顆就有 4mg \n所以可以先補充3顆以上\n\n等狀況穩定，有改善之後再調整為2顆作為日常保養😊"
      - question: "口服A酸期間，擔心視力下降"
        answer: "親愛的 吃A酸是有可能讓眼睛變乾、晚上看東西比較模糊\n\n但這種狀況是少數 而且大多是暫時性的\n\n只要身體有營養去保護眼睛 其實根本不用擔心\n\n妳現在吃A酸在調理皮膚\n建議妳可以補充姊姊的蝦紅素\n\n因為它是目前唯一能穿透視網膜的超強抗氧化劑\n\n能直達眼睛最深層的黃斑部與視神經\n\n從玻璃體、視網膜、到眼底血管循環全面修復\n\n裡面也有維A＋E 強化夜間視力與細胞穩定性\n\n✨我們家的蝦紅素兩顆就有 4mg\n\n你在補充Ａ酸期間 建議可以吃到三顆 讓保養更到位\n\n可以試著補充看看 相信對你真的會很有幫助的💕\n\n有任何問題也都可以問我唷😊"
      - question: "蝦紅素這款的成份含量各是多少"
        answer: "蝦紅素成人一日建議攝取量\n\n一般保健建議攝取量\n成人每日建議攝取2–4毫克蝦紅素，即可達到基本保健效果\n\n加強保健或特定需求劑量\n\n若有強化抗氧化、護眼、護膚等需求，建議攝取量可提升至4–6毫\n\n我的兩顆就有4mg\n\n給親愛的參考"
      - question: "能有效對抗老花？"
        answer: "親愛的❤️老花是眼睛水晶體彈性變差、睫狀肌調節力變弱\n沒辦法恢復對焦速度、看近容易模糊\n屬於年齡相關的視覺退化現象\n\n蝦紅素雖然無法治癒老花眼\n但它是目前最強的眼部抗氧化營養之一\n\n可以幫助：\n\n✅ 減少睫狀肌疲勞（改善近距離看久模糊）\n✅ 增加眼睛微血管循環（幫助水晶體代謝廢物）\n✅ 減輕藍光與氧化壓力對眼睛的傷害\n\n\n對於40歲以上、視覺容易疲勞、剛開始有老花困擾的族群\n長期穩定補充，可以有效延緩惡化速度、讓眼睛更有力也更穩定哦！\n\n我們家的蝦紅素兩顆就有 4mg\n\n若已有老花症狀，收到蝦紅素後吃3~4顆作為日常保養😊"
      - question: "長期用眼適合嗎"
        answer: "親愛的 如果妳工作常常看LED燈、長時間盯螢幕、室內光線強烈 那蝦紅素很適合哦\n\n因為長期看藍光會引起氧化壓力\n\n長期下來會讓眼睛容易乾澀疲勞、睫狀肌緊繃（看東西容易模糊）、 視網膜細胞損傷、加速退化\n\n建議妳可以補充姊姊的蝦紅素\n\n因為它是目前唯一能穿透視網膜的超強抗氧化劑\n\n能直達眼睛最深層的黃斑部與視神經\n\n從玻璃體、視網膜、到眼底血管循環全面修復\n\n裡面也有維A＋E 強化夜間視力與細胞穩定性\n\n抗藍光傷害、穩定睫狀肌、讓眼睛更耐操不乾澀\n\n圖卡分享給妹妹更了解❤️"
      - question: "懷孕 孕婦"
        answer: "親愛的 謝謝你的詢問我的蝦紅素❤️\n孕期可以安心補充沒問題✨\n\n孕媽咪建議控制在 每天2～4mg之間就很足夠\n我們家的蝦紅素 每2顆就含有 4mg的天然藻紅素\n\n所以如果妳是孕期吃\n建議每天飯後2顆就剛剛好\n既能抗氧化、保護眼睛，也不會造成身體負擔💛\n\n親愛的您好～謝謝您來訊詢問🥰\n\n關於蝦紅素是否適合孕婦食用的問題，這邊提供您說明👇\n\n我們的蝦紅素為天然萃取、無添加的成分來源，孕婦是可以安心食用的唷！\n建議劑量為每日2顆，有助於抗氧化、減少眼睛乾澀與疲勞、保護視力，也能幫助孕期中的細胞修護與自由基清除。\n\n📌 不過每位孕媽咪的體質不同，若您有特殊用藥或高風險孕期建議仍可先諮詢醫師後再使用會更安心唷💛\n\n簡短版：\n\n親愛的 孕婦可以吃\n\n孕媽咪建議控制在 每天4mg左右就很足夠\n所以如果是孕期吃\n建議白天飯後2顆當作保養💛"
      - question: "山桑子品牌和定量"
        answer: "親愛的 謝謝你的詢問我的蝦紅素❤️\n我們這款是使用德國專利的 Beriessence® 15種超級莓果精華複方\n裡面有含山桑子，屬於配方中的一部分\n\n整體配方有針對「總花青素含量」和「多酚含量」做高標準設計\n👉 花青素超過10,000ppm，多酚超過15,000ppm\n再搭配蝦紅素一起補，整體抗氧化力、眼底保護力是有感的唷！\n\n日常眼睛疲勞、保養、舒緩飛蚊症或乾澀，這組合是很夠用的✨"
      - question: "有在販售嗎 還有嗎"
        answer: "妹妹\n目前蝦紅素的活動還不確定\n因為這次原料有可能會缺貨 🥺 \n那目前都還有在販售\n售完後預計需要等2~3個月才會再上市 \n有需要的話可以把握哦 寶貝謝謝你"
      - question: "可否搭配魚油？\n\n會有負擔嗎"
        answer: "親愛的～如果妳平常比較少吃魚、堅果、好油\n姊姊會建議魚油還是要補充唷💛\n因為魚油是幫妳打底抗發炎的\n而蝦紅素是專門修復眼睛、抗氧化\n兩個搭配起來效果更好 功能也不會重複\n放心一起吃不會造成身體負擔的💕"
  - name: "魚油"
    faqs:
      - question: "售價"
        answer: "親愛的 💕\n\n薑黃跟魚油\n\n都有抗發炎的效果，但它們兩個其實有點像是不同功能的「抗發炎高手」\n\n🌿 薑黃\n妳可以想像它是「滅火器」\n\n對於急性發炎或明顯的不適，例如突然的關節痠痛、身體明顯發炎不舒服的時候，它的效果非常快速且明顯\n\n能迅速減輕妳身體的負擔和不適感\n\n🐟 魚油 (Omega-3)\n則比較像是幫妳長期守護身體健康的「消防系統」\n\n它是從根本上減少妳身體製造發炎的物質\n\n能長期、穩定地維持妳體內抗發炎的能力\n\n像是皮膚問題、慢性過敏、壓力大、心血管健康，甚至頭腦清晰、讓皮膚屏障建立\n都是魚油能溫和長期照顧到的\n\n所以啊～\n✅ 薑黃適合「急救型、立即舒緩」的效果\n\n✅ 魚油則是「長期調理、維護健康」的營養品\n\n它們並不衝突，反而是很棒的搭配組合哦！\n\n如果妳已經有在吃薑黃了，我還是會強烈建議妳一定要補充魚油喔\n\n這樣妳的身體才能達到最好的抗發炎效果，內在穩定又健康，真的差很多\n\n\n因為Omega-3 是人體無法自行合成的營養，一定要額外補充\n\n所以魚油真的不是只是選擇題，而是身體必備的營養品❤️\n\n這兩張圖卡分享給你😊\n\n有問題再隨時請教我唷"
      - question: "功效"
        answer: "抗發炎、免疫力有關、三高、類風濕關節炎\nOMEGA-3可以降低膽固醇、血壓、心血管疾病、預防糖尿病、改善自體免疫力問題(類風溼性關節炎)\n\nEPA: 保護大腦神經、記憶力反應、改善憂鬱等精神問題\n抗痘"
      - question: "吃法\n什麼時間吃最好？"
        answer: "親愛的💕 成人一日建議補充1000~2000mg\n\n所以你可以在最豐盛的一餐飯後吃 \n或者隨餐服用2～4顆魚油\n\n運動 建議最多3~4顆 魚油為何要當餐吃 吸收才會好\n如果正餐只吃蛋白質 但吸收就不好\n可以吃一口堅果 再吃魚油\n\n親愛的您好～魚油的建議吃法如下唷👇\n\n👉 成人一天建議補充 1000～2000mg 的魚油\n建議一天 2～4 顆，建議飯後吃、搭配「含油脂的餐」吸收效果最好～\n\n如果正餐比較清淡（像是只有水煮蛋＋蔬菜），建議可以吃一口堅果再補充魚油，幫助吸收不浪費🌿\n\n⚡如果有運動、或希望加強身體的發炎調節與修復，魚油也可以吃到 3～4 顆沒問題唷！\n\n✅ 每日補充 2 顆黃金魚油，相當於：\nOmega-3 含量：＞980mg\n其中 EPA＞600mg\n其中 DHA＞200mg\n\n您好～我們的『98%高濃度頂級專利黃金魚油』每 2顆 含有：\n\n👉 Omega-3 總量超過 980mg\n👉 其中 EPA 約 600mg、DHA 約 200mg\n\n提供給您參考💛"
      - question: "小朋友吃法"
        answer: "親愛的 💕 感謝您的提問，這邊為您說明我們的魚油適用年齡。\n\n我們的【98%高濃度頂級專利黃金魚油】魚油為全天然純淨來源，沒有額外的添加物，不會對身體造成負擔，1歲以上的小朋友就可以安心食用～\n魚油含有豐富的 Omega-3 脂肪酸（DHA+EPA），對於孩童腦部發育、視覺健康與專注力提升都很有幫助！\n\n關於魚油給小朋友的食用建議：\n\n🧒 1~6 歲小朋友：建議剪開膠囊吃半顆的量 或者兩天一顆\n✔️ 若無特別需求、日常飲食均衡，無需額外補充魚油\n\n👧 7~12 歲小朋友：建議一天～兩天吃 1 顆 即可\n如果孩子體質特別需要加強（例如：專注力、情緒、體內發炎調節），可以每日服用1顆作為日常保養\n\n👧 13 歲以上：每天 2 顆，加強每天 4 顆（分 2 次食用）\n\n各年齡層食用劑量建議\n- 1 - 6 歲：2 天 1 顆 （有需求再補充）\n- 7 - 12 歲：每天 1 顆\n- 13 歲以上：每天 2 顆，加強每天 4 顆（分 2 次食用）\n\n可以吃魚油改善\n少吃精緻糖\n穩定情緒\n1歲吃ok\n\nB群1~2顆就夠了 但對過動沒有直接幫助"
      - question: "孩子四歲～輕微過動有點注意力不集中\n建議魚油和全能膠囊吃幾顆"
        answer: "親愛的💕\n我會建議小朋友一天或兩天吃一顆魚油就好\n\n全能膠囊也可以吃喔\n幫助神經穩定＋補腦營養 每天1～2顆\n\n飲食方面記得要幫他少吃「精緻澱粉、糖果、加工食品」\n這些都會讓情緒和注意力更難穩定\n\n這篇醫學參考連結給你唷\nhttps://parkerweiyao.pixnet.net/blog/post/355320578"
      - question: "魚油要吃多久才有感？"
        answer: "沒有標準\n基礎營養素\n所以抗發炎\n很難去體感發現"
      - question: "懷孕能吃嗎"
        answer: "親愛的 💕  \n目前懷孕幾週了呢😊\n懷孕期間補充姊姊的魚油對小baby會有幫助的，但是最後的一兩個月建議要再跟醫生討論哦\n\n這段時間補充對寶寶腦部發展、媽媽情緒穩定都很重要💛\n\n寶貝\n妳現在可以放心吃魚油到32週左右都沒問題唷\n33周之後再記得詢問妳的產檢醫師\n確認是否要繼續補💕\n你收到後每天2~3顆 放第一餐飯後吃❤️\n\n寶貝 魚油懷孕期間可以吃 而且非常推薦 因為孕期期間補充對寶寶腦部發展、媽媽情緒穩定都很重要💛"
      - question: "抗凝血藥物，中風 三高"
        answer: "親愛的 💕 家人有吃抗凝血藥物的話建議先不要吃魚油 因為不確定兩者吃會不會影響，要請爸爸回診時跟醫生講，請醫生評估更放心哦"
      - question: "食用注意事項？"
        answer: "適合食用族群\n1 歲以上的葷食者，包含青春期、生理期、備孕期、懷孕期、哺乳期、更年期女性，男女上班族及長輩族\n\n食用注意事項\n1. 不建議食用族群：素食者、不吃牛者（軟膠囊為高品質牛萃取原料）、對魚過敏者、懷孕後期（預產期前 30 天左右）。\n2. 建議諮詢醫師族群：服用抗凝血藥物、阿斯匹靈、手術前後二週。\n3. 避免營養吸收干擾：服用藥物、鈣片或牛奶，請間隔 1-2 小時以上，以確保營養素的吸收與利用。\n4. 其他健康考量：如身體不適或正在服藥，建議先諮詢專業醫師。\n5. 體質適配性：購買前請確認產品成分是否適合個人體質需求。"
      - question: "生理期適合食用嗎？"
        answer: "很少人會血量變超多\n除非真的有人這麼敏感 那生理期就先不吃"
      - question: "碘、鈉、磷、鉀含量為何？甲狀腺亢進或腎臟病患者適合食用嗎？"
        answer: "大部分可以 但腎臟病患者較複雜\n如果洗腎 腎衰竭\n癌症\n重症\n\n問他的檢驗報告 營養師才能給建議"
      - question: "軟膠囊可以移除食用嗎？"
        answer: "可以選擇以下方法食用：\n1.使用乾淨的剪刀輕輕剪開膠囊，將魚油擠出，直接入口或添加至常溫食物或飲品中食用。\n2.將膠囊放入口中，輕輕咬破後直接吞下。\n\n產品風味：帶有淡淡的鯖魚香氣，且油品新鮮，幾乎沒有魚腥味。"
      - question: "正確保存？是否需要冷藏？"
        answer: "未開封：請存放於陰涼乾燥處，避免陽光直射、高溫及潮濕環境。\n\n開封後：取出乾燥劑後，將 PTP 鋁片移至密封袋中，務必壓緊密封袋封口，存放於陰涼乾燥處。為確保營養素的新鮮與功效，建議於開封後盡快食用完畢。\n\n不要放冰箱 更容易黏\n\n夏天 濕度 偏高 會小黏 \n罐裝會更黏\n濃度會隨著時間下降\n膠囊保鮮3年"
      - question: "萃取方式？與超臨界萃取有什麼不同？"
        answer: "範例回答：魚油採用「SPD(Short-path Distillation)技術」進行萃取，以物理方式分離，100% 不使用有害化學溶劑，技術比超臨界萃取更先進且環保。此外，我們逐批進行重金屬、塑化劑、微生物與農藥殘留的檢測，層層把關，全面為你守護食品安全。"
      - question: "魚油不歸類在減重"
        answer: "三酸甘油脂跟皮下脂肪不壹樣 但它可以抗方言\n\n適合運動人士 因為運動的人都會發炎\n比較舒服\n\n蛋白質＋魚油 肌肉會長更漂亮"
      - question: "漏性皮膚炎適合嗎"
        answer: "漏性皮膚炎（脂漏性皮膚炎）之所以很適合補充魚油\n\n主要原因是漏性皮膚炎的發生，和身體內的慢性發炎、免疫失調\n\n🔥🔥皮脂腺分泌異常都有很大的關係\n\n而魚油含有豐富的 Omega-3 脂肪酸，尤其是 EPA 和 DHA，它們能有效\n\n🌟抗發炎\nOmega-3能降低體內的慢性發炎反應，舒緩皮膚因發炎造成的紅腫、發癢和脫屑狀況\n\n🌟平衡免疫系統\n魚油有助調節免疫系統，改善過度敏感的狀態，讓皮膚不再那麼容易過敏或發炎\n\n🌟調節皮脂分泌\nOmega-3能幫助皮脂腺分泌更正常，減少油脂分泌過度，進而改善皮膚的油膩和脫屑情形\n\n🌟保濕舒緩肌膚\n魚油還能維持皮膚的水分與屏障功能，讓妳的皮膚不容易乾癢、泛紅，整體肌膚狀態變穩定\n\n所以長期補充魚油，不僅可以從根本上改善漏性皮膚炎的症狀，更能讓皮膚維持穩定健康喔\n\n我非常喜歡吃魚油保養皮膚的感覺🌟"
      - question: "輕微妥瑞氏的症狀"
        answer: "寶貝 這兩樣推薦小朋友補充 可以吃沒問題唷！\n\n醫生有建議補充B6 是腦部重要輔酶 所以補充全能膠囊是很合適的\n\n魚油也可以穩定神經系統、減少發炎與修復神經傳導\n\n魚油富含Omega-3（EPA+DHA）對小朋友的腦部發展、抗發炎、提升情緒穩定很有幫助\n\n小孩吃法建議如下：\n\n全能膠囊：每天 1～2 顆（飯後吃）\n\n魚油膠囊：兩天 1 顆（如果小孩可以吞膠囊就直接吃 或者可以擠開來吃都可以）"
      - question: "癌症患者（去年10月已做完化療）\n目前追蹤中可以吃嗎？"
        answer: "親愛的❤️\n癌症治療後正在追蹤中的這個階段\n補充魚油是可以的 而且還蠻推薦的哦～\n\nOmega-3（EPA＋DHA）有助於降低體內慢性發炎\n幫助維持肌肉質量、穩定免疫、修復細胞膜\n癌後修復期可以安心補充唷\n\n所以如果是\n✔ 剛完成治療、體力還在恢復\n✔ 對於化療後容易疲倦、情緒低落、皮膚乾燥也都有幫助\n這時候補充這罐魚油非常合適\n\n我會建議可以從一天2顆開始，飯後吃\n\n✔ 小分子高純度 → 吸收率高、負擔低\n✔ 小型魚來源（鯷魚） → 食物鏈底層、重金屬汙染風險低\n✔ 來自祕魯太平洋與南極洋流交界的深海魚種\n✔ 國際認證船隊PESQUERA EXALMAR S.A.A出品\n✔ 無人工香料、無人工色素、無防腐劑\n✔ 通過重金屬檢驗、安全安心可長期補充"
      - question: "重訓\n髖關節ㄧ直疼痛一年多\n已經造成運動傷害\n目前的狀況我適合薑黃還是魚油呢？"
        answer: "親愛的 薑黃算是急救型抗發炎\n☑ 抑制發炎介質\n☑ 修復關節軟組織\n☑ 提升肝臟代謝、幫助身體處理這些「發炎廢物」\n\n魚油則是像身體內建的防火牆\nOmega-3（EPA＋DHA）是細胞膜的核心脂質\n幫助修復筋膜、肌腱、關節液的彈性\n\n重訓本身就會讓身體發炎 \n平時有在重訓的話\n建議加上魚油 肌肉會長的更漂亮哦！\n\n我會建議你兩款都要吃\n\n薑黃急救降發炎 \n魚油針對慢性發炎做修復組織 護細胞膜\n兩者一起穩定免疫  \n全面照顧妳目前的狀況"
      - question: "素食者 但願意吃魚油"
        answer: "寶貝你願意吃真的太棒了 \n因為外食或者純素飲食常常Omega-3比例不足\n但我們身體非常需要Omega-3\n去穩定內分泌、緩解燥熱\n保護心血管＋大腦清晰度 \n對記憶力反應 情緒也有益處❤️"
      - question: "LINE \n魚油每個人都適合吃嗎"
        answer: "親愛的您好～\n魚油是很常見的保健食品，主要補充 Omega-3 脂肪酸（EPA、DHA），對心血管、腦部、眼睛、抗發炎、提升專注力記憶力和皮膚發炎（異位性皮膚炎、乾癢、痘痘、脫皮狀況）等都有幫助👌\n\n大部分人適合哦～\n\n以下這些族群要特別留意：\n🔸 對魚類、海鮮過敏者\n🔸 有出血傾向、凝血功能異常者（如服用抗凝血藥物）\n🔸 準備手術者：建議術前一週停用魚油\n🔸 懷孕32周以上：建議諮詢醫生可否持續補充"
      - question: "想了解"
        answer: "親愛的 謝謝你的詢問😊\n\n我們的『98%高濃度頂級專利黃金魚油』Omega-3含量是市面上少見的 高達98%純度（SGS檢驗98.6%）\n✅ Omega-3 > 98%\n✅ EPA 69%、DHA 24%、有效濃度超過90%\n👉 相當於一份就有 > 980mg 的 Omega-3\n採用 rTG 型式，更好吸收喔！\n\n有需要更詳細的補充方式，小編也可以幫你搭配看看💛"
      - question: "針對 更年期"
        answer: "姊姊\n\n超級適合\n\n因為如果妳沒有特別補充魚油（Omega-3）\n妳可能就很難從其他食物中獲得足夠的 EPA！\n\n吃橄欖油、亞麻仁油、酪梨，甚至蝦紅素，不就已經有Omega-3了嗎？』\n\n其實\n\n這些食物雖然健康又營養\n\n但裡面根本沒有真正女人非常直接需要的 EPA！\n\n橄欖油、亞麻仁油、酪梨 裡面含的是ALA\n\n植物性Omega-3\n\n它要透過人體非常複雜的轉換過程，才能轉換出少量的EPA\n\n而且轉換率只有1～5%左右，幾乎微乎其微\n\n蝦紅素是藻油\n\n雖然也是油\n是超級抗氧化劑\n但它也完全不含EPA喔\n\n只有魚油\n才會含有真正且足量的人體直接吸收的『EPA和DHA』\n\n尤其是 EPA，能夠強效抗發炎、保護荷爾蒙平衡\n\n女人，尤其是進入更年期的我們，更要認真補充EPA\n來自於魚油的Omega-3唷\n\n🌸 EPA到底是什麼？\nEPA是一種人體無法自行製造的Omega-3脂肪酸，必須從飲食中補充，尤其是從魚油裡獲得最豐富\n\n為什麼婦女一定要補充EPA呢？\n\n✅緩解更年期不適症狀\n更年期的女性常常會有情緒不穩定、熱潮紅、睡眠困擾、焦慮等狀況，EPA能夠穩定情緒、減少憂鬱感，讓姊姊輕鬆度過這個轉變期\n\n因為我也是一樣\n\n尤其是\n✅保護心血管健康\n進入更年期之後，女性的雌激素明顯下降，導致心血管疾病風險增加\n\nEPA能有效降低三酸甘油脂，改善血液循環，保護我們的心臟健康\n\n重點是\n✅維持荷爾蒙平衡\nEPA能有效協助身體維持荷爾蒙的穩定與平衡\n緩解因荷爾蒙下降而出現的不適\n保持活力\n體力年輕狀態\n\n這個是我覺得差很多的\n\n最後最後\n更年期後骨質密度降低，EPA有助於緩解骨骼流失問題\n維持女人的骨骼健康，預防骨質疏鬆症的發生\n\n這就是\n\n我為什麽要做魚油\n\n認真推薦妳們一定要吃魚油\n\n因為裡面有豐富的EPA，真正從體內給女人\n荷爾蒙和婦科\n身體全面的保護"
      - question: "針對 更年期"
        answer: "🌸 更年期女生為什麼一定要吃魚油呢？\n\n更年期最大的問題之一就是『雌激素下降』，而雌激素下降會造成：\n        •        皮膚乾燥、鬆弛、老化加速\n        •        情緒起伏大、失眠、熱潮紅\n        •        骨質疏鬆、心血管風險增加\n\n妳知道嗎？這些問題的背後，也跟『慢性發炎』密切相關。\n\n🌸 而魚油裡最珍貴的EPA，為什麼特別重要？\n\n1️⃣ 抗發炎，緩解更年期症狀\nEPA能有效降低體內慢性發炎反應，幫助減緩更年期時出現的熱潮紅、情緒波動、失眠困擾。\n\n2️⃣ 保護卵巢與子宮健康\nEPA能幫助妳的身體平衡荷爾蒙，穩定甚至降低過高的雌激素活性，幫助妳控制子宮肌瘤、巧克力囊腫的生長，維護子宮與卵巢健康。\n\n3️⃣ 穩定情緒、改善睡眠品質\nEPA能夠舒緩焦慮、減少憂鬱傾向，幫助妳的情緒穩定，提升睡眠品質，讓妳心情更輕鬆、更愉快。\n\n4️⃣ 保護皮膚與延緩老化\nEPA具有抗氧化、抗發炎效果，能讓妳的皮膚更有彈性、更保濕、更不容易乾燥與老化，幫助妳從內到外散發出健康的年輕光采。\n\n🌸 為什麼其他食物無法取代EPA呢？\n        •        很多人會想：『我吃橄欖油、亞麻仁油、酪梨或蝦紅素，應該夠了吧？』\n其實這些食物裡含的是植物性Omega-3（ALA），身體要轉換成EPA的效率極低，只有約1%~5%，根本不足夠真正幫"
      - question: "卵巢"
        answer: "多囊性卵巢症候群的女孩\n補充魚油（Omega-3）\n對妳來說真的超級重要又適合✨\n\n\n因為PCOS的主要原因之一就是「身體處於慢性發炎」的狀態\n\n\n這種慢性發炎會干擾妳的荷爾蒙平衡，導致經期不順、長痘痘、易胖、水腫，甚至情緒起伏大\n\n🐟每日補充Omega-3\n\n降低體內慢性發炎\nOmega-3（尤其EPA和DHA）能有效減少身體內部的發炎反應\n\n緩解因為發炎造成的荷爾蒙混亂\n逐步恢復正常的生理週期❤\n\n\n許多PCOS的女生會有胰島素阻抗的問題\n魚油能幫助提高胰島素敏感性，改善血糖穩定，有效幫助妳控制體重、減少脂肪堆積\n\n也特別跟妹妹說\n\n女人沒有特別補充魚油（Omega-3）\n\n真的可能就很難從其他食物中獲得足夠的 EPA！\n\n很多人會問姐姐：\n\n🔸 我吃橄欖油、亞麻仁油、酪梨，甚至蝦紅素，不就已經有Omega-3了嗎？\n\n其實，這些食物雖然健康又營養\n\n但裡面根本沒有真正人體直接需要的 EPA！\n\n🌿 橄欖油、亞麻仁油、酪梨 裡面含的是『ALA（植物性Omega-3）』\n\n它要透過人體非常複雜的轉換過程，才能轉換出少量的EPA\n\n而且轉換率只有1～5%左右，幾乎微乎其微\n\n🦐 蝦紅素 則是『超級抗氧化劑』，雖然對皮膚很好，但它也完全不含EPA喔！\n\n只有魚油\n才會含有真正且足量的人體直接吸收的『EPA和DHA』\n\n尤其是 EPA，能夠強效抗發炎、保護心血管、改善肌膚和荷爾蒙平衡\n\n我非常推薦妹妹補充魚油\n\n根本改善慢性發炎，更能調理荷爾蒙\n\n每日持續吃魚油"
      - question: "男生適合嗎"
        answer: "寶貝 男生也很適合🩷\n\nOmega-3脂肪酸能協助維持男性荷爾蒙（睪固酮）的平衡\n🌟\n提高整體活力與體力\n\n-----\n還有寶貝這個我覺得男生吃魚油也很棒\n-----\n\n現代男人承受的壓力越來越大，\n魚油的EPA能有效穩定情緒，緩解焦慮、減輕憂鬱感\n\n讓心情更穩定、更放鬆，睡眠品質也會提升\n\n----\n男人因為工作壓力大、活動量高，容易出現關節發炎、腰痠背痛的狀況，\n魚油能有效抗發炎，緩解關節、肌肉痠痛\n\n---\n男人通常比較容易有高血脂、高膽固醇的問題\n魚油裡的EPA和DHA能夠降低三酸甘油脂、膽固醇，\n降低心血管疾病風險、保護心臟健康"
      - question: "備孕適合嗎"
        answer: "親愛的 備孕也很適合🩷\n\nDHA＋EPA 有助於調節荷爾蒙平衡\n穩定排卵週期，幫助子宮環境變得比較「不發炎、好著床」\n\n魚油是天然的抗發炎營養素\n對於多囊體質、子宮內膜異位、子宮環境偏濕熱者特別有幫助\n\n而魚油裡最珍貴的EPA，為什麼特別重要？\nEPA能幫助情緒穩定、減少焦慮與壓力\n👉 準備懷孕時情緒起伏大，有魚油支持比較不會亂掉\n\n魚油也能提升男性精子品質與活動力\n👉 如果妳有另一半也想一起調整，他吃也會加分\n\n\n為什麼其他食物無法取代EPA呢？\n • 很多人會想：『我吃橄欖油、亞麻仁油、酪梨或蝦紅素，應該夠了吧？』\n其實這些食物裡含的是植物性Omega-3（ALA），身體要轉換成EPA的效率極低，只有約1%~5%，根本不足夠真正幫"
      - question: "針對子宮裡有長東西的\n婦科問題\n\n子宮肌瘤、巧克力囊腫"
        answer: "妹妹們，今天姐姐要特別溫柔又詳細地跟妳們聊聊，\n為什麼如果妳的子宮裡有 子宮肌瘤、巧克力囊腫，更需要補充魚油裡面珍貴的 EPA✨。\n\n🌸 首先，為什麼會有子宮肌瘤、巧克力囊腫？\n無論是子宮肌瘤或巧克力囊腫，背後最主要的成因之一，就是妳的身體處在一個『長期慢性發炎』的狀態下。\n這種慢性發炎會加劇囊腫或肌瘤的生長與症狀惡化，也可能導致月經量過多、經痛嚴重、甚至影響生育能力。\n\n🌸 那EPA（魚油）為什麼對妳這麼重要呢？\n\n1️⃣ 超強抗發炎效果\n        •        EPA是一種『Omega-3脂肪酸』，它能有效降低妳身體內的慢性發炎反應，減緩肌瘤和囊腫的生長速度，改善發炎帶來的不適感受，並且舒緩經痛、腰痠、腹脹等症狀。\n\n2️⃣ 幫助調節荷爾蒙\n        •        EPA能協助妳的身體平衡荷爾蒙，尤其是降低過高的雌激素（肌瘤和囊腫增生的主要原因），藉此來穩定肌瘤或囊腫的大小，甚至減緩其惡化。\n\n3️⃣ 減緩經期疼痛與不適感\n        •        EPA能降低經痛程度、減少經期大量出血或不適感，透過抑制前列腺素（發炎反應的物質），有效緩解經期不適的症狀。\n\n4️⃣ 改善情緒與睡眠品質\n        •        慢性發炎容易引起情緒起伏、焦慮不安，甚至憂鬱的傾向。EPA能幫妳有效穩定情緒，讓妳睡得更好、更安穩。\n\n🌸 為什麼其他食物（如橄欖油、亞麻仁油、酪梨）無法取代魚油？\n        •        雖然這些食物都很健康，但其中的Omega-3脂肪酸種類不同，這些食物含有的是ALA，需要經過人體內轉換才會變成EPA，而轉換的效率極低（只有約1%～5%），完全不足以達到抗發炎的有效劑量。\n        •        EPA只有魚油能直接提供，而且人體能立即使用，不需轉換，效果明顯且快速。\n\n🌸 所以，最專業的建議就是：\n如果妳有子宮肌瘤、巧克力囊腫，想要真正有效降低慢性發炎、穩定症狀，\n最好的方式就是直接每天補充高濃度魚油，\n長期維持，從根本調整體質，改善生活品質。\n\n記得，妳的健康絕對不能輕忽，\n姐姐真心希望妳們每一個人都能夠幸福健康又自在❤️✨。\n\nEPA只有魚油能提供\n子宮肌瘤巧克力囊腫必吃魚油\n\n如果妳有子宮肌瘤、巧克力囊腫，想要真正有效降低慢性發炎、穩定症狀\n最好的方式就是直接每天補充高濃度魚油\n\nEPA能降低經痛程度、減少經期大量出血或不適感，透過抑制前列腺素（發炎反應的物質），有效緩解經期不適的症狀\n\nEPA能協助妳的身體平衡荷爾蒙，尤其是降低過高的雌激素（肌瘤和囊腫增生的主要原因），藉此來穩定肌瘤或囊腫的大小，甚至減緩其惡化"
      - question: "子宮肌腺症呢？"
        answer: "親愛的～子宮腺肌症和子宮肌瘤、巧克力囊腫一樣\n本質上都是「慢性發炎」和「荷爾蒙失衡」引起的問題\n\n所以同樣需要穩定、長期補充對的營養素來調理體質✨\n\n子宮腺肌症的體質，通常會伴隨：\n慢性發炎、雌激素偏高、自體免疫混亂\n如果長期沒調整，就容易疼痛加劇、出血量增加、情緒與代謝也都會受到影響\n\n基本上，我會建議妳從以下這三樣開始補充\n針對不同面向來幫助妳的身體慢慢回穩👇\n\n1️⃣ 魚油（EPA高含量）\n✔️ 抗發炎、減緩疼痛、降低前列腺素過度反應\n✔️ 調節免疫系統，減少發炎循環惡化\n✔️ 幫助睡眠與情緒穩定，舒緩疼痛帶來的壓力感\n\n2️⃣ 薑黃\n✔️ 加強抗發炎力，搭配魚油是黃金修復組合\n✔️ 幫助肝臟代謝多餘雌激素，穩定荷爾蒙\n✔️ 改善氣滯血瘀型的經痛、經期悶脹\n\n3️⃣ 全能B+C鋅鎂膠囊\n✔️ 放鬆神經、改善睡眠品質\n✔️ B6＋鎂可緩解經前焦躁、乳房脹痛與疲勞感\n✔️ 鋅有助免疫調節，幫助內膜組織不再亂長\n\n子宮腺肌症比一般肌瘤更容易出現劇烈經痛與大量出血\n所以越早補對這三樣、補足基底\n越能延緩惡化，也能大幅減少吃止痛藥的次數✨\n\n我們每天吃的外食、加工品，其實都攝取太多 Omega-6\n而Omega-3卻嚴重不足，這正是身體長期慢性發炎的根源！\n所以我終於做出一瓶真正「吃了有感，身體會改變」的魚油\n\n⸻\n我選用的是：\n🌊 來自地球最後淨海\n🌎 祕魯 × 南極洋流交界的單一鯷魚品種\n🐟 不是混合魚種，而是最乾淨、低重金屬、低污染的黃金級魚源鯷魚\n\n再搭配\nSPD專利黃金萃取技術\n最大程度保留DHA與EPA的活性\n打造真正可以對抗體內發炎的極致高濃度98.6魚油\n尤其是現代人壓力大、用腦過度，真的要靠一瓶好油撐住日常！\n\n綜合以上，我會建議妳補魚油外，也可以搭配薑黃 和 全能B群\n\n全面幫助降低慢性發炎、穩定內分泌系統\n以及肝臟代謝多餘的荷爾蒙，減少雌激素滯留\n\n這三樣對女生婦科很好～\n\n針對這三樣，也跟親愛的說明現在的活動：\n\n▶️薑黃、全能B群目前沒有特價～\n▶️ 魚油限時優惠 $1799/盒\n\n🛒 下面是賣場，也讓你參考看看\nhttps://www.yardley.tw/products/ultra-pure-95-golden-fish-oil-omega3-1-1\n\n有問題隨時請教我唷❤️"
      - question: "胸部纖維囊腫\n有雌激素嗎"
        answer: "親愛的 謝謝你的詢問～\n\n這邊跟你說明，魚油本身是不含雌激素的\n\n我們的產品也都不包含雌激素相關成分\n\n可以放心吃～\n\n魚油具有天然的「抗發炎＋調節荷爾蒙」功能\n可以幫助妳穩定乳房組織、減少囊腫發炎與疼痛感～\n\n姐姐的魚油有1000mg的Omega-3\n✅市售第一款高達98%純濃度(全台最高SGS檢驗98.6%)\nOmega-3 > 98%\nEPA> 69%\nDHA>24%\nrTG型式\n🌟EPA+DHA有效物質含量90％以上\n這是多數醫學研究都推薦的「保健級、調理級」劑量\n\n一般來說，會造成囊腫變大\n通常和吃進去的東西如果會促進雌激素或激素類營養過多\n（像大豆異黃酮、過量蜂王乳、荷爾蒙類產品）\n才有可能刺激乳房組織增生\n\n✅ 魚油沒有這類風險，反而是乳房纖維囊腫可以安心補充的營養之一\n\n我們每天吃的外食、加工品，其實都攝取太多 Omega-6\n而Omega-3卻嚴重不足，這正是身體長期慢性發炎的根源！\n所以我終於做出一瓶真正「吃了有感，身體會改變」的魚油\n\n⸻\n我選用的是：\n🌊 來自地球最後淨海\n🌎 祕魯 × 南極洋流交界的單一鯷魚品種\n🐟 不是混合魚種，而是最乾淨、低重金屬、低污染的黃金級魚源鯷魚\n\n再搭配\nSPD專利黃金萃取技術\n最大程度保留DHA與EPA的活性\n打造真正可以對抗體內發炎的極致高濃度98.6魚油\n尤其是現代人壓力大、用腦過度，真的要靠一瓶好油撐住日常！\n\n如果妳的囊腫是偏多、反覆出現\n我會建議妳補魚油外，也可以搭配：\n\n🌿 薑黃：幫助降低慢性發炎、穩定內分泌系統\n🌿 B群＋鎂＋鋅（全能膠囊）：幫助肝臟代謝多餘的荷爾蒙，減少雌激素滯留\n\n\n這三樣對女生婦科很好～\n\n針對這三樣，也跟親愛的說明現在的活動：\n\n▶️薑黃、全能B群目前沒有特價～\n▶️ 魚油限時優惠 $1799/盒\n\n🛒 下面是賣場，也讓你參考看看\nhttps://www.yardley.tw/products/ultra-pure-95-golden-fish-oil-omega3-1-1\n\n有問題隨時請教我唷❤️"
      - question: "痘痘"
        answer: "沒錯親愛的 針對平時會長痘痘 魚油會很有幫助\n\n因為痘痘其實就是一種皮膚的慢性發炎反應\n\n尤其是壓力大、熬夜、飲食亂的時候 更容易爆痘\n我們每天吃的外食、加工品，其實都攝取太多 Omega-6\n而Omega-3卻嚴重不足，這正是身體長期慢性發炎的根源！\n\n這時候補充魚油的 Omega-3\n幫皮膚滅火\n去穩定內分泌、緩解燥熱\n同時 保護心血管＋大腦清晰度 \n對記憶力反應 情緒也有益處❤️\n\n魚油對你幫助很大，因為他對痘痘有正面很多文獻報導是會幫助的"
      - question: "哺乳"
        answer: "親愛的❤️\n哺乳期間是非常適合補充魚油的時候喔！\n\n魚油中的 EPA 和 DHA 是寶寶大腦、視力發育的重要營養素\n也是幫助媽媽修復、抗發炎、穩定情緒的關鍵營養\n\n✔️ DHA：進入母乳 → 幫助寶寶腦部與視網膜發展\n✔️ EPA：幫助媽媽減少產後發炎、水腫、憂鬱、免疫失調\n\n也有研究顯示 補充魚油的媽咪\n寶寶氣管、皮膚過敏的機率也會下降💛\n\n哺乳媽咪每日建議攝取 Omega-3 至少1000–1500mg\n\n建議吃法每天2~3顆作為日常保養\n\n如果有以下情況 可以提升到3–4顆／天：\n－媽咪情緒緊繃或疲憊\n－容易發炎（水腫、痘痘、口乾、體虛）\n－寶寶還在全母乳階段 想讓 DHA 供應更充足\n\n魚油可以隨餐吃或者在一天最豐盛的那餐飯後食用～"
      - question: "一次吃四顆還是分兩次吃呢？"
        answer: "寶貝 都可以哦 一次吃和兩次吃都是一樣的 但是你吃之前要先吃含有油脂的食物唷\n\n比如酪梨、荷包蛋、鮭魚、雞腿排、堅果\n亞麻仁油拌飯、橄欖油拌菜也可以"
      - question: "月經不規律 \n纖維線瘤\n吃魚油有幫助嗎"
        answer: "妹妹\n妳有經期不規律＋曾經有纖維腺瘤的狀況\n這些和雌激素代謝不順＋慢性發炎有關\n補充魚油（Omega-3）\n對妳來說真的超級重要又適合✨\n\n🐟 魚油的Omega-3（尤其是EPA）\n有幾個重點對妳幫助很大\n✔️ 抗發炎，穩定乳房組織不再亂長東西\n✔️ 幫助荷爾蒙平衡，讓月經週期比較規律\n✔️ 改善經前脹痛、情緒不穩、循環不佳等症狀\n\n緩解因為發炎造成的荷爾蒙混亂\n逐步恢復正常的生理週期❤\n\n我非常推薦妹妹補充魚油\n\n根本改善慢性發炎，更能調理荷爾蒙\n\n每日持續吃魚油"
  - name: "瘦身粉"
    faqs:
      - question: "跟之前的酵素粉還有減糖粉是類似的功效嗎"
        answer: "完全不一樣唷\n\n減糖粉是幫助食物吃進去澱粉的吸收程度\n\n所以他是減少身體體吸收澱粉\n\n【閃澱設計】\n日本專利栗子皮：完美阻斷機制\n\n日本專利桑葉：幫助穩定波動\n\n日本專利苦瓜胜肽：高效平緩調理\n\n日本專利茶花：健康淨化順暢\n\n日本專利藤黃果：有感飽足穩控\n\n日本專利山葵葉：喚醒熱力平衡\n\n這個是我日本清纖粉，關於澱粉粉\n\n我是阻斷\n穩定血糖\n還有幫助糖分燃燒\n\n【阻油配方】\n日本仙人掌：解除膩感累積\n\n日本甲殼聚醣：幫助排便順暢\n\n日本專利魔芋：通暢清爽到底\n\n日本專利紫茶：有效促進代謝\n\n美國專利綜合酵素：高酵分解潔淨\n\n綠茶萃取物：溫和調理代謝\n\n\n\n這個是裡面關於油脂的專利成分\n\n主要做到的是分解代謝，仙人掌的部分是吸收\n\n那這個產品是放在飯前30分鐘以前可以斟酌自己吃東西食物的油脂或澱粉的多寡\n\n真的就是針對減肥的\n\n所以跟我之前合作過的這兩樣是完全不同的功能😘\n\n大家都很好也都很棒，因為都是我的想法，可是是主要解決的方式不一樣\n\n日本的專利復合配方在理論上更廣😍"
      - question: "如果已經有吃代謝錠跟薑黃了，再加這個會不會太強啊"
        answer: "寶貝\n\n這是飯前吃的\n\n會讓你的澱粉跟油脂被阻擋\n你可以放在大餐前吃啊😊\n--------\n至於代謝錠跟薑黃\n\n屬於飯後吃\n呵呵\n\n一個就類似像飯後喝水果醋的概念\n\n另外一個是飯後吃薑黃，增加身體的燃燒跟代謝\n--------\n並不會\n身體有任何負面的影響喔😘\n\n一個是先阻擋\n一個是助燃燒\n\n阻擋可以不用每天吃 選擇大餐前 也可以\n--------\n日本這個產品是姐姐第一個真的是針對瘦身的\n\n像代謝錠是身體有機蔬果三大酸的營養\n\n薑黃本身的薑黃素也是身體很需要的抗氧化物質\n--------\n姐姐七月底開賣在日本製造的瘦身產品\n\n真的就像你們跑去日本買飯前吃，不要讓食物的熱量放在身上的\n--------\n所以不是每天必須的營養成分，但可以是大吃大喝以前的降低卡洛里的武器"
      - question: "長期久坐 可以改善臀大的問題嗎"
        answer: "哈哈 妹妹 可以的\n\n但是因為姐姐這個設定是大餐前吃的\n如果你要每天當保健食品\n姐姐怕你會吃得太多預算\n所以你自己斟酌\n\n可以放在你這一餐澱粉吃的比較多\n或是脂肪比較多 較油膩的那餐吃"
      - question: "這款產品食用對胃跟腎臟肝臟會有負擔嘛"
        answer: "親愛的💕\n\n姊姊的日本清纖粉都是天然食物萃取＋專利配方\n\n全部都會代謝掉\n\n寶貝可以安心吃 不用擔心🔥"
      - question: "懷孕可以吃嗎 孕婦"
        answer: "你在懷孕過程當中\n\n如果吃的很多外食\n\n那瘦身粉可以輔助至少讓你身體多餘的糖分跟油脂可以被代謝\n-----------------\n妹妹可以觀察\n-----------------\n但你如果吃都是原型食物\n\n那就不用吃瘦身粉\n呵呵\n\n就像如果你吃鮭魚\n\n是你自己清蒸或者是煎好\n\n那你吃瘦身粉它等於把好的油脂給帶走了\n-----------------\n所以關於懷孕，如果你都是吃外面\n\n那他可以輔助\n至少讓你懷孕不會胖太多\n\n那如果你都自己吃自己煮，那我認為就不用了"
      - question: "備孕期可以嗎"
        answer: "可以"
      - question: "一天幾包\n一天上限"
        answer: "親愛的您好～🌷\n謝謝您的提問，清纖粉的使用方式非常彈性唷💛\n\n可以根據您的飲食內容與需求來調整補充次數。\n\n清纖粉主要是幫助減少澱粉與脂肪的吸收、促進腸道代謝，\n所以我們會建議放在當天那一餐「澱粉或油脂比較多」的時候使用，\n像是吃火鍋、燒肉、義大利麵、甜食、炸物等等，就很適合餐前吃1~2包唷！\n\n💡 它沒有特別限制一天最多幾包，一切可以依照您當天的飲食習慣與身體狀況做調整。"
      - question: "吃法 時效性"
        answer: "親愛的 餐前30到15分鐘是最棒的時間\n這樣是最有效的吃法"
      - question: "如果追問時間吃法"
        answer: "餐前時間太短或太長就沒有最佳效果\n\n最好是飯前30 分鐘前吃\n\n最晚飯前15分鐘"
      - question: "為什麼會變瘦？白話解釋"
        answer: "尤其是\n\n餐前吃瘦身粉能幫助變瘦\n\n主要是因為它在「進食前」先介入\n\n對身體的糖分與油脂吸收做了攔截和調控\n\n讓你在吃食物\n\n減少多餘熱量進去身體\n\n阻斷糖分與油脂吸收\n\n瘦身粉裡常含有萃取物\n阻斷澱粉分解\n抑制糖轉化成脂肪\n降低血糖波動等成分\n\n同步\n它們能在消化系統裡抑制酵素的作用\n減少糖類和油脂進入血液\n被轉化成脂肪的機會\n\n可以搭配飯後薑黃幫助\n養成熱量赤字\n\n長期少吸收一部分糖和油，等於每天默默減少熱量攝取\n\n熱量赤字累積下來，就會讓體重自然下降\n\n體脂肪也更容易減少\n就會變瘦"
  - name: "面膜"
    faqs:
      - question: "酒糟可以使用嗎"
        answer: "親愛的 我的可以\n\n姊姊的面膜無酒精、無香精、無酸類\n\n敏弱肌、酒糟肌或術後修復期都可以使用唷🔥"
      - question: "醫美後可以使用嗎"
        answer: "親愛的 我的可以\n\n姊姊的面膜無酒精、無香精、無酸類\n\n醫美術後可以使用\n\n或者你可以跟我說你做的療程 或者詢問醫生建議是最準確的"
      - question: "含酸嗎"
        answer: "不含💓"
      - question: "適合天天敷嗎"
        answer: "呵呵 我的可以\n\n但姊姊\n\n因為是生物纖維面膜\n\n不是一般的布面膜\n\n姐姐一盒有五片\n\n原價是1180\n\n品牌之夜是特價990\n\n姐姐認為你收到可以抓連續敷五天讓皮膚大升級\n\n或者是妝前保養\n\n如果要天天用的話\n\n反而是抓在白天洗完臉上妝前"
      - question: "12歲小孩能敷嗎😅青春期長好多痘痘🥹"
        answer: "寶貝\n我的面膜成分非常單純‼️不分年齡都可以敷喔❤️\n\n哈哈 但孩子用\n有點浪費😘因為裡面的成分都是非常高奢的精華"
      - question: "用完後要洗掉嗎"
        answer: "親愛的不需要洗掉💓"
  - name: "私密處保養"
    faqs:
      - question: "吃法"
        answer: "姊姊先跟你說吃法\n\n日常保養睡前吃一包 \n\n但如果有異味甚至搔癢的困擾 先幫姊姊早晚空腹各吃一包感受看看"
      - question: "哪兩種益生菌？"
        answer: "寶貝 ～謝謝你詢問姊姊的新產品🥰\n\n姊姊的私密處產品\n使用的是美國DDS-1 & 韓國Prolac-T 乳酸桿菌\n\n👉 美國 DDS-1 → 幫妳打底腸道＋免疫力\n👉 韓國 Prolac-T → 專攻私密處菌相，減少感染、改善異味\n\n補充這兩個「世界級專利菌株」好菌\n維持陰道與泌尿道的酸性環境"
      - question: "對於女生下面容易癢有效嗎？"
        answer: "寶貝～\n姊姊的私密處新產品\n裡面有 \n法國專利洛神花\n日本專利玻尿酸前驅物NAG\n以及日本專利野草莓籽，\n\n這三樣專利成分都有臨床人體實驗顯示\n能夠幫助改善私密處搔癢的不適感\n所以很適合唷💓\n\n有，因為可以改善念珠菌感染"
      - question: "是否全素"
        answer: "寶貝～\n不是唷 因為玻尿酸是雞冠萃取😊"
      - question: "是否含糖"
        answer: "寶貝～\n因為姐姐的配方都是做到足量的\n像是玻尿酸我直接加到最高劑量 80mg\n再搭配兩種益生菌、最高足量的前花青素\n以及甘露糖也給到最充足的份量\n\n如果完全不加調味 吃進去的味道會不好聞\n而且口感真的很難入口\n所以才需要稍微做一點調味\n讓你們能夠持續補充 不會覺得負擔\n\n而且如果要把這些營養全部做成膠囊\n一顆根本塞不進這麼多粉\n就得變成每天要吞好多顆膠囊\n對身體和習慣來說都比較不方便\n\n最重要的是～這些配方裡添加的糖分\n完全不會影響血糖\n也不會造成健康上的任何不良影響\n所以寶貝可以放心使用💕\n\n有 一包0.5"
      - question: "月經 生理期 可吃嗎\n\n✅可以"
        answer: "妹妹 在經期期間是可以安心補充的喔～\n\n裡面主要成分像玻尿酸、益生菌、前花青素、甘露糖\n\n都是屬於保養與調理型營養素\n\n並不是荷爾蒙類的成分\n\n所以不會影響月經週期或經血量\n\n！反而在經期時\n\n陰道環境的抵抗力會比較下降\n\n持續補充益生菌和蔓越莓等成分\n\n對私密處的防護更有幫助"
      - question: "請問胸部如果有水瘤可以吃？\n乳房囊腫\n\n✅可以"
        answer: "寶貝～胸部有水瘤的情況多數是良性的\n但還是要記得定期追蹤哦\n\n飲食上盡量清淡\n少油炸、少糖、少咖啡因\n這樣乳房會比較穩定\n\n保健品方面\n像 B 群、維E、魚油、益生菌都能幫助身體調整\n\n那針對妳問的私密處保養產品\n妹妹可以放心吃\n\n裡面主要成分像玻尿酸、益生菌、前花青素、甘露糖\n\n這些主要是幫助維持泌尿道與私密處的健康\n\n並不是荷爾蒙類的成分\n\n不會影響荷爾蒙\n\n也不會對乳房囊腫產生不良影響\n\n妹妹可以安心補充哦💖"
      - question: "有分泌物或白帶的情況也都會改善嗎"
        answer: "寶貝 🥰\n有分泌物或白帶的情況\n搭配我們這款私密防護配方\n會慢慢回到正常狀態\n甚至連量都會減少\n\n因為會改善念珠菌感染\n跟大腸菌改善還會根治\n\n很多女生客人吃了之後\n也都有回饋說分泌物、白帶的顏色、味道和量\n短期內都有改善\n\n🌸 為什麼有效？\n\n✔ 我一包有45mg蔓越莓 PACs\n → 阻止壞菌黏附\n\n✔ 1500mg甘露糖 \n→ 把壞菌沖刷掉\n\n✔美國DDS-1 & 韓國Prolac-T 乳酸桿菌 2合1益生菌 \n→ 建立好菌\n\n✔ 80mg日本專利玻尿酸 \n→ 私密處黏膜修復＋滋潤\n\n就算壞菌「大軍」想偷偷潛入，也會被以上完整配方防護徹底攔截！"
  - name: "常見問題（其他）"
    faqs:
      - question: "中租名單用：付款有問題"
        answer: "親愛的～  \n感謝你支持我們的產品❤️ \n\n我有注意到你申請了「中租零卡分期付款」，但系統顯示目前尚未完成付款～\n\n想說來關心一下親愛的，結帳過程中有沒有遇到什麼問題呢？\n有任何需要我們可以協助你哦✨\n\n親愛的～🤍\n\n感謝妳支持我們的產品❤️\n\n這邊有注意到妳申請了「中租零卡分期」，不過目前系統顯示訂單還沒有完成付款。\n\n想關心一下妳\n\n請問是在結帳過程中有遇到什麼問題嗎？還是有任何地方需要我們協助呢？\n\n如果有任何操作上的疑問，或是不知道怎麼完成付款，都可以直接跟我們說，我們會一步一步協助妳完成✨\n\n希望能讓妳順利收到期待已久的產品，也謝謝妳給我們服務妳的機會🤍"
      - question: "審核過了才出貨嗎"
