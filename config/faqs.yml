      - question: "請問塑身褲是比較偏褲襪嗎？\n可以直接單穿當瑜珈褲或健身褲嗎？"
        answer: "親愛的 姊姊塑身褲的比較偏向褲襪\n布料是來自日本的高彈性素材\n\n如果是做瑜伽或健身這種比較大量流汗或拉伸的運動\n我自己會選擇單穿瑜伽褲比較自在\n\n所以這款我會建議當作日常修飾或皮拉提斯可以穿\n做瑜伽或者運動時就讓身體自由一點 會更舒服唷😊\n\n這是我特別做給會員們五月份限定商品！\n早買早享受，跟我的洗臉機一樣！跟我的美容儀器一樣，都不是常態型的商品！\n如果季節怕穿了很熱或者不是在冷氣房的空間裡？也可以一路收藏到冬天拿出來穿唷！\n自己可以斟酌情況時間喔😍"
      - question: "會不會穿了有勒橫"
