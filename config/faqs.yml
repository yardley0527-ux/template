        answer: "除了洗澡的時候脫掉 平常可以穿12到18小時都沒有問題哦❤️‍🔥❤️‍🔥"
      - question: "多少錢？"
        answer: "親愛的，謝謝你詢問我的加壓雕線塑身褲💓\n我的塑身褲一條是3080，目前還有少量現貨，有興趣可以把握哦！\n\n賣場網址在這裡\nhttps://shorturl.at/lKb7a \n\n有任何問題都歡迎你隨時請教我喔😊\n\n妹妹真的超級值得買😍因為我是買下一批布料做2000雙🔥\n所以賣完了姐姐不開預購❤️除非預購的數量又超過2000雙！\n但我覺得這個機率很低🙌所以妹妹有喜歡真的可以收藏👏\n在日本測試這布料穿到兩年都不會變形喔！"
