        answer: "因為機器裡面有一顆鋰電池\n親愛的可以放在隨身行李帶上飛機\n請注意不能托運哦😊\n\n因為我們的機器裡面有一顆鋰電池\n建議放在隨身行李上飛機\n如果放到行李箱會被打開檢查\n怕會造成親愛的困擾\n所以親愛的可以放在隨身行李帶上飛機"
