        answer: "https://www.instagram.com/reel/DKM21Peh7La/?igsh=cGJ5dHJ1MHhzYms0"
      - question: "如何購買"
        answer: "哈囉親愛的 ❤️\n\n你是詢問哪一款按摩小物呢\n\n我的按摩器具目前是隨保健食品一起提供的，沒有單獨販售哦～\n\n目前我們的活動是全館滿5000贈美容棒，滿7000贈精美藥盒\n\n如果妳對保健食品有興趣，可以稍微看看我們的動態，這次搭配的四款保健食品是否符合妳現在的需求呢？\n例如 改善體重、睡眠、落髮或皮膚問題，我都可以幫妳做更精準的建議喔！\n\n妳也可以直接跟我說，妳目前有什麼想要解決的健康問題\n可以根據妳的需求，幫妳挑選適合的產品，順便獲得美容棒😊\n\n那很開心你喜歡我的影片\n親愛的一樣可以利用我的影片做按摩 有問題隨時請教我喔❤️\nhttps://www.instagram.com/shengting_official/\n\n哈囉親愛的 謝謝你留言詢問我的按摩小物❤️\n\n我沒有在販售這些按摩小物🥹\n\n這些都是隨著我每個月的保健食品給會員的組合禮物\n\n所以這部分未來你可以關注我的保健食品，如果你有喜歡的你可以下單在每個月的活動就會收到這個禮物"
      - question: "三角雀"
        answer: "哈囉寶貝 以下是利用三角雀針對臉部的手法文字給你參考😊\n\n這套刮痧手法做一次，臉直接小一圈！超適合早上消水腫、晚上提拉輪廓，學會這招，隨時維持女明星的緊緻感😝\n超有儀式感，滿滿的寵愛感💝！怎麼能不學起來，把姊姊美美的心意最大化？\n準備好你的專屬「愛的刮痧棒」，今天就來解鎖「臉部刮痧密碼」！\n\n🚨【刮痧黃金法則】\n🎯 刮痧前必須上精華油或乳霜！ 滑順度夠，才不會拉扯肌膚！\n🎯 刮痧方向一定要對，錯了不但沒用，還可能刮出細紋！\n🎯 每個區域來回刮5-10次，不要硬推，力度適中，微微發熱就對了！\n\n💎【神級臉部刮痧步驟】\n 🌟額頭刮痧：少女感up，細紋say bye！\n從眉心往上推到髮際線，額頭直接變得光滑亮透！想要額頭澎澎感的，這招必須學起來！\n\n🌟 眼周消腫提亮：直接拯救熬夜臉！\n用刮痧棒最細的邊，從眼頭沿著眼下滑向太陽穴，記得溫柔！一秒提亮眼神，黑眼圈bye bye！\n\n🌟 法令紋out！蘋果肌立刻嘭起來！\n從鼻翼開始，順著顴骨往太陽穴推，拉提效果無敵，法令紋不見了，蘋果肌變立體！\n\n🌟下顎線塑形：V臉神器，雙下巴走開！\n從下巴中央，沿著下顎骨往耳朵推，水腫直接刮走，輪廓出來了！化妝都省修容！\n\n🌟鎖骨淋巴疏通：疏通氣色，排毒超有效！\n從耳後順著脖子往鎖骨推，這步驟超重要！臉色變亮，全臉看起來精緻到發光！\n\n每一次刮痧，都是讓自己更美的一種儀式感！ 妹妹們！這份愛的刮痧棒，今天開始，每天都要用起來！\n每天按摩完，臉部狀態直接拉滿，360度無死角變美！趕快試試！刮完記得跟我說有多驚艷🥰"
      - question: "下半身如何按摩\n可以最有效促進循環呢"
        answer: "從腳底一直到小腿滑到大腿上面，然後每一個關節處你都可以滑60下🥰"
      - question: "彎月刮痧棒"
        answer: "親愛的 這款刮痧板可以全身用\n像是肩膀、脖子、手臂、大腿、肚子、屁股、腳底都可以\n每一個部位大約刮60下\n\n可以搭配身體油或乳液 刮的時候才不會拉扯皮膚\n方向都以由內往外、由下往上為主😊"
      - question: "雙推"
        answer: "這款可以拿來用頭皮或四肢🔥"
      - question: "刮痧按摩的方向順序是如何？"
        answer: "寶貝～刮痧或按摩的方向原則\n都是以由內往外、由下往上為主唷😊\n\n腿部是由腳踝往上刮到鼠蹊部\n手臂是由手腕往上刮到腋下\n這樣才能順著淋巴回流方向，把水腫跟代謝廢物往心臟送回去"
      - question: "按摩棒按摩，臉部不用先擦油或乳液嗎"
        answer: "如果是點穴類型的按摩 油或乳液可上可不上 因為這種按摩主要集中在特定穴位 力度也偏向按壓 不會對皮膚造成拉扯\n\n但如果是需要拉推的按摩手法 像是淋巴排毒或臉部塑形等 建議還是先擦上油或乳液 以減少摩擦 保護肌膚 並讓按摩過程更加順暢哦\n\n我的臉上是乳液跟油混在一起喔😍但是我按摩完會把它洗掉再上一次保養品🙌"
