        answer: "⚠️不建議把美容儀當成導入儀使用！\n\n使用美容儀之前，請先以最小電流，不要擦上任何保養品，試試看自己能夠接受的電流，再逐漸上調～\n\n想要加強的部位，可以擦一點點我們搭贈的瘦身霜！⚠️注意：敏感肌不要把瘦身霜擦在臉上～\n\n每天的保養方式，可以先使用機器推臉5-10分鐘，完成後，再上自己的保養品！"
