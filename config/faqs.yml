      - question: "付款方式"
        answer: "親愛的有提供下列付款方式唷✨\n✅Line pay\n✅Apple Pay\n✅信用卡\n✅信用卡分期\n✅銀行轉帳\n✅中租零卡分期\n\n我們現在也有信用卡以及無卡 3期/6期利率全部我們吸收 🔥\n\n圖卡給親愛的參考❤️ 有其他問題隨時請教我😊\n\n客人： 活動剩最後一天 因為價格上還是有點高 我小資女一直都在觀望 \n\n寶貝 你去申請無卡分期\n你不用用現金\n就可以把產品帶走了\n而且利息是我吸收\n你要分三期還是六期你每個月交給中租就好了\n因為中租跟你們收的利息是姐姐我吸收喔😍"
      - question: "序號無法使用"
        answer: "親愛的\n如果是使用Zingala銀角零卡付款\n可以在付款頁面輸入優惠序號喔！\n\n這個優惠只能在進入中租的付款頁面時輸入\n這邊附上圖卡步驟給妳參考"
      - question: "如何下單？"
        answer: "親愛的～下單方式請先到我們官網/賣場註冊會員\n再加入官方LINE，綁定行動會員卡\n就可以下單結帳囉～\n\n如果有訂單或付款的問題可以問客服 \nhttps://line.me/R/ti/p/@836vvxva \n如果是營養品怎麼吃、健康相關問題都可以問姊姊💛"
      - question: "購物金回饋是購買當下可以現抵的嗎？\n購物金是當下就會匯入了嗎？"
        answer: "親愛的❤️\n購物金是訂單完成後才入帳\n不能當下現抵 下次購物就可以使用💛\n\n親愛的❤️ \n購物金是訂單完成後匯入唷😊"
